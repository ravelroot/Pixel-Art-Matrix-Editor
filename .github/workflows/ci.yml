name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - ".github/atividade.txt"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  javascript:
    name: Editor (JavaScript)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Editor core tests
        run: npm test
      - name: Crivo.html up to date with the editor code
        run: npm run portable -- --check

  desktop:
    name: Desktop app (Crivo.exe)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.7"
          cache-dependency-path: desktop/go.sum
      - name: Crivo.exe up to date with the code (reproducible build)
        run: npm run desktop -- --check
      - name: Go code analysis
        working-directory: desktop
        env:
          GOOS: windows
          GOARCH: amd64
        run: go vet ./...

  quality:
    name: Quality and security (Ruff + Bandit)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt ruff bandit
      - name: Ruff (style, bugs and security)
        run: ruff check .
      - name: Bandit (Python security)
        run: bandit -q -r editor crivo -x editor/tests
      - name: Django production check
        env:
          CRIVO_DEBUG: "false"
          CRIVO_SECRET_KEY: ci-random-key-with-more-than-thirty-two-characters
          CRIVO_HTTPS: "true"
        run: python manage.py check --deploy --fail-level ERROR

  interface:
    name: Interface (Playwright)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt playwright
      - run: python -m playwright install --with-deps chromium
      - name: Editor end-to-end test
        run: python -m unittest discover -s tests/e2e -v

  django:
    name: API (Django + PostgreSQL)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: crivo
          POSTGRES_USER: crivo
          POSTGRES_PASSWORD: crivo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U crivo"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      CRIVO_DB_ENGINE: postgresql
      CRIVO_DB_HOST: localhost
      CRIVO_DB_NAME: crivo
      CRIVO_DB_USER: crivo
      CRIVO_DB_PASSWORD: crivo
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Check migrations
        run: python manage.py makemigrations --check --dry-run
      - name: API tests
        run: python manage.py test editor -v 2

  java:
    name: Command-line tool (Java)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Command-line tests
        run: bash tools/java/test.sh
      - name: Render the example sheets
        run: |
          for file in examples/*.crivo; do
            bash tools/java/crivo.sh sheet "$file" "sheets/$(basename "$file" .crivo).png" --scale 4 --spacing 2
          done
      - uses: actions/upload-artifact@v4
        with:
          name: example-sheets
          path: sheets/
          retention-days: 7

  docker:
    name: Docker image
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Build the image
        run: docker build -t crivo:ci .
