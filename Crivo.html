html,

.hex {

}

.campo > span {

}

.campo.compacto {
  grid-template-columns: 62px 1fr auto;
  align-items: center;
  gap: 8px;
}

.campo.compacto output {
  min-width: 36px;
  text-align: right;
  font-size: 12px;
}

.campo-marcar {
  display: flex;
  align-items: center;
  gap: 8px;
}

.campo-marcar > span {

}

.rotulo-pequeno {

  color: var(--texto-fraco);

}

  grid-template-columns: repeat(auto-fill, minmax(22px, 1fr));

}

.amostras .vazio {
  grid-column: 1 / -1;
  font-size: 12px;
  color: var(--texto-fraco);
}

.amostra {
  aspect-ratio: 1;
  min-width: 0;
  padding: 0;
  border: 1px solid rgba(0, 0, 0, 0.18);
  border-radius: 3px;
  background: linear-gradient(var(--cor), var(--cor)), repeating-conic-gradient(#ddd3c3 0 25%, #f4efe6 0 50%) 0 0 / 8px 8px;
  cursor: pointer;
}

.amostra:hover {
  transform: scale(1.12);
  z-index: 1;
  position: relative;
}

.amostra.ativa {
  outline: 2px solid var(--texto);
  outline-offset: 1px;
}

.amostra.base {

.paleta {

.painel select {

.paleta-info {

}

#painel-tons .campo.compacto {

.acoes-linha {

  flex-wrap: wrap;
  gap: 4px;

}

.acoes-linha.icones {
  justify-content: space-between;
}

.botao {
  padding: 6px 14px;
  background: var(--superficie-2);
  border: 1px solid var(--borda-forte);
  border-radius: var(--raio);
  cursor: pointer;
}

.botao:hover:not(:disabled) {
  border-color: var(--destaque);
}

.botao:disabled {
  opacity: 0.4;
  cursor: default;
}

.botao.pequeno {
  padding: 3px 9px;

.botao.primario {
  background: var(--destaque);

  color: var(--destaque-texto);
}

.botao.perigo {

}

.lista-camadas {
  list-style: none;
  margin: 0;
  padding: 0;
  display: grid;
  gap: 3px;
  max-height: 260px;
  overflow-y: auto;
}

.camada {
  display: grid;
  grid-template-columns: 30px 30px 1fr auto 30px;
  align-items: center;
  gap: 4px;
  padding: 3px 4px;
  border: 1px solid var(--borda);
  border-radius: var(--raio);
  background: var(--superficie-2);
  cursor: pointer;
}

.camada.ativa {
  border-color: var(--destaque);
  background: var(--selecao);
  box-shadow: inset 3px 0 0 var(--destaque);
}

.camada.oculta .nome,
.camada.oculta .mini {

}

.camada .nome {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.camada .mini,
.quadro .mini {
  background: repeating-conic-gradient(#ddd3c3 0 25%, #f4efe6 0 50%) 0 0 / 8px 8px;
  border: 1px solid var(--borda);
  border-radius: 3px;
  image-rendering: pixelated;
}

.etiqueta {
  font-size: 11px;
  color: var(--texto-fraco);
  font-family: var(--mono);
}

.linha-tempo {
  grid-area: tempo;
  display: flex;
  gap: 12px;
  align-items: center;
  padding: 8px 12px;
  background: var(--superficie);
  border-top: 1px solid var(--borda);
  min-width: 0;
}

.tempo-controles {
  display: flex;
  align-items: center;
  gap: 4px;
  flex: none;
}

.campo.compacto.fps-campo {
  grid-template-columns: auto 64px;
  gap: 6px;
}

.fps {
  width: 64px;
}

.lista-quadros {
  list-style: none;
  margin: 0;
  padding: 2px;
  display: flex;
  gap: 6px;
  overflow-x: auto;
  min-width: 0;
  scrollbar-width: thin;
}

.quadro {
  position: relative;
  flex: none;
  padding: 3px;
  border: 1px solid var(--borda);
  border-radius: var(--raio);
  background: var(--superficie-2);
  cursor: pointer;
}

.quadro .mini {
  display: block;
  width: 48px;
  height: 48px;
}

.quadro.ativa {
  border-color: var(--destaque);
  box-shadow: 0 0 0 2px var(--destaque);
}

.quadro .numero {
  position: absolute;
  right: 4px;
  bottom: 3px;
  padding: 0 4px;
  font: 11px var(--mono);
  background: var(--superficie-2);
  border-radius: 3px;
}

.status {
  grid-area: status;
  display: flex;
  align-items: center;
  gap: 18px;
  padding: 0 12px;
  font-size: 12px;
  color: var(--texto-suave);
  background: var(--superficie-2);
  border-top: 1px solid var(--borda);
  white-space: nowrap;
  overflow: hidden;
}

.status-cor {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  min-width: 110px;
}

.status-cor:not(:empty)::before {
  content: '';
  width: 12px;
  height: 12px;
  border: 1px solid var(--borda-forte);
  border-radius: 2px;
  background: linear-gradient(var(--cor), var(--cor)), repeating-conic-gradient(#ddd3c3 0 25%, #f4efe6 0 50%) 0 0 / 6px 6px;
}

.status-armazenamento {
  margin-left: auto;
  display: inline-flex;
  align-items: center;
  gap: 4px;
}

.avisos {
  position: fixed;
  right: 16px;
  bottom: 40px;
  display: grid;
  gap: 8px;
  z-index: 100;
  pointer-events: none;
}

.aviso {
  max-width: 380px;
  padding: 9px 14px;
  background: var(--texto);
  color: var(--fundo);
  border-radius: var(--raio);
  box-shadow: var(--sombra);
  animation: entrar 0.18s ease-out;
  transition: opacity 0.3s, transform 0.3s;
}

.aviso-sucesso {
  border-left: 4px solid var(--secundario);
}

.aviso-alerta {
  border-left: 4px solid var(--palha);
}

.aviso-erro {
  border-left: 4px solid #e08a7c;
}

.aviso.saindo {
  opacity: 0;
  transform: translateY(6px);
}

@keyframes entrar {
  from {
    opacity: 0;
    transform: translateY(8px);
  }
}

.dialogo {
  width: min(520px, calc(100vw - 32px));
  max-height: calc(100vh - 48px);
  padding: 0;
  color: var(--texto);
  background: var(--superficie-2);
  border: 1px solid var(--borda-forte);
  border-radius: 10px;
  box-shadow: var(--sombra);
}

.dialogo.largo {
  width: min(760px, calc(100vw - 32px));
}

.dialogo::backdrop {
  background: rgba(30, 18, 14, 0.45);
}

.dialogo-form {
  display: flex;
  flex-direction: column;

    for (const c of doc.camadas) {
      if (!doc.temCelula(q.id, c.id)) continue;

    formato: FORMATO,
    versao: VERSAO_FORMATO,
    nome: doc.nome,
    largura: doc.largura,
    altura: doc.altura,
    fps: doc.fps,
    paleta: doc.paleta.map((c) => corParaHex(c)),
    camadas: doc.camadas.map((c) => ({
      id: c.id,
      nome: c.nome,
      visivel: c.visivel,
      opacidade: c.opacidade,
      bloqueada: c.bloqueada,

    fps: Math.min(60, Math.max(1, Number(dados.fps) || 8)),
    vazio: true,
  });

  for (const c of dados.camadas || []) {
    if (!c.id || ids.has(c.id)) throw new Error('Camadas com identificador repetido.');
    ids.add(c.id);
    doc.camadas.push({
      id: String(c.id),
      nome: String(c.nome || 'Camada').slice(0, 80),
      visivel: c.visivel !== false,
      opacidade: Math.min(100, Math.max(0, Number(c.opacidade ?? 100))),
      bloqueada: Boolean(c.bloqueada),

  for (const q of dados.quadros || []) {
    if (!q.id || ids.has(q.id)) throw new Error('Quadros com identificador repetido.');
    ids.add(q.id);
    doc.quadros.push({ id: String(q.id), duracao: q.duracao ? Number(q.duracao) : null });

// Normaliza dois cantos (em qualquer ordem) num retângulo { x, y, largura, altura } recortado à matriz.
function retanguloDe(x0, y0, x1, y1, larguraDoc, alturaDoc) {
  let xa = Math.max(0, Math.min(x0, x1));
  let ya = Math.max(0, Math.min(y0, y1));
  let xb = Math.min(larguraDoc - 1, Math.max(x0, x1));
  let yb = Math.min(alturaDoc - 1, Math.max(y0, y1));
  if (xb < xa || yb < ya) return null;
  return { x: xa, y: ya, largura: xb - xa + 1, altura: yb - ya + 1 };

// Recorta um retângulo qualquer (pode estar fora da matriz) aos limites do documento.
function recortarAoDocumento(r, larguraDoc, alturaDoc) {
  if (!r) return null;
  return retanguloDe(r.x, r.y, r.x + r.largura - 1, r.y + r.altura - 1, larguraDoc, alturaDoc);

  return !r || (x >= r.x && y >= r.y && x < r.x + r.largura && y < r.y + r.altura);

function extrairRegiao(pixels, larguraDoc, r) {
  const saida = new Uint32Array(r.largura * r.altura);
  for (let y = 0; y < r.altura; y++) {
    const inicio = (r.y + y) * larguraDoc + r.x;

  }
  return { largura: r.largura, altura: r.altura, pixels: saida };

// Com somenteOpacos, pixels transparentes da região não apagam o que está embaixo.
function colarRegiao(regiao, larguraDoc, alturaDoc, x0, y0, pintar, { somenteOpacos = false } = {}) {
  for (let y = 0; y < regiao.altura; y++) {
    const ty = y0 + y;
    if (ty < 0 || ty >= alturaDoc) continue;
    for (let x = 0; x < regiao.largura; x++) {
      const tx = x0 + x;
      if (tx < 0 || tx >= larguraDoc) continue;

  for (let y = area.y; y < area.y + area.altura; y++) for (let x = area.x; x < area.x + area.largura; x++) saida[k++] = y * larguraDoc + x;

function limitesDoConteudo(matrizes, largura, altura) {

  let ya = altura;

  let yb = -1;

      for (let x = 0; x < largura; x++) {

        if (x < xa) xa = x;
        if (x > xb) xb = x;

        if (y > yb) yb = y;

const LIMIAR_CELULA = 2048;

class Traco {
  constructor(chave, pixels) {
    this.chave = chave;
    this.pixels = pixels;
    this.originais = new Map();
  }

  pintar(indice, cor) {
    const atual = this.pixels[indice];
    if (atual === cor) return false;
    if (!this.originais.has(indice)) this.originais.set(indice, atual);
    this.pixels[indice] = cor;
    return true;
  }

  get vazio() {
    for (const [i, antes] of this.originais) if (this.pixels[i] !== antes) return false;
    return true;
  }

  desfazerVisual() {
    for (const [i, antes] of this.originais) this.pixels[i] = antes;
    this.originais.clear();
  }

  concluir(rotulo) {
    const mudancas = [];
    for (const [i, antes] of this.originais) if (this.pixels[i] !== antes) mudancas.push(i);
    if (!mudancas.length) return null;
    mudancas.sort((a, b) => a - b);
    if (mudancas.length > LIMIAR_CELULA) {
      const antes = this.pixels.slice();
      for (const i of mudancas) antes[i] = this.originais.get(i);
      return { tipo: 'celula', rotulo, chave: this.chave, antes: codificarRLE(antes), depois: codificarRLE(this.pixels) };
    }
    const indices = Uint32Array.from(mudancas);
    const antes = new Uint32Array(indices.length);
    const depois = new Uint32Array(indices.length);
    for (let k = 0; k < indices.length; k++) {
      antes[k] = this.originais.get(indices[k]);
      depois[k] = this.pixels[indices[k]];
    }
    return { tipo: 'pixels', rotulo, chave: this.chave, indices, antes, depois };
  }
}

function tamanhoDaEntrada(e) {
  if (e.tipo === 'pixels') return e.indices.byteLength + e.antes.byteLength + e.depois.byteLength + 96;
  if (e.tipo === 'celula') return e.antes.byteLength + e.depois.byteLength + 96;
  if (e.tipo === 'estado') return Documento.bytesDoInstantaneo(e.antes) + Documento.bytesDoInstantaneo(e.depois);
  if (e.tipo === 'grupo') return e.entradas.reduce((s, x) => s + tamanhoDaEntrada(x), 32);
  return 64;
}

function aplicar(doc, e, lado) {
  if (e.tipo === 'pixels') {
    const px = doc.celulaPorChave(e.chave);
    const valores = e[lado];
    for (let k = 0; k < e.indices.length; k++) px[e.indices[k]] = valores[k];
  } else if (e.tipo === 'celula') {
    const px = doc.celulaPorChave(e.chave);
    px.set(decodificarRLE(e[lado], px.length));
  } else if (e.tipo === 'estado') {
    doc.restaurar(e[lado]);
  } else if (e.tipo === 'grupo') {
    const ordem = lado === 'antes' ? [...e.entradas].reverse() : e.entradas;
    for (const x of ordem) aplicar(doc, x, lado);

class Historico {
  constructor() {
    this.limpar();
  }

  limpar() {
    this.passado = [];
    this.futuro = [];
    this.bytes = 0;
    this.versao = 0;
  }

  registrar(entrada, contexto = null) {
    if (!entrada) return;
    entrada.bytes = tamanhoDaEntrada(entrada);
    entrada.contexto = contexto;
    for (const e of this.futuro) this.bytes -= e.bytes;
    this.futuro = [];
    this.passado.push(entrada);
    this.bytes += entrada.bytes;
    this.versao++;
  }

  registrarEstado(rotulo, antes, depois, contexto = null) {
    this.registrar({ tipo: 'estado', rotulo, antes, depois }, contexto);
  }

  get podeDesfazer() {
    return this.passado.length > 0;
  }

  get podeRefazer() {
    return this.futuro.length > 0;
  }

  get proximoDesfazer() {
    return this.passado.at(-1)?.rotulo ?? null;
  }

  get proximoRefazer() {
    return this.futuro.at(-1)?.rotulo ?? null;
  }

  desfazer(doc) {
    const e = this.passado.pop();
    if (!e) return null;
    aplicar(doc, e, 'antes');
    this.futuro.push(e);
    this.versao++;
    return e;
  }

  refazer(doc) {
    const e = this.futuro.pop();
    if (!e) return null;
    aplicar(doc, e, 'depois');
    this.passado.push(e);
    this.versao++;
    return e;
  }

modulos["js/ui/util.js"] = (() => {
function el(tag, atributos = {}, ...filhos) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(atributos || {})) {
    if (v === undefined || v === null || v === false) continue;
    if (k === 'class') n.className = v;
    else if (k === 'html') n.innerHTML = v;
    else if (k === 'texto') n.textContent = v;
    else if (k === 'estilo') {
      for (const [prop, valor] of Object.entries(v)) {
        if (prop.startsWith('--')) n.style.setProperty(prop, valor);
        else n.style[prop] = valor;
      }
    }
    else if (k === 'dados') Object.assign(n.dataset, v);
    else if (k.startsWith('on') && typeof v === 'function') n.addEventListener(k.slice(2), v);
    else if (v === true) n.setAttribute(k, '');
    else n.setAttribute(k, v);
  }
  for (const f of filhos.flat()) {
    if (f === null || f === undefined || f === false) continue;
    n.append(f instanceof Node ? f : document.createTextNode(String(f)));
  }
  return n;
}

const $ = (seletor, raiz = document) => raiz.querySelector(seletor);
const $$ = (seletor, raiz = document) => [...raiz.querySelectorAll(seletor)];

function avisar(texto, tipo = 'info', duracao = 3200) {
  const area = document.getElementById('avisos');
  if (!area) return;
  const aviso = el('div', { class: `aviso aviso-${tipo}`, role: tipo === 'erro' ? 'alert' : 'status' }, texto);
  area.append(aviso);
  while (area.children.length > 3) area.firstElementChild.remove();
  setTimeout(() => {
    aviso.classList.add('saindo');
    setTimeout(() => aviso.remove(), 300);
  }, duracao);
}

function baixarBlob(blob, nome) {
  const url = URL.createObjectURL(blob);
  const a = el('a', { href: url, download: nome });
  document.body.append(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}

function baixarTexto(texto, nome, tipo = 'text/plain') {
  baixarBlob(new Blob([texto], { type: `${tipo};charset=utf-8` }), nome);
}

function escolherArquivo(aceita, multiplos = false) {
  return new Promise((resolver) => {
    const input = el('input', { type: 'file', accept: aceita, multiple: multiplos, estilo: { display: 'none' } });
    input.addEventListener('change', () => {
      resolver(multiplos ? [...input.files] : input.files[0] ?? null);
      input.remove();
    });
    input.addEventListener('cancel', () => {
      resolver(multiplos ? [] : null);
      input.remove();
    });
    document.body.append(input);
    input.click();
  });
}

function lerTexto(arquivo) {
  return arquivo.text();
}

function formatarBytes(n) {
  if (n < 1024) return `${n} B`;
  if (n < 1024 * 1024) return `${(n / 1024).toFixed(1).replace('.', ',')} KB`;
  return `${(n / 1024 / 1024).toFixed(1).replace('.', ',')} MB`;
}

function formatarData(iso) {
  try {
    return new Date(iso).toLocaleString('pt-BR', { dateStyle: 'short', timeStyle: 'short' });
  } catch {
    return iso;
  }
}

function atrasar(fn, ms) {
  let t = null;
  const chamada = (...args) => {
    clearTimeout(t);
    t = setTimeout(() => fn(...args), ms);
  };
  chamada.cancelar = () => clearTimeout(t);
  return chamada;
}

function lerPreferencia(chave, padrao) {
  try {
    const v = localStorage.getItem('crivo.' + chave);
    return v === null ? padrao : JSON.parse(v);
  } catch {
    return padrao;
  }
}

function gravarPreferencia(chave, valor) {
  try {

  } catch {

  }

}

function campoSelecao(rotulo, opcoes, valor) {

function campoMarcar(rotulo, marcado) {

  return { rotulo: el('label', { class: 'campo campo-marcar' }, input, el('span', {}, rotulo)), input };

return { el, $, $$, avisar, baixarBlob, baixarTexto, escolherArquivo, lerTexto, formatarBytes, formatarData, atrasar, lerPreferencia, gravarPreferencia, campoNumero, campoSelecao, campoMarcar };
})();

  simetria: ['nenhuma', 'horizontal', 'vertical', 'ambas'],
  conectividade: [4, 8],
  amostra: ['camada', 'todas'],

  const dx = Math.abs(x1 - x0);
  const dy = -Math.abs(y1 - y0);

  const sy = y0 < y1 ? 1 : -1;
  let erro = dx + dy;

    ponto(x0, y0);
    if (x0 === x1 && y0 === y1) return;
    const e2 = 2 * erro;
    if (e2 >= dy) {
      erro += dy;
      x0 += sx;
    }
    if (e2 <= dx) {
      erro += dx;
      y0 += sy;
    }
  }

function retangulo(x0, y0, x1, y1, preenchido, ponto) {
  const xa = Math.min(x0, x1);
  const xb = Math.max(x0, x1);
  const ya = Math.min(y0, y1);
  const yb = Math.max(y0, y1);
  if (preenchido) {
    for (let y = ya; y <= yb; y++) for (let x = xa; x <= xb; x++) ponto(x, y);
    return;
  }
  for (let x = xa; x <= xb; x++) {
    ponto(x, ya);
    if (yb !== ya) ponto(x, yb);
  }
  for (let y = ya + 1; y < yb; y++) {

    if (xb !== xa) ponto(xb, y);
  }

function elipse(x0, y0, x1, y1, preenchido, ponto) {
  let a = Math.abs(x1 - x0);
  const b = Math.abs(y1 - y0);

  let dx = 4 * (1 - a) * b * b;
  let dy = 4 * (b1 + 1) * a * a;
  let erro = dx + dy + b1 * a * a;
  if (x0 > x1) {
    x0 = x1;
    x1 += a;
  }
  if (y0 > y1) y0 = y1;
  y0 += (b + 1) >> 1;
  y1 = y0 - b1;
  a = 8 * a * a;
  b1 = 8 * b * b;

    for (let x = xa; x <= xb; x++) ponto(x, y);

    if (preenchido) {
      faixa(x0, x1, y0);
      faixa(x0, x1, y1);

      ponto(x0, y0);
      ponto(x0, y1);
      ponto(x1, y1);

      y0++;
      y1--;
      dy += a;
      erro += dy;

      x1--;

      erro += dx;

      faixa(x0 - 1, x1 + 1, y1--);

    if (((alvo >>> 24) & 255) === 0) return (c) => ((c >>> 24) & 255) === 0;
    return (c) => c === alvo;
  }
  return (c) => distancia(c, alvo) <= tolerancia;
}

function regiao(pixels, largura, altura, x, y, { conectividade = 4, tolerancia = 0, contiguo = true } = {}) {
  if (x < 0 || y < 0 || x >= largura || y >= altura) return new Uint32Array(0);
  const igual = comparador(pixels[y * largura + x], tolerancia);
  if (!contiguo) {
    const todos = [];
    for (let i = 0; i < pixels.length; i++) if (igual(pixels[i])) todos.push(i);
    return Uint32Array.from(todos);
  }
  const visitado = new Uint8Array(largura * altura);
  const encontrados = [];
  const pilha = [x, y];
  const diagonal = conectividade === 8;
  while (pilha.length) {
    const cy = pilha.pop();
    const cx = pilha.pop();
    const base = cy * largura;
    if (visitado[base + cx] || !igual(pixels[base + cx])) continue;
    let xi = cx;
    while (xi > 0 && !visitado[base + xi - 1] && igual(pixels[base + xi - 1])) xi--;
    let xf = cx;
    while (xf < largura - 1 && !visitado[base + xf + 1] && igual(pixels[base + xf + 1])) xf++;
    for (let i = xi; i <= xf; i++) {
      visitado[base + i] = 1;
      encontrados.push(base + i);
    }
    const de = diagonal ? Math.max(0, xi - 1) : xi;
    const ate = diagonal ? Math.min(largura - 1, xf + 1) : xf;
    for (let ny = cy - 1; ny <= cy + 1; ny += 2) {
      if (ny < 0 || ny >= altura) continue;
      const nb = ny * largura;
      let emFaixa = false;
      for (let i = de; i <= ate; i++) {
        const livre = !visitado[nb + i] && igual(pixels[nb + i]);
        if (livre && !emFaixa) {
          pilha.push(i, ny);
          emFaixa = true;
        } else if (!livre) {
          emFaixa = false;
        }
      }
    }
  }
  return Uint32Array.from(encontrados);

  const alterados = [];
  for (const i of indices) {
    if (pixels[i] !== cor) {
      pixels[i] = cor;
      alterados.push(i);

// Pontilhado ordenado (dithering) com matrizes de Bayer.
// Cada célula da matriz guarda um limiar entre 0 e 1; um pixel recebe a cor "de cima"
// quando o valor (densidade ou t do degradê) passa do limiar da sua posição.

function bayer(n) {
  if (n === 1) return [[0]];
  const m = bayer(n / 2);
  const t = n / 2;
  const r = Array.from({ length: n }, () => Array(n).fill(0));
  for (let y = 0; y < t; y++) {
    for (let x = 0; x < t; x++) {
      const v = 4 * m[y][x];
      r[y][x] = v;
      r[y][x + t] = v + 2;
      r[y + t][x] = v + 3;
      r[y + t][x + t] = v + 1;
    }
  }
  return r;
}

const BAYER = {
  2: bayer(2),
  4: bayer(4),
  8: bayer(8),
};

// Limiar normalizado no centro de cada degrau: (v + 0.5) / n².
function limiarBayer(x, y, n = 4) {
  const m = BAYER[n] ?? BAYER[4];
  const yy = ((y % n) + n) % n;
  const xx = ((x % n) + n) % n;
  return (m[yy][xx] + 0.5) / (n * n);
}

// Pincel de pontilhado: true quando o pixel (x, y) recebe a cor primária para a densidade dada (0 a 1).
function pixelDoPadrao(x, y, densidade, n = 4) {
  return limiarBayer(x, y, n) < densidade;
}

// Valor t (0 a 1) de um degradê linear de A até B no pixel (x, y): projeção do vetor AP sobre AB.
function degradeLinear(x, y, ax, ay, bx, by) {
  const dx = bx - ax;
  const dy = by - ay;
  const comprimento2 = dx * dx + dy * dy;
  if (comprimento2 === 0) return 0;
  const t = ((x - ax) * dx + (y - ay) * dy) / comprimento2;
  return t < 0 ? 0 : t > 1 ? 1 : t;
}

// Valor t (0 a 1) de um degradê radial com centro A e raio |AB|.
function degradeRadial(x, y, ax, ay, bx, by) {
  const raio = Math.hypot(bx - ax, by - ay);
  if (raio === 0) return 0;
  const t = Math.hypot(x - ax, y - ay) / raio;
  return t > 1 ? 1 : t;
}

// Escolhe entre as cores de início e fim para o pixel (x, y) com o valor t, usando o pontilhado ordenado.
function corDoDegrade(x, y, t, inicio, fim, n = 4) {
  return t > limiarBayer(x, y, n) ? fim : inicio;
}

// Calcula o degradê inteiro numa lista de índices (ou na matriz toda) e devolve pares [índice, cor].
function degrade(largura, altura, { ax, ay, bx, by, tipo = 'linear', matriz = 4, inicio, fim, indices = null }) {
  const valor = tipo === 'radial' ? degradeRadial : degradeLinear;
  const resultado = [];
  const visitar = (i) => {
    const x = i % largura;
    const y = (i / largura) | 0;
    resultado.push([i, corDoDegrade(x, y, valor(x + 0.5, y + 0.5, ax + 0.5, ay + 0.5, bx + 0.5, by + 0.5), inicio, fim, matriz)]);
  };
  if (indices) for (const i of indices) visitar(i);
  else for (let i = 0; i < largura * altura; i++) visitar(i);
  return resultado;
}
return { BAYER, limiarBayer, pixelDoPadrao, degradeLinear, degradeRadial, corDoDegrade, degrade };

const FERRAMENTAS = [

  { id: 'borracha', nome: 'Borracha', atalho: 'E', icone: 'borracha', opcoes: ['tamanho', 'forma', 'modoBorracha'] },
  { id: 'balde', nome: 'Balde de tinta', atalho: 'F', icone: 'balde', opcoes: ['conectividade', 'tolerancia', 'contiguo', 'amostra'] },

  { id: 'pontilhado', nome: 'Pontilhado', atalho: 'D', icone: 'pontilhado', opcoes: ['tamanho', 'forma', 'densidade', 'fundoPontilhado'] },

  { id: 'selecao', nome: 'Seleção retangular', atalho: 'S', icone: 'selecao', opcoes: [] },
  { id: 'moverPixels', nome: 'Mover pixels', atalho: 'V', icone: 'moverPixels', opcoes: [] },
  { id: 'mover', nome: 'Mover a visão', atalho: 'H', icone: 'mover', opcoes: [] },

const PINCEIS = ['lapis', 'borracha', 'pontilhado', 'sombra'];
const ROTULOS = { lapis: 'Lápis', borracha: 'Borracha', pontilhado: 'Pontilhado', sombra: 'Clarear e escurecer' };

class Controlador {
  constructor(editor, visor) {
    this.editor = editor;
    this.visor = visor;
    this.ativo = null;
    this.espaco = false;
    this.ultimoPonto = null;
    this.paleta = () => [];
    const c = visor.canvas;
    c.addEventListener('pointerdown', (e) => this.baixar(e));
    c.addEventListener('pointermove', (e) => this.moverPonteiro(e));
    c.addEventListener('pointerup', (e) => this.soltar(e));
    c.addEventListener('pointercancel', (e) => this.soltar(e, true));
    c.addEventListener('pointerleave', () => {
      if (!this.ativo) {
        this.visor.definirCursor(null);
        this.editor.emitir('ponteiro', null);
      }
    });
    c.addEventListener('contextmenu', (e) => e.preventDefault());
    c.addEventListener(
      'wheel',
      (e) => {
        e.preventDefault();
        const r = c.getBoundingClientRect();
        if (e.ctrlKey || Math.abs(e.deltaY) >= Math.abs(e.deltaX)) {
          if (e.shiftKey && !e.ctrlKey) this.visor.mover(-e.deltaY, 0);
          else this.visor.passoZoom(e.deltaY < 0 ? 1 : -1, e.clientX - r.left, e.clientY - r.top);
        } else {
          this.visor.mover(-e.deltaX, -e.deltaY);
        }
      },
      { passive: false },
    );
    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space' && !e.repeat && !this.campoEmFoco(e)) {
        this.espaco = true;
        c.classList.add('arrastando');
        e.preventDefault();
      }
    });
    window.addEventListener('keyup', (e) => {
      if (e.code === 'Space') {

        c.classList.remove('arrastando');

  campoEmFoco(e) {

  get estado() {
    return this.editor.estado;
  }

  cor(botao) {
    return botao === 2 ? this.estado.corSecundaria : this.estado.corPrimaria;
  }

  baixar(e) {
    if (this.ativo) return;
    const p = this.visor.telaParaMatriz(e.clientX, e.clientY);
    this.visor.canvas.setPointerCapture(e.pointerId);
    const ferramenta = this.estado.ferramenta;
    if (e.button === 1 || this.espaco || ferramenta === 'mover') {
      this.ativo = { tipo: 'pan', x: e.clientX, y: e.clientY };
      this.visor.canvas.classList.add('arrastando');
      return;
    }
    if (e.button !== 0 && e.button !== 2) return;
    if (e.altKey && ['lapis', 'borracha', 'balde', 'linha', 'retangulo', 'elipse', 'pontilhado', 'degrade'].includes(ferramenta)) {
      this.amostrar(p, e.button);
      this.ativo = { tipo: 'amostra', botao: e.button };
      return;
    }
    const botao = e.button;
    if (ferramenta === 'contaGotas') {
      this.amostrar(p, botao);
      this.ativo = { tipo: 'amostra', botao };
      return;
    }
    if (ferramenta === 'balde') {
      this.balde(p, botao);
      return;
    }
    if (ferramenta === 'selecao') {
      this.ativo = { tipo: 'selecao', inicio: p, fim: p, arrastou: false, anterior: this.editor.selecao };
      return;
    }
    if (ferramenta === 'moverPixels') {
      this.iniciarMovimento(p);
      return;
    }
    const traco = this.editor.novoTraco();
    if (!traco) return;
    if (ferramenta === 'degrade') {
      this.ativo = { tipo: 'degrade', traco, botao, inicio: p, fim: p, pedido: 0 };
      return;
    }
    if (PINCEIS.includes(ferramenta)) {
      const cor = this.corDoPincel(ferramenta, botao, traco);
      const pixelPerfect = ferramenta === 'lapis' && this.estado.pixelPerfect && this.estado.tamanho === 1;
      this.ativo = { tipo: 'traco', traco, cor, ultimo: p, pixelPerfect, pontos: [[p.x, p.y]] };
      if (e.shiftKey && this.ultimoPonto) linha(this.ultimoPonto.x, this.ultimoPonto.y, p.x, p.y, (x, y) => this.carimbar(traco, x, y, cor));
      else this.carimbar(traco, p.x, p.y, cor);
      this.editor.emitir('pixels');
      return;
    }
    const cor = this.cor(botao);

  // Cor fixa (lápis, borracha) ou função (x, y, índice) => cor | null (pontilhado, clarear e escurecer).
  corDoPincel(ferramenta, botao, traco) {
    if (ferramenta === 'borracha') return this.corBorracha(botao);
    if (ferramenta === 'lapis') return this.cor(botao);
    if (ferramenta === 'pontilhado') {
      const frente = this.cor(botao);
      const fundo = this.cor(botao === 2 ? 0 : 2);
      const densidade = this.estado.densidade / 100;
      const usaFundo = this.estado.fundoPontilhado === 'secundaria';
      return (x, y) => (pixelDoPadrao(x, y, densidade) ? frente : usaFundo ? fundo : null);
    }
    const direcao = botao === 2 ? -1 : 1;
    const tocados = new Set();
    const pixels = traco.pixels;
    if (this.estado.modoSombra === 'paleta') {
      const rampa = rampaDaPaleta(this.paleta());
      if (rampa.length < 2) avisar('A paleta atual precisa de pelo menos 2 cores para o modo rampa.', 'alerta');

        if (tocados.has(i)) return null;
        tocados.add(i);
        return pixels[i] >>> 24 ? passoNaPaleta(pixels[i], rampa, direcao) : null;
      };
    }
    const passo = (direcao * this.estado.intensidadeSombra) / 100;
    return (x, y, i) => {
      if (tocados.has(i)) return null;
      tocados.add(i);
      return pixels[i] >>> 24 ? passoDeLuz(pixels[i], passo) : null;
    };
  }

  corBorracha(botao) {
    if (this.estado.modoBorracha === 'fundo') return botao === 2 ? this.estado.corPrimaria : this.estado.corSecundaria;

  }

  moverPonteiro(e) {
    const p = this.visor.telaParaMatriz(e.clientX, e.clientY);
    this.visor.definirCursor(p);
    this.editor.emitir('ponteiro', p.dentro ? p : null);
    const a = this.ativo;
    if (!a) return;
    if (a.tipo === 'pan') {
      this.visor.mover(e.clientX - a.x, e.clientY - a.y);
      a.x = e.clientX;
      a.y = e.clientY;
    } else if (a.tipo === 'amostra') {
      this.amostrar(p, a.botao);

      if (p.x !== a.inicio.x || p.y !== a.inicio.y) a.arrastou = true;

      this.atualizarSelecao(e);
    } else if (a.tipo === 'moverPixels') {
      this.atualizarMovimento(p.x - a.inicio.x, p.y - a.inicio.y);
    } else if (a.tipo === 'degrade') {
      let { x, y } = p;
      if (e.shiftKey) [x, y] = restringir(a.inicio.x, a.inicio.y, x, y, 'linha');
      if (x !== a.fim.x || y !== a.fim.y) {

          a.pedido = requestAnimationFrame(() => {
            a.pedido = 0;
            if (this.ativo === a) this.atualizarDegrade();
          });
        }
      }
    } else if (a.tipo === 'forma') {
      a.fim = p;
      this.atualizarForma(e);
    }
  }

    const a = this.ativo;
    this.ativo = null;
    this.visor.canvas.classList.remove('arrastando');
    if (!a) return;
    if (a.tipo === 'traco' || a.tipo === 'degrade' || a.tipo === 'moverPixels') {
      if (cancelado) {
        a.traco.desfazerVisual();
        if (a.tipo === 'moverPixels') this.editor.definirSelecao(a.selecaoOriginal);
        this.editor.emitir('pixels');
        return;
      }
      if (a.tipo === 'traco') {
        this.ultimoPonto = a.ultimo;
        this.editor.concluirTraco(a.traco, ROTULOS[this.estado.ferramenta] ?? 'Pincel');
        if (typeof a.cor === 'number') this.editor.lembrarCor(a.cor);
      } else if (a.tipo === 'degrade') {
        if (a.pedido) cancelAnimationFrame(a.pedido);
        if (a.fim.x === a.inicio.x && a.fim.y === a.inicio.y) {
          // Clique sem arrastar: não há direção para o degradê, então nada é pintado.
          a.traco.desfazerVisual();
          this.editor.emitir('pixels');
          avisar('Arraste de onde o degradê começa até onde ele termina.', 'info', 1600);
          return;
        }
        this.ativo = a;
        this.atualizarDegrade();
        this.ativo = null;
        this.editor.concluirTraco(a.traco, 'Degradê pontilhado');
      } else {
        this.concluirMovimento(a);
      }
    } else if (a.tipo === 'selecao') {
      if (cancelado) {
        this.editor.definirSelecao(a.anterior);
        return;
      }
      if (!a.arrastou) this.editor.definirSelecao(null);
    } else if (a.tipo === 'forma') {
      this.visor.definirPrevia(null);
      if (cancelado) return;
      for (const i of a.pontos ?? []) a.traco.pintar(i, a.cor);
      const nomes = { linha: 'Linha', retangulo: 'Retângulo', elipse: 'Elipse' };
      this.ultimoPonto = a.fim;
      this.editor.concluirTraco(a.traco, nomes[this.estado.ferramenta] ?? 'Forma');

    if (this.ativo) this.soltar(null, true);
  }

  // Dentro da matriz e, se houver seleção, dentro dela: as ferramentas de pintura só mexem aí.
  dentro(x, y) {
    const d = this.editor.doc;
    return x >= 0 && y >= 0 && x < d.largura && y < d.altura && contem(this.editor.selecao, x, y);
  }

  carimbar(traco, x, y, cor) {
    const d = this.editor.doc;
    const pontos = pincel(this.estado.tamanho, this.estado.forma);
    const funcao = typeof cor === 'function';
    for (const [dx, dy] of pontos) {
      for (const [px, py] of espelhos(x + dx, y + dy, d.largura, d.altura, this.estado.simetria)) {
        if (!this.dentro(px, py)) continue;
        const i = py * d.largura + px;
        const c = funcao ? cor(px, py, i) : cor;
        if (c !== null && c !== undefined) traco.pintar(i, c);
      }
    }
  }

  filtrarCanto(a, x, y) {
    a.pontos.push([x, y]);
    if (a.pontos.length < 3) return;
    const [p0, p1, p2] = a.pontos.slice(-3);
    if (cantoEmL(p0, p1, p2)) {
      const d = this.editor.doc;
      for (const [px, py] of espelhos(p1[0], p1[1], d.largura, d.altura, this.estado.simetria)) {
        const i = py * d.largura + px;
        if (a.traco.originais.has(i)) a.traco.pixels[i] = a.traco.originais.get(i);
      }
      a.pontos.splice(-2, 1);
    }
    if (a.pontos.length > 3) a.pontos.splice(0, a.pontos.length - 3);
  }

  atualizarSelecao(e) {
    const a = this.ativo;
    const d = this.editor.doc;
    let [x1, y1] = [a.fim.x, a.fim.y];
    if (e?.shiftKey) [x1, y1] = restringir(a.inicio.x, a.inicio.y, x1, y1, 'quadrado');
    const r = retanguloDe(a.inicio.x, a.inicio.y, x1, y1, d.largura, d.altura);
    this.editor.definirSelecao(r);
    if (r) this.editor.emitir('forma', { largura: r.largura, altura: r.altura });
  }

  // por baixo dela. Enquanto nada mais mudar no documento, arrastos e setas seguidos reaproveitam os
  // dois, então levar o conteúdo para fora da borda e trazer de volta não perde pixels e a colagem
  // nunca arrasta nem fura o fundo.
  iniciarMovimento(p) {
    const traco = this.editor.novoTraco();
    if (!traco) return null;
    const d = this.editor.doc;
    const f = this.editor.flutuanteValido();
    let area;
    let regiaoMovida;
    let fundo;
    if (f) {
      regiaoMovida = f.regiao;
      fundo = f.fundo;
      area = { x: f.x, y: f.y, largura: f.regiao.largura, altura: f.regiao.altura };
    } else {
      area = this.editor.selecaoRecortada ?? { x: 0, y: 0, largura: d.largura, altura: d.altura };
      regiaoMovida = extrairRegiao(traco.pixels, d.largura, area);
      fundo = traco.pixels.slice();
      for (let y = area.y; y < area.y + area.altura; y++) fundo.fill(0, y * d.largura + area.x, y * d.largura + area.x + area.largura);
    }
    this.ativo = { tipo: 'moverPixels', traco, area, regiao: regiaoMovida, fundo, inicio: p, dx: 0, dy: 0, selecaoOriginal: this.editor.selecao };
    return this.ativo;
  }

  atualizarMovimento(dx, dy, a = this.ativo) {
    if (dx === a.dx && dy === a.dy) return;
    a.dx = dx;
    a.dy = dy;
    const d = this.editor.doc;
    const { traco, area, fundo } = a;
    traco.desfazerVisual();
    const r = recortarAoDocumento(area, d.largura, d.altura);
    if (r) {
      for (let y = r.y; y < r.y + r.altura; y++) {
        for (let x = r.x; x < r.x + r.largura; x++) {
          const i = y * d.largura + x;
          traco.pintar(i, fundo[i]);
        }
      }
    }
    colarRegiao(a.regiao, d.largura, d.altura, area.x + dx, area.y + dy, (i, c) => traco.pintar(i, c), { somenteOpacos: true });
    if (a.selecaoOriginal) this.editor.definirSelecao({ ...area, x: area.x + dx, y: area.y + dy }, { manterFlutuante: true });
    this.editor.emitir('deslocamento', { dx, dy });
    this.editor.emitir('pixels');
  }

  concluirMovimento(a) {
    this.editor.concluirTraco(a.traco, 'Mover pixels');
    this.editor.flutuante = {
      chave: a.traco.chave,
      regiao: a.regiao,
      fundo: a.fundo,
      x: a.area.x + a.dx,
      y: a.area.y + a.dy,
      versao: this.editor.historico.versao,
    };
  }

  // Setas do teclado com a ferramenta Mover pixels: desloca 1 px (ou 8 px com Shift) num único passo.
  empurrar(dx, dy) {
    if (this.ativo) return;
    const a = this.iniciarMovimento({ x: 0, y: 0 });
    if (!a) return;
    this.ativo = null;
    this.atualizarMovimento(dx, dy, a);
    this.concluirMovimento(a);
  }

  atualizarDegrade() {
    const a = this.ativo;
    const d = this.editor.doc;
    a.traco.desfazerVisual();
    const [inicio, fim] = a.botao === 2 ? [this.estado.corSecundaria, this.estado.corPrimaria] : [this.estado.corPrimaria, this.estado.corSecundaria];
    const sel = this.editor.selecaoRecortada;
    const indices = sel ? indicesDe(sel, d.largura, d.altura) : null;
    const pares = degrade(d.largura, d.altura, {
      ax: a.inicio.x,
      ay: a.inicio.y,
      bx: a.fim.x,
      by: a.fim.y,
      tipo: this.estado.tipoDegrade,
      matriz: Number(this.estado.matrizDegrade) || 4,
      inicio,
      fim,
      indices,
    });
    for (const [i, cor] of pares) a.traco.pintar(i, cor);
    this.editor.emitir('forma', { largura: Math.abs(a.fim.x - a.inicio.x) + 1, altura: Math.abs(a.fim.y - a.inicio.y) + 1 });
    this.editor.emitir('pixels');
  }

  atualizarForma(e) {
    const a = this.ativo;
    const d = this.editor.doc;
    const ferramenta = this.estado.ferramenta;
    let { x: x0, y: y0 } = a.inicio;
    let [x1, y1] = [a.fim.x, a.fim.y];
    if (e?.shiftKey) [x1, y1] = restringir(x0, y0, x1, y1, ferramenta === 'linha' ? 'linha' : 'quadrado');
    if (e?.altKey && ferramenta !== 'linha') {
      x0 = 2 * a.inicio.x - x1;
      y0 = 2 * a.inicio.y - y1;
    }
    const pontos = new Set();
    const adicionar = (x, y) => {
      for (const [ex, ey] of espelhos(x, y, d.largura, d.altura, this.estado.simetria)) {
        if (this.dentro(ex, ey)) pontos.add(ey * d.largura + ex);
      }
    };
    if (ferramenta === 'linha') {
      const pontosPincel = pincel(this.estado.tamanho, this.estado.forma);
      linha(x0, y0, x1, y1, (x, y) => {
        for (const [dx, dy] of pontosPincel) adicionar(x + dx, y + dy);
      });
    } else if (ferramenta === 'retangulo') {
      retangulo(x0, y0, x1, y1, this.estado.preenchido, adicionar);
    } else {
      elipse(x0, y0, x1, y1, this.estado.preenchido, adicionar);
    }
    a.pontos = pontos;
    this.visor.definirPrevia(pontos, a.cor);
    this.editor.emitir('forma', { largura: Math.abs(x1 - x0) + 1, altura: Math.abs(y1 - y0) + 1 });
  }

  balde(p, botao) {
    if (!p.dentro) return;
    const traco = this.editor.novoTraco();
    if (!traco) return;
    const d = this.editor.doc;
    const cor = this.cor(botao);
    const opcoes = {
      conectividade: this.estado.conectividade,
      tolerancia: Math.round((this.estado.tolerancia / 100) * 255),
      contiguo: this.estado.contiguo,
    };
    const sel = this.editor.selecao;
    if (sel && !contem(sel, p.x, p.y)) {
      traco.desfazerVisual();
      return;
    }
    for (const [x, y] of espelhos(p.x, p.y, d.largura, d.altura, this.estado.simetria)) {
      const fonte = this.estado.amostra === 'todas' ? d.compor(this.editor.estado.quadro) : this.editor.celulaAtiva();
      for (const i of regiao(fonte, d.largura, d.altura, x, y, opcoes)) {
        if (sel && !contem(sel, i % d.largura, (i / d.largura) | 0)) continue;
        traco.pintar(i, cor);
      }
    }
    if (this.editor.concluirTraco(traco, 'Balde de tinta')) this.editor.lembrarCor(cor);
  }

  amostrar(p, botao) {
    if (!p.dentro) return;
    const d = this.editor.doc;
    const i = p.y * d.largura + p.x;
    const cor = this.estado.amostra === 'todas' ? d.compor(this.editor.estado.quadro)[i] : this.editor.celulaAtiva()[i];
    if (!(cor >>> 24)) {
      this.editor.emitir('amostra', { cor: null });
      return;
    }
    this.editor.definirCor(botao === 2 ? 'secundaria' : 'primaria', cor);
    this.editor.emitir('amostra', { cor: corParaHex(cor) });
  }
}

  if (f) avisar(`${f.nome} (${f.atalho})`, 'info', 900);
}
return { FERRAMENTAS, Controlador, avisoFerramenta };

function normalizarPaleta(p) {
  const cores = [];
  for (const c of p.cores || []) {
    const v = typeof c === 'number' ? c : hexParaCor(c);
    if (v !== null && v !== undefined) cores.push(v >>> 0);
  }
  return { ...p, nome: String(p.nome || 'Paleta').slice(0, 80), cores };
}

function importarPaleta(texto, nomeArquivo = 'paleta.txt') {
  const extensao = nomeArquivo.toLowerCase().split('.').pop();
  const base = nomeArquivo.replace(/\.[^.]+$/, '');
  let nome = base;
  const cores = [];
  const adicionar = (c) => {
    if (c !== null && !cores.includes(c)) cores.push(c);
  };
  const conteudo = texto.replace(/^﻿/, '');
  if (extensao === 'json' || /^\s*[[{]/.test(conteudo)) {
    const dados = JSON.parse(conteudo);
    const lista = Array.isArray(dados) ? dados : dados.cores || dados.colors || dados.paleta || [];
    if (!Array.isArray(dados) && (dados.nome || dados.name)) nome = dados.nome || dados.name;
    for (const c of lista) adicionar(typeof c === 'string' ? hexParaCor(c) : null);
  } else if (/^GIMP Palette/i.test(conteudo.trim())) {
    for (const linha of conteudo.split(/\r?\n/)) {
      const nomeMatch = linha.match(/^Name:\s*(.+)$/i);
      if (nomeMatch) {
        nome = nomeMatch[1].trim();
        continue;
      }
      const m = linha.match(/^\s*(\d{1,3})\s+(\d{1,3})\s+(\d{1,3})/);
      if (m) adicionar(hexParaCor('#' + [m[1], m[2], m[3]].map((v) => Math.min(255, +v).toString(16).padStart(2, '0')).join('')));
    }
  } else {
    for (const linha of conteudo.split(/\r?\n/)) {
      const t = linha.trim();
      if (!t || t.startsWith(';') || t.startsWith('//')) continue;
      for (const pedaco of t.split(/[\s,;]+/)) {
        if (/^(#|0x)?[0-9a-f]{8}$/i.test(pedaco) && extensao === 'txt' && !pedaco.startsWith('#')) {
          const h = pedaco.replace(/^0x/i, '');
          adicionar(hexParaCor(h.slice(2) + h.slice(0, 2)));
        } else if (/^(#|0x)?([0-9a-f]{3}|[0-9a-f]{6}|[0-9a-f]{8})$/i.test(pedaco)) {
          adicionar(hexParaCor(pedaco));
        }
      }
    }
  }
  if (!cores.length) throw new Error('Nenhuma cor encontrada no arquivo.');
  return { nome: String(nome).slice(0, 80), cores };
}

function exportarPaleta(paleta, formato = 'hex') {
  if (formato === 'gpl') {
    const linhas = ['GIMP Palette', `Name: ${paleta.nome}`, 'Columns: 8', '#'];
    for (const c of paleta.cores) {
      const [r, g, b] = desempacotar(c);
      linhas.push(`${String(r).padStart(3)} ${String(g).padStart(3)} ${String(b).padStart(3)}\t${corParaHex6(c).slice(1)}`);
    }
    return linhas.join('\n') + '\n';
  }
  if (formato === 'json') {
    return JSON.stringify({ nome: paleta.nome, cores: paleta.cores.map((c) => corParaHex(c)) }, null, 2) + '\n';
  }
  return paleta.cores.map((c) => corParaHex(c).slice(1)).join('\n') + '\n';
}

function extrairPaleta(pixels, limite = 256) {
  const contagem = new Map();
  for (const c of pixels) if (c >>> 24) contagem.set(c, (contagem.get(c) || 0) + 1);
  return [...contagem.entries()]
    .sort((a, b) => b[1] - a[1])
    .slice(0, limite)
    .map(([c]) => c);
}
return { PALETAS_PREDEFINIDAS, normalizarPaleta, importarPaleta, exportarPaleta, extrairPaleta };

function caminhoBitmap(bitmap) {
  let d = '';
  bitmap.forEach((linha, y) => {
    let x = 0;
    while (x < linha.length) {
      if (linha[x] === '#') {
        let fim = x;
        while (fim < linha.length && linha[fim] === '#') fim++;
        d += `M${x} ${y}h${fim - x}v1h-${fim - x}z`;
        x = fim;
      } else x++;
    }
  });
  return d;
}

function icone(nome, tamanho = 20, rotulo = '') {
  const bitmap = BITMAPS[nome];
  if (!bitmap) return '';
  const l = Math.max(...bitmap.map((r) => r.length));
  const a = bitmap.length;
  const lado = Math.max(l, a) + 2;
  const ox = (lado - l) / 2;
  const oy = (lado - a) / 2;
  const seguro = String(rotulo).replace(/[&<>"']/g, (c) => `&#${c.charCodeAt(0)};`);
  const aria = rotulo ? `role="img" aria-label="${seguro}"` : 'aria-hidden="true"';
  return `<svg class="icone" width="${tamanho}" height="${tamanho}" viewBox="${-ox} ${-oy} ${lado} ${lado}" shape-rendering="crispEdges" ${aria}><path fill="currentColor" d="${caminhoBitmap(bitmap)}"/></svg>`;
}
return { BITMAPS, caminhoBitmap, icone };

function identificador(nome, estilo = 'camelo') {
  const partes = String(nome || 'sprite')
    .normalize('NFD')
    .replace(/[̀-ͯ]/g, '')
    .split(/[^A-Za-z0-9]+/)
    .filter(Boolean)
    .map((p) => p.toLowerCase());
  if (!partes.length) partes.push('sprite');
  if (/^[0-9]/.test(partes[0])) partes.unshift('sprite');
  if (estilo === 'cobra') return partes.join('_');
  if (estilo === 'constante') return partes.join('_').toUpperCase();
  const cap = partes.map((p) => p[0].toUpperCase() + p.slice(1));
  if (estilo === 'pascal') return cap.join('');
  return partes[0] + cap.slice(1).join('');
}

function montarMatrizes(quadros, largura, altura, { modo = 'indices', paleta = null } = {}) {
  const ordem = new Map();
  if (paleta) for (const c of paleta) if (c >>> 24 && !ordem.has(c)) ordem.set(c, ordem.size);
  if (modo === 'indices') {
    for (const px of quadros) for (const c of px) if (c >>> 24 && !ordem.has(c)) ordem.set(c, ordem.size);
  }
  const matrizes = quadros.map((px) => {
    const linhas = [];
    for (let y = 0; y < altura; y++) {
      const linha = [];
      for (let x = 0; x < largura; x++) {
        const c = px[y * largura + x];
        if (modo === 'indices') linha.push(c >>> 24 ? ordem.get(c) : -1);
        else linha.push(c >>> 24 ? corParaHex(c) : null);
      }
      linhas.push(linha);
    }
    return linhas;
  });
  return { largura, altura, modo, paleta: [...ordem.keys()].map((c) => corParaHex(c)), quadros: matrizes };
}

const valorTexto = (v, aspas = '"', nulo = 'null') => (v === null ? nulo : typeof v === 'string' ? aspas + v + aspas : String(v));

function blocoLinhas(matriz, recuo, abre, fecha, aspas, nulo, largura = 0) {
  return matriz
    .map((linha) => recuo + abre + linha.map((v) => valorTexto(v, aspas, nulo).padStart(largura)).join(', ') + fecha)
    .join(',\n');
}

function larguraValores(dados) {
  if (dados.modo !== 'indices') return 0;
  let m = 1;
  for (const q of dados.quadros) for (const l of q) for (const v of l) m = Math.max(m, String(v).length);
  return m;
}

function gerarJSON(dados, nome) {
  const w = larguraValores(dados);
  const quadros = dados.quadros
    .map((q) => '    [\n' + blocoLinhas(q, '      ', '[', ']', '"', 'null', w) + '\n    ]')
    .join(',\n');
  return (
    '{\n' +
    `  "nome": ${JSON.stringify(nome)},\n` +
    `  "largura": ${dados.largura},\n` +
    `  "altura": ${dados.altura},\n` +
    `  "modo": ${JSON.stringify(dados.modo)},\n` +
    (dados.modo === 'indices' ? '  "transparente": -1,\n' : '') +
    `  "paleta": ${JSON.stringify(dados.paleta)},\n` +
    '  "quadros": [\n' +
    quadros +
    '\n  ]\n}\n'
  );
}

function gerarCSV(dados) {
  return (
    dados.quadros
      .map((q) => q.map((linha) => linha.map((v) => (v === null ? '' : String(v))).join(',')).join('\n'))
      .join('\n\n') + '\n'
  );
}

function gerarJS(dados, nome) {
  const id = identificador(nome);
  const w = larguraValores(dados);
  const quadros = dados.quadros.map((q) => '    [\n' + blocoLinhas(q, '      ', '[', ']', "'", 'null', w) + ',\n    ]').join(',\n');
  return (
    `export const ${id} = {\n` +
    `  largura: ${dados.largura},\n` +
    `  altura: ${dados.altura},\n` +
    (dados.modo === 'indices' ? '  transparente: -1,\n' : '') +
    `  paleta: [${dados.paleta.map((c) => `'${c}'`).join(', ')}],\n` +
    '  quadros: [\n' +
    quadros +
    ',\n  ],\n};\n'
  );
}

function gerarPython(dados, nome) {
  const id = identificador(nome, 'constante');
  const w = larguraValores(dados);
  const quadros = dados.quadros.map((q) => '        [\n' + blocoLinhas(q, '            ', '[', ']', '"', 'None', w) + ',\n        ]').join(',\n');
  return (
    `${id} = {\n` +
    `    "largura": ${dados.largura},\n` +
    `    "altura": ${dados.altura},\n` +
    (dados.modo === 'indices' ? '    "transparente": -1,\n' : '') +
    `    "paleta": [${dados.paleta.map((c) => `"${c}"`).join(', ')}],\n` +
    '    "quadros": [\n' +
    quadros +
    ',\n    ],\n}\n'
  );
}

function hexParaInteiro(hex, ordem) {
  const h = hex.replace('#', '');
  const rgb = h.slice(0, 6).toUpperCase();
  const a = (h.length === 8 ? h.slice(6, 8) : 'FF').toUpperCase();
  return ordem === 'argb' ? '0x' + a + rgb : '0x' + rgb + a;
}

function gerarC(dados, nome) {
  const id = identificador(nome, 'cobra');
  const ID = id.toUpperCase();
  const tipo = dados.modo === 'indices' ? (dados.paleta.length > 32767 ? 'int32_t' : 'int16_t') : 'uint32_t';
  const converter = (v) => (dados.modo === 'indices' ? v : v === null ? '0x00000000' : hexParaInteiro(v, 'rgba'));
  const w = dados.modo === 'indices' ? larguraValores(dados) : 10;
  const quadros = dados.quadros
    .map((q) => '    {\n' + q.map((l) => '        {' + l.map((v) => String(converter(v)).padStart(w)).join(', ') + '}').join(',\n') + '\n    }')
    .join(',\n');
  const paleta = dados.paleta.length ? dados.paleta.map((c) => hexParaInteiro(c, 'rgba')).join(', ') : '0x00000000';
  return (
    `#ifndef ${ID}_H\n#define ${ID}_H\n\n#include <stdint.h>\n\n` +
    `#define ${ID}_LARGURA ${dados.largura}\n#define ${ID}_ALTURA ${dados.altura}\n#define ${ID}_QUADROS ${dados.quadros.length}\n` +
    `#define ${ID}_CORES ${dados.paleta.length}\n\n` +
    `static const uint32_t ${id}_paleta[${Math.max(1, dados.paleta.length)}] = {${paleta}};\n\n` +
    `static const ${tipo} ${id}_pixels[${ID}_QUADROS][${ID}_ALTURA][${ID}_LARGURA] = {\n` +
    quadros +
    `\n};\n\n#endif\n`
  );
}

// Um inicializador Java passa de 64 KB de bytecode com alguns milhares de números, e a classe não compila.
// Acima deste limite, a matriz e a paleta vão compactadas em texto e são lidas quando a classe carrega.
const LIMITE_JAVA_LITERAL = 4096;
const PEDACO_JAVA = 20000;

function textoJava(codigos) {
  let s = '';
  for (const c of codigos) {
    if (c === 34) s += '\\"';
    else if (c === 92) s += '\\\\';
    else if (c >= 32 && c < 127) s += String.fromCharCode(c);
    else if (c < 128) s += '\\' + c.toString(8).padStart(3, '0');
    else s += '\\u' + c.toString(16).toUpperCase().padStart(4, '0');
  }
  return s;
}

function pedacosJava(codigos, recuo) {
  const partes = [];
  for (let i = 0; i < codigos.length; i += PEDACO_JAVA) partes.push(`${recuo}"${textoJava(codigos.slice(i, i + PEDACO_JAVA))}"`);
  return partes.join(',\n');
}

function argb(hex) {
  const h = hex.replace('#', '');
  return ((parseInt(h.length === 8 ? h.slice(6, 8) : 'ff', 16) << 24) | parseInt(h.slice(0, 6), 16)) >>> 0;
}

function gerarJavaCompacto(dados, classe) {
  const indices = dados.modo === 'indices';
  const total = dados.quadros.length * dados.altura * dados.largura;
  const umCaractere = indices && dados.paleta.length + 33 <= 0xffff;
  const base = indices ? (umCaractere ? 33 : 1) : 0;
  const codigos = [];
  for (const q of dados.quadros) {
    for (const l of q) {
      for (const v of l) {
        if (umCaractere) codigos.push(v + 33);
        else {
          const u = indices ? v + 1 : v === null ? 0 : argb(v);
          codigos.push(u >>> 16, u & 0xffff);
        }
      }
    }
  }
  const cores = [];
  for (const c of dados.paleta) {
    const u = argb(c);
    cores.push(u >>> 16, u & 0xffff);
  }
  return (
    `public final class ${classe} {\n\n` +
    `    public static final int LARGURA = ${dados.largura};\n` +
    `    public static final int ALTURA = ${dados.altura};\n` +
    (indices ? '    public static final int TRANSPARENTE = -1;\n' : '') +
    `\n    public static final int[] PALETA;\n` +
    `    public static final int[][][] QUADROS;\n\n` +
    `    // Matriz grande demais para um literal Java (limite de 64 KB por método): os valores vêm compactados\n` +
    `    // em texto, ${umCaractere ? 'um caractere por pixel (valor + 33)' : 'dois caracteres por valor (16 bits altos e baixos)'}, e são lidos quando a classe carrega.\n` +
    `    private static final String[] DADOS_PALETA = {\n${pedacosJava(cores, '        ')}${cores.length ? ',' : ''}\n    };\n\n` +
    `    private static final String[] DADOS = {\n${pedacosJava(codigos, '        ')},\n    };\n\n` +
    `    static {\n` +
    `        PALETA = ler(DADOS_PALETA, 2, 0, ${dados.paleta.length});\n` +
    `        int[] v = ler(DADOS, ${umCaractere ? 1 : 2}, ${base}, ${total});\n` +
    `        QUADROS = new int[${dados.quadros.length}][ALTURA][LARGURA];\n` +
    `        for (int q = 0, i = 0; q < ${dados.quadros.length}; q++)\n` +
    `            for (int y = 0; y < ALTURA; y++)\n` +
    `                for (int x = 0; x < LARGURA; x++) QUADROS[q][y][x] = v[i++];\n` +
    `    }\n\n` +
    `    private static int[] ler(String[] partes, int largura, int base, int total) {\n` +
    `        StringBuilder texto = new StringBuilder();\n` +
    `        for (String parte : partes) texto.append(parte);\n` +
    `        int[] valores = new int[total];\n` +
    `        for (int i = 0, k = 0; i < total; i++) {\n` +
    `            if (largura == 1) valores[i] = texto.charAt(k++) - base;\n` +
    `            else valores[i] = ((texto.charAt(k++) << 16) | texto.charAt(k++)) - base;\n` +
    `        }\n` +
    `        return valores;\n` +
    `    }\n\n` +
    `    private ${classe}() {\n    }\n}\n`
  );
}

function gerarJava(dados, nome) {
  const classe = identificador(nome, 'pascal');
  if (dados.quadros.length * dados.altura * dados.largura > LIMITE_JAVA_LITERAL || dados.paleta.length > 2048) return gerarJavaCompacto(dados, classe);
  const converter = (v) => (dados.modo === 'indices' ? v : v === null ? '0x00000000' : hexParaInteiro(v, 'argb'));
  const w = dados.modo === 'indices' ? larguraValores(dados) : 10;
  const quadros = dados.quadros
    .map((q) => '        {\n' + q.map((l) => '            {' + l.map((v) => String(converter(v)).padStart(w)).join(', ') + '}').join(',\n') + '\n        }')
    .join(',\n');
  return (
    `public final class ${classe} {\n\n` +
    `    public static final int LARGURA = ${dados.largura};\n` +
    `    public static final int ALTURA = ${dados.altura};\n` +
    (dados.modo === 'indices' ? '    public static final int TRANSPARENTE = -1;\n' : '') +
    `\n    public static final int[] PALETA = {${dados.paleta.map((c) => hexParaInteiro(c, 'argb')).join(', ')}};\n\n` +
    `    public static final int[][][] QUADROS = {\n` +
    quadros +
    `\n    };\n\n    private ${classe}() {\n    }\n}\n`
  );
}

function gerarDados(formato, dados, nome) {
  switch (formato) {
    case 'json':
      return gerarJSON(dados, nome);
    case 'csv':
      return gerarCSV(dados);
    case 'js':
      return gerarJS(dados, nome);
    case 'py':
      return gerarPython(dados, nome);
    case 'c':
      return gerarC(dados, nome);
    case 'java':
      return gerarJava(dados, nome);
    default:
      throw new Error('Formato desconhecido: ' + formato);
  }
}

function layoutFolha(quantidade, largura, altura, { disposicao = 'horizontal', colunas = 4, espacamento = 0, margem = 0 } = {}) {
  let cols;
  if (disposicao === 'horizontal') cols = quantidade;
  else if (disposicao === 'vertical') cols = 1;
  else cols = Math.max(1, Math.min(quantidade, Math.round(colunas) || 1));
  const linhas = Math.ceil(quantidade / cols);
  const posicoes = [];
  for (let i = 0; i < quantidade; i++) {
    const c = i % cols;
    const l = Math.floor(i / cols);
    posicoes.push({ x: margem + c * (largura + espacamento), y: margem + l * (altura + espacamento), largura, altura });
  }
  return {
    colunas: cols,
    linhas,
    largura: margem * 2 + cols * largura + (cols - 1) * espacamento,
    altura: margem * 2 + linhas * altura + (linhas - 1) * espacamento,
    posicoes,
  };
}

function escalarVizinho(pixels, largura, altura, fator) {
  fator = Math.max(1, Math.floor(fator));
  if (fator === 1) return pixels.slice();
  const L = largura * fator;
  const saida = new Uint32Array(L * altura * fator);
  for (let y = 0; y < altura; y++) {
    const linha = new Uint32Array(L);
    for (let x = 0; x < largura; x++) linha.fill(pixels[y * largura + x], x * fator, (x + 1) * fator);
    for (let k = 0; k < fator; k++) saida.set(linha, (y * fator + k) * L);
  }
  return saida;
}

function colar(destino, larguraDestino, origem, larguraOrigem, alturaOrigem, x0, y0) {
  for (let y = 0; y < alturaOrigem; y++) {
    destino.set(origem.subarray(y * larguraOrigem, (y + 1) * larguraOrigem), (y0 + y) * larguraDestino + x0);
  }
}

function achatarFundo(pixels, fundo) {
  const [fr, fg, fb] = desempacotar(fundo);
  const saida = new Uint32Array(pixels.length);
  for (let i = 0; i < pixels.length; i++) {
    const c = pixels[i];
    const a = (c >>> 24) / 255;
    const r = Math.round((c & 255) * a + fr * (1 - a));
    const g = Math.round(((c >>> 8) & 255) * a + fg * (1 - a));
    const b = Math.round(((c >>> 16) & 255) * a + fb * (1 - a));
    saida[i] = ((255 << 24) | (b << 16) | (g << 8) | r) >>> 0;
  }
  return saida;
}

function metadadosFolha(nome, layout, quadros, fps) {
  return {
    nome,
    imagem: nome + '.png',
    largura: layout.largura,
    altura: layout.altura,
    fps,
    quadros: layout.posicoes.map((p, i) => ({
      indice: i,
      x: p.x,
      y: p.y,
      largura: p.largura,
      altura: p.altura,
      duracao: quadros[i]?.duracao ?? Math.round(1000 / fps),
    })),
  };
}
return { FORMATOS_DADOS, identificador, montarMatrizes, gerarJSON, gerarCSV, gerarJS, gerarPython, gerarC, LIMITE_JAVA_LITERAL, gerarJava, gerarDados, layoutFolha, escalarVizinho, colar, achatarFundo, metadadosFolha };
})();

// js/ui/imagem.js
modulos["js/ui/imagem.js"] = (() => {
const { escalarVizinho } = modulos["js/nucleo/exportar.js"];

function criarCanvas(largura, altura) {
  const c = document.createElement('canvas');
  c.width = largura;
  c.height = altura;
  return c;
}

function pixelsParaCanvas(pixels, largura, altura, escala = 1) {
  const px = escala > 1 ? escalarVizinho(pixels, largura, altura, escala) : pixels;
  const L = largura * escala;
  const A = altura * escala;
  const canvas = criarCanvas(L, A);
  const ctx = canvas.getContext('2d');
  const dados = new ImageData(new Uint8ClampedArray(px.buffer.slice(px.byteOffset, px.byteOffset + px.byteLength)), L, A);
  ctx.putImageData(dados, 0, 0);
  return canvas;
}

function canvasParaBlob(canvas, tipo = 'image/png', qualidade = 0.92) {
  return new Promise((resolver, rejeitar) => {
    canvas.toBlob((blob) => (blob ? resolver(blob) : rejeitar(new Error('Não foi possível gerar a imagem.'))), tipo, qualidade);
  });
}

async function arquivoParaPixels(arquivo, limite = 4096) {
  const bitmap = await createImageBitmap(arquivo);
  if (bitmap.width > limite || bitmap.height > limite) {
    bitmap.close?.();
    throw new Error(`A imagem passa de ${limite} pixels de lado.`);
  }
  const canvas = criarCanvas(bitmap.width, bitmap.height);
  const ctx = canvas.getContext('2d', { willReadFrequently: true });
  ctx.drawImage(bitmap, 0, 0);
  const dados = ctx.getImageData(0, 0, bitmap.width, bitmap.height);
  bitmap.close?.();
  return { largura: dados.width, altura: dados.height, pixels: new Uint32Array(dados.data.buffer.slice(0)) };
}

function reduzir(pixels, largura, altura, fator) {
  if (fator <= 1) return { pixels, largura, altura };
  const L = Math.max(1, Math.floor(largura / fator));
  const A = Math.max(1, Math.floor(altura / fator));
  const saida = new Uint32Array(L * A);
  const meio = Math.floor(fator / 2);
  for (let y = 0; y < A; y++) {
    for (let x = 0; x < L; x++) saida[y * L + x] = pixels[(y * fator + meio) * largura + x * fator + meio];
  }
  return { pixels: saida, largura: L, altura: A };
}

function recortar(pixels, largura, x0, y0, l, a) {
  const saida = new Uint32Array(l * a);
  for (let y = 0; y < a; y++) {
    saida.set(pixels.subarray((y0 + y) * largura + x0, (y0 + y) * largura + x0 + l), y * l);
  }
  return saida;
}

function miniatura(pixels, largura, altura, lado = 128) {
  const escala = Math.max(1, Math.floor(lado / Math.max(largura, altura)));
  return pixelsParaCanvas(pixels, largura, altura, escala).toDataURL('image/png');
}
return { criarCanvas, pixelsParaCanvas, canvasParaBlob, arquivoParaPixels, reduzir, recortar, miniatura };
})();

// js/ui/dialogo.js
modulos["js/ui/dialogo.js"] = (() => {
const { el } = modulos["js/ui/util.js"];

function abrirDialogo({ titulo, corpo, acoes = [], classe = '', aoAbrir }) {
  return new Promise((resolver) => {
    const dialogo = el('dialog', { class: `dialogo ${classe}`, 'aria-labelledby': 'dialogo-titulo' });
    const fechar = (valor) => {
      dialogo.close();
      dialogo.remove();
      resolver(valor);
    };
    const rodape = el(
      'div',
      { class: 'dialogo-acoes' },
      acoes.map((a) =>
        el(
          'button',
          {
            type: a.enviar ? 'submit' : 'button',
            class: a.primario ? 'botao primario' : a.perigo ? 'botao perigo' : 'botao',
            onclick: async (e) => {
              if (a.enviar) return;
              e.preventDefault();
              const r = a.acao ? await a.acao() : a.valor;
              if (r !== undefined && r !== false) fechar(r);
              else if (!a.acao) fechar(a.valor ?? null);
            },
          },
          a.rotulo,
        ),
      ),
    );
    const formulario = el('form', { method: 'dialog', class: 'dialogo-form' });
    formulario.addEventListener('submit', async (e) => {
      e.preventDefault();
      const enviar = acoes.find((a) => a.enviar);
      if (!enviar) return;
      const r = enviar.acao ? await enviar.acao() : enviar.valor;
      if (r !== undefined && r !== false) fechar(r);
    });
    formulario.append(
      el('header', { class: 'dialogo-topo' }, el('h2', { id: 'dialogo-titulo' }, titulo), el('button', { type: 'button', class: 'botao-icone fechar', 'aria-label': 'Fechar', onclick: () => fechar(null) }, '×')),
      el('div', { class: 'dialogo-corpo' }, corpo),
      rodape,
    );
    dialogo.append(formulario);
    dialogo.addEventListener('cancel', (e) => {
      e.preventDefault();
      fechar(null);
    });
    document.body.append(dialogo);
    dialogo.showModal();
    aoAbrir?.(dialogo, fechar);
    const primeiro = dialogo.querySelector('input:not([type=hidden]), select, textarea');
    if (primeiro) primeiro.focus();
  });
}

async function perguntarTexto(titulo, rotulo, valor = '') {
  const input = el('input', { type: 'text', value: valor, maxlength: 80, required: true });
  const r = await abrirDialogo({
    titulo,
    corpo: el('label', { class: 'campo' }, el('span', {}, rotulo), input),
    acoes: [
      { rotulo: 'Cancelar', valor: null },
      { rotulo: 'Confirmar', primario: true, enviar: true, acao: () => input.value.trim() || false },
    ],
  });
  return r;
}

async function confirmar(titulo, texto, rotuloConfirmar = 'Confirmar', perigo = false) {
  const r = await abrirDialogo({
    titulo,
    corpo: el('p', {}, texto),
    acoes: [
      { rotulo: 'Cancelar', valor: false },
      { rotulo: rotuloConfirmar, primario: !perigo, perigo, enviar: true, acao: () => true },
    ],
  });
  return r === true;
}
return { abrirDialogo, perguntarTexto, confirmar };
})();
