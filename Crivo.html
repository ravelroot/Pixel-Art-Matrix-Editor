  constructor(width = 32, height = 32, options = {}) {
    this.name = options.name ?? 'Sem título';
    this.width = validateSide(width);
    this.height = validateSide(height);
    this.fps = options.fps ?? 8;
    this.palette = options.palette ? [...options.palette] : [];
    this.colorMode = 'rgba';
    this.layers = [];
    this.frames = [];
    this.cells = new Map();
    // Linked cels: cell key → key of the source cel (same layer). Linked keys share the same Uint32Array.
    this.links = new Map();
    this.tags = [];
    this.slices = [];
    this.tilesets = [];
    // Tilemap cels: cell key → Uint32Array of tile indices (columns × rows).
    this.tileCells = new Map();
    if (!options.empty) {
      this.addLayer('Camada 1');
      this.addFrame();
    }
  }

  get total() {
    return this.width * this.height;
  }

  key(frameId, layerId) {
    return frameId + ':' + layerId;
  }

  hasCell(frameId, layerId) {
    return this.cells.has(this.key(frameId, layerId));
  }

  cell(frameId, layerId) {
    const k = this.key(frameId, layerId);
    let pixels = this.cells.get(k);
    if (!pixels) {
      const source = this.links.get(k);
      pixels = source ? this.cells.get(source) : null;
      if (!pixels) {
        pixels = new Uint32Array(this.total);
        if (source) this.cells.set(source, pixels);
      }
      this.cells.set(k, pixels);
    }
    return pixels;
  }

  cellByKey(k) {
    const [q, c] = k.split(':');
    return this.cell(q, c);
  }

  layerIndex(id) {
    return this.layers.findIndex((c) => c.id === id);
  }

  frameIndex(id) {
    return this.frames.findIndex((q) => q.id === id);
  }

  layer(id) {
    return this.layers.find((c) => c.id === id) ?? null;
  }

  // ---- layers and groups ---------------------------------------------------------------------------------

  // `parent` undefined: the new layer joins the group of the layer just below the insertion point.
  addLayer(name, position = this.layers.length, parent = undefined, kind = 'image') {
    if (parent === undefined) parent = position > 0 ? (this.layers[position - 1]?.parent ?? null) : null;
    const layer = {
      id: newId('c'),
      name: name ?? (kind === 'group' ? `Grupo ${this.layers.filter((c) => c.kind === 'group').length + 1}` : `Camada ${this.layers.filter((c) => c.kind !== 'group').length + 1}`),
      visible: true,
      opacity: 100,
      locked: false,
      blendMode: 'normal',
      kind,
      parent,
      collapsed: false,
      tileset: null,
      reference: false,
    };
    this.layers.splice(position, 0, layer);
    return layer;
  }

  addGroup(name, position = this.layers.length, parent = undefined) {
    return this.addLayer(name ?? null, position, parent, 'group');
  }

  isGroup(id) {
    return this.layer(id)?.kind === 'group';
  }

  // True when layer `id` is inside group `groupId` (at any depth).
  isDescendant(id, groupId) {
    let c = this.layer(id);
    const seen = new Set();
    while (c && c.parent && !seen.has(c.id)) {
      seen.add(c.id);
      if (c.parent === groupId) return true;
      c = this.layer(c.parent);
    }
    return false;
  }

  depth(id) {
    let d = 0;
    let c = this.layer(id);
    while (c?.parent && d < 64) {
      d++;
      c = this.layer(c.parent);
    }
    return d;
  }

  children(groupId) {
    return this.layers.filter((c) => c.parent === groupId);
  }

  // A layer is drawn only when it and every group above it are visible.
  isVisible(id) {
    let c = this.layer(id);
    let guard = 0;
    while (c && guard++ < 64) {
      if (!c.visible) return false;
      c = c.parent ? this.layer(c.parent) : null;
    }
    return true;
  }

  // Index range [start, end] of a layer and everything inside it (a group's children sit right below it).
  block(id) {
    const end = this.layerIndex(id);
    if (end < 0) return null;
    let start = end;
    if (this.layers[end].kind === 'group') while (start > 0 && this.isDescendant(this.layers[start - 1].id, id)) start--;
    return [start, end];
  }

  dropKey(k) {
    if (this.links.has(k)) {
      this.links.delete(k);
    } else {
      const dependents = [...this.links].filter(([, s]) => s === k).map(([d]) => d);
      if (dependents.length) {
        const [first, ...rest] = dependents;
        this.links.delete(first);
        for (const d of rest) this.links.set(d, first);
      }
    }
    this.cells.delete(k);
    this.tileCells.delete(k);
  }

  removeLayer(id) {
    const range = this.block(id);
    if (!range) return false;
    const [start, end] = range;
    const removed = this.layers.slice(start, end + 1);
    const remaining = this.layers.length - removed.length;
    const drawable = this.layers.filter((c, i) => (i < start || i > end) && c.kind !== 'group').length;
    if (remaining < 1 || drawable < 1) return false;
    this.layers.splice(start, removed.length);
    for (const c of removed) for (const q of this.frames) this.dropKey(this.key(q.id, c.id));
    return true;
  }

  // Moves a layer (with its children, when it is a group) one step up (+1) or down (-1) among its siblings.
  // Reaching the edge of its group takes it out of the group; meeting an expanded group puts it inside.
  moveLayer(id, delta) {
    const range = this.block(id);
    if (!range) return false;
    const layer = this.layer(id);
    const [start, end] = range;
    const length = end - start + 1;
    const moveBlock = (to) => {
      const items = this.layers.splice(start, length);
      this.layers.splice(to, 0, ...items);
    };
    if (delta > 0) {
      const next = this.layers[end + 1];
      if (!next) return false;
      if (next.id === layer.parent) {
        layer.parent = next.parent;
        moveBlock(end + 1 - length + 1);
        return true;
      }
      // The sibling above: the item whose parent is ours, owning the layer `next`.
      let sibling = next;
      while (sibling && sibling.parent !== layer.parent) sibling = this.layer(sibling.parent);
      if (!sibling) return false;
      if (sibling.kind === 'group' && !sibling.collapsed) {
        layer.parent = sibling.id;
        return true;
      }
      const siblingEnd = this.layerIndex(sibling.id);
      moveBlock(siblingEnd - length + 1);
      return true;
    }
    if (delta < 0) {
      const previous = this.layers[start - 1];
      const insideParent = previous && (layer.parent === null || this.isDescendant(previous.id, layer.parent));
      if (!insideParent) {
        if (!layer.parent) return false;
        layer.parent = this.layer(layer.parent)?.parent ?? null;
        return true;
      }
      if (previous.kind === 'group' && previous.parent === layer.parent && !previous.collapsed) {
        layer.parent = previous.id;
        moveBlock(start - 1);
        return true;
      }
      // Sibling below: `previous` is its top (a layer or a group header).
      const [siblingStart] = this.block(previous.id);
      moveBlock(siblingStart);
      return true;
    }
    return false;
  }

  // Wraps the layer (with its children) in a new group placed right above it.
  groupLayer(id, name = null) {
    const range = this.block(id);
    if (!range) return null;
    const layer = this.layer(id);
    const group = this.addGroup(name, range[1] + 1, layer.parent);
    layer.parent = group.id;
    return group;
  }

  // Removes the group header and gives its children to the group's parent.
  ungroup(id) {
    const group = this.layer(id);
    if (!group || group.kind !== 'group') return false;
    for (const c of this.layers) if (c.parent === id) c.parent = group.parent;
    this.layers.splice(this.layerIndex(id), 1);
    for (const q of this.frames) this.dropKey(this.key(q.id, id));
    return true;
  }

  duplicateLayer(id) {
    const range = this.block(id);
    if (!range) return null;
    const [start, end] = range;
    const originals = this.layers.slice(start, end + 1);
    const ids = new Map(originals.map((c) => [c.id, newId('c')]));
    const copies = originals.map((c) => ({
      ...c,
      id: ids.get(c.id),
      name: c.id === id ? `${c.name} (cópia)` : c.name,
      parent: ids.get(c.parent) ?? c.parent,
    }));
    this.layers.splice(end + 1, 0, ...copies);
    for (const c of originals) {
      const copyId = ids.get(c.id);
      for (const q of this.frames) {
        const k = this.key(q.id, c.id);
        const nk = this.key(q.id, copyId);
        const source = this.links.get(k);
        if (source) {
          this.links.set(nk, source.slice(0, source.indexOf(':') + 1) + copyId);
          continue;
        }
        if (this.cells.has(k)) this.cells.set(nk, this.cells.get(k).slice());
        if (this.tileCells.has(k)) this.tileCells.set(nk, this.tileCells.get(k).slice());
      }
    }
    this.relink();
    return copies.find((c) => c.id === ids.get(id));
  }

  mergeDown(id) {
    const i = this.layerIndex(id);
    if (i <= 0) return false;
    const upper = this.layers[i];
    const lower = this.layers[i - 1];
    if (upper.kind !== 'image' || lower.kind !== 'image') throw new Error('Só dá para mesclar duas camadas de imagem (grupos e camadas de tiles ficam de fora).');
    const opacity = upper.opacity / 100;
    for (const q of this.frames) this.unlinkCel(q.id, lower.id);
    for (const q of this.frames) {
      if (!this.hasCell(q.id, upper.id)) continue;
      const origin = this.cell(q.id, upper.id);
      const dest = this.cell(q.id, lower.id);
      const mode = upper.blendMode || 'normal';
      for (let p = 0; p < origin.length; p++) {
        if (!(origin[p] >>> 24)) continue;
        dest[p] = mode === 'normal' ? overlay(dest[p], origin[p], opacity) : blendPixel(mode, dest[p], origin[p], opacity);
      }
    }
    this.removeLayer(upper.id);
    return true;
  }

  // ---- linked cels -----------------------------------------------------------------------------------------

  sourceKey(k) {
    return this.links.get(k) ?? k;
  }

  isLinked(frameId, layerId) {
    const k = this.key(frameId, layerId);
    if (this.links.has(k)) return true;
    for (const s of this.links.values()) if (s === k) return true;
    return false;
  }

  // Links the cel of `layerId` in every frame of `frameIds` to the cel of `sourceFrameId` (default: the first).
  linkCels(layerId, frameIds, sourceFrameId = frameIds[0]) {
    const layer = this.layer(layerId);
    if (!layer || layer.kind === 'group') return false;
    const source = this.sourceKey(this.key(sourceFrameId, layerId));
    const pixels = this.cell(...source.split(':'));
    const tiles = this.tileCells.get(source);
    let changed = false;
    for (const f of frameIds) {
      const k = this.key(f, layerId);
      if (k === source || this.links.get(k) === source || this.frameIndex(f) < 0) continue;
      // Cels that followed k now follow the new source as well.
      for (const [d, s] of this.links) if (s === k) this.links.set(d, source);
      this.links.delete(k);
      this.links.set(k, source);
      changed = true;
    }
    for (const [d, s] of this.links) {
      if (s !== source) continue;
      this.cells.set(d, pixels);
      if (tiles) this.tileCells.set(d, tiles);
    }
    return changed;
  }

  unlinkCel(frameId, layerId) {
    const k = this.key(frameId, layerId);
    if (this.links.has(k)) {
      this.links.delete(k);
      if (this.cells.has(k)) this.cells.set(k, this.cells.get(k).slice());
      if (this.tileCells.has(k)) this.tileCells.set(k, this.tileCells.get(k).slice());
      return true;
    }
    const dependents = [...this.links].filter(([, s]) => s === k).map(([d]) => d);
    if (!dependents.length) return false;
    const [first, ...rest] = dependents;
    this.links.delete(first);
    for (const d of rest) this.links.set(d, first);
    if (this.cells.has(k)) this.cells.set(k, this.cells.get(k).slice());
    if (this.tileCells.has(k)) this.tileCells.set(k, this.tileCells.get(k).slice());
    return true;
  }

  // Makes every linked key point to its source's arrays again (after operations that rebuild the cells).
  relink() {
    for (const [k, source] of [...this.links]) {
      const [q, c] = source.split(':');
      if (this.frameIndex(q) < 0 || this.layerIndex(c) < 0 || k === source) {
        this.links.delete(k);
        continue;
      }
      this.cells.set(k, this.cell(q, c));
      if (this.tileCells.has(source)) this.tileCells.set(k, this.tileCells.get(source));
    }
  }

  // ---- frames -------------------------------------------------------------------------------------------------

  addFrame(position = this.frames.length, duration = null) {
    const frame = { id: newId('q'), duration };
    this.frames.splice(position, 0, frame);
    return frame;
  }

  // New frame whose cels are linked to the cels of `sourceFrameId`.
  addLinkedFrame(sourceFrameId, position = this.frameIndex(sourceFrameId) + 1) {
    const i = this.frameIndex(sourceFrameId);
    if (i < 0) return null;
    const frame = this.addFrame(position, this.frames[i].duration);
    for (const c of this.layers) {
      if (c.kind === 'group') continue;
      this.linkCels(c.id, [sourceFrameId, frame.id], sourceFrameId);
    }
    return frame;
  }

  duplicateFrame(id) {
    const i = this.frameIndex(id);
    if (i < 0) return null;
    const copy = this.addFrame(i + 1, this.frames[i].duration);
    for (const c of this.layers) {
      if (this.hasCell(id, c.id)) this.cells.set(this.key(copy.id, c.id), this.cell(id, c.id).slice());
      const k = this.key(id, c.id);
      if (this.tileCells.has(k)) this.tileCells.set(this.key(copy.id, c.id), this.tileCells.get(k).slice());
    }
    return copy;
  }

  removeFrame(id) {
    if (this.frames.length <= 1) return false;
    const i = this.frameIndex(id);
    if (i < 0) return false;
    this.tags = this.tags.filter((t) => {
      if (t.from === id && t.to === id) return false;
      if (t.from === id) t.from = this.frames[i + 1]?.id ?? t.to;
      if (t.to === id) t.to = this.frames[i - 1]?.id ?? t.from;
      return true;
    });
    this.frames.splice(i, 1);
    for (const c of this.layers) this.dropKey(this.key(id, c.id));
    return true;
  }

  moveFrame(id, delta) {
    const i = this.frameIndex(id);
    const j = i + delta;
    if (i < 0 || j < 0 || j >= this.frames.length) return false;
    const [q] = this.frames.splice(i, 1);
    this.frames.splice(j, 0, q);
    for (const t of this.tags) if (this.frameIndex(t.from) > this.frameIndex(t.to)) [t.from, t.to] = [t.to, t.from];
    return true;
  }

  // ---- tags and slices ------------------------------------------------------------------------------------------

  addTag({ name, from, to, direction = 'forward', repeat = 0, color = '#5d1c16' } = {}) {
    let a = this.frameIndex(from);
    let b = this.frameIndex(to);
    if (a < 0 || b < 0) throw new Error('A tag precisa começar e terminar em quadros existentes.');
    if (a > b) [a, b] = [b, a];
    const tag = { id: newId('g'), name: name || `Tag ${this.tags.length + 1}`, from: this.frames[a].id, to: this.frames[b].id, direction, repeat, color };
    this.tags.push(tag);
    return tag;
  }

  // The innermost tag that contains the frame (the one with the smallest range).
  tagAt(frameIndex) {
    let best = null;
    for (const t of this.tags) {
      const a = this.frameIndex(t.from);
      const b = this.frameIndex(t.to);
      if (frameIndex < a || frameIndex > b) continue;
      if (!best || b - a < this.frameIndex(best.to) - this.frameIndex(best.from)) best = t;
    }
    return best;
  }

  addSlice({ name, color = '#2f80ed', x = 0, y = 0, width = this.width, height = this.height, center = null, pivot = null } = {}) {
    const slice = { id: newId('s'), name: name || `Slice ${this.slices.length + 1}`, color, x, y, width, height, center, pivot };
    this.slices.push(slice);
    return slice;
  }

  // ---- composition -----------------------------------------------------------------------------------------

  // Groups composite their children: a group in normal mode at 100% passes them straight through; otherwise
  // the children are composited into a separate buffer that is then blended with the group's mode and opacity.
  composite(frameIndex, dest = new Uint32Array(this.total), { includeHidden = false, includeReference = false } = {}) {
    dest.fill(0);
    const frame = this.frames[frameIndex];
    if (!frame) return dest;
    const byParent = new Map();
    const ids = new Set(this.layers.map((c) => c.id));
    for (const c of this.layers) {
      const p = c.parent && ids.has(c.parent) ? c.parent : null;
      if (!byParent.has(p)) byParent.set(p, []);
      byParent.get(p).push(c);
    }
    const draw = (parent, target, depth) => {
      for (const layer of byParent.get(parent) ?? []) {
        if (!layer.visible && !includeHidden) continue;
        if (layer.reference && !includeReference) continue;
        const opacity = layer.opacity / 100;
        if (opacity <= 0) continue;
        if (layer.kind === 'group') {
          if (depth > 32) continue;
          if ((layer.blendMode || 'normal') === 'normal' && layer.opacity >= 100) draw(layer.id, target, depth + 1);
          else blendInto(target, draw(layer.id, new Uint32Array(this.total), depth + 1), layer.blendMode, opacity);
          continue;
        }
        if (!this.hasCell(frame.id, layer.id)) continue;
        blendInto(target, this.cell(frame.id, layer.id), layer.blendMode, opacity);
      }
      return target;
    };
    return draw(null, dest, 0);
  }

  // ---- geometry ------------------------------------------------------------------------------------------------

  afterGeometry(oldWidth) {
    this.relink();
    if (this.tileCells.size) fitTileGrids(this, oldWidth);
  }

  resize(newWidth, newHeight, anchorX = 0.5, anchorY = 0.5) {
    newWidth = validateSide(newWidth);
    newHeight = validateSide(newHeight);
    const oldWidth = this.width;
    const dx = Math.round((newWidth - this.width) * anchorX);
    const dy = Math.round((newHeight - this.height) * anchorY);
    for (const [k, origin] of this.cells) {
      if (this.links.has(k)) continue;
      const dest = new Uint32Array(newWidth * newHeight);
      for (let y = 0; y < this.height; y++) {
        const ny = y + dy;
        if (ny < 0 || ny >= newHeight) continue;
        for (let x = 0; x < this.width; x++) {
          const nx = x + dx;
          if (nx < 0 || nx >= newWidth) continue;
          dest[ny * newWidth + nx] = origin[y * this.width + x];
        }
      }
      this.cells.set(k, dest);
    }
    this.width = newWidth;
    this.height = newHeight;
    this.afterGeometry(oldWidth);
  }

  scale(newWidth, newHeight) {
    newWidth = validateSide(newWidth);
    newHeight = validateSide(newHeight);
    const oldWidth = this.width;
    for (const [k, origin] of this.cells) {
      if (this.links.has(k)) continue;
      const dest = new Uint32Array(newWidth * newHeight);
      for (let y = 0; y < newHeight; y++) {
        const sy = Math.min(this.height - 1, Math.floor(((y + 0.5) * this.height) / newHeight));
        for (let x = 0; x < newWidth; x++) {
          const sx = Math.min(this.width - 1, Math.floor(((x + 0.5) * this.width) / newWidth));
          dest[y * newWidth + x] = origin[sy * this.width + sx];
        }
      }
      this.cells.set(k, dest);
    }
    this.width = newWidth;
    this.height = newHeight;
    this.afterGeometry(oldWidth);
  }

  crop(x, y, newWidth, newHeight) {
    newWidth = validateSide(newWidth);
    newHeight = validateSide(newHeight);
    const oldWidth = this.width;
    x = Math.round(x);
    y = Math.round(y);
    for (const [k, origin] of this.cells) {
      if (this.links.has(k)) continue;
      const dest = new Uint32Array(newWidth * newHeight);
      for (let ny = 0; ny < newHeight; ny++) {
        const sy = ny + y;
        if (sy < 0 || sy >= this.height) continue;
        for (let nx = 0; nx < newWidth; nx++) {
          const sx = nx + x;
          if (sx < 0 || sx >= this.width) continue;
          dest[ny * newWidth + nx] = origin[sy * this.width + sx];
        }
      }
      this.cells.set(k, dest);
    }
    this.width = newWidth;
    this.height = newHeight;
    this.afterGeometry(oldWidth);
  }

  flipCell(pixels, axis) {
    const L = this.width;
    const A = this.height;
    const copy = pixels.slice();
    for (let y = 0; y < A; y++) {
      for (let x = 0; x < L; x++) {
        const sx = axis === 'horizontal' ? L - 1 - x : x;
        const sy = axis === 'vertical' ? A - 1 - y : y;
        pixels[y * L + x] = copy[sy * L + sx];
      }
    }
  }

  rotate(dir = 1) {
    const L = this.width;
    const A = this.height;
    for (const [k, origin] of this.cells) {
      if (this.links.has(k)) continue;
      const dest = new Uint32Array(L * A);
      for (let y = 0; y < A; y++) {
        for (let x = 0; x < L; x++) {
          const nx = dir > 0 ? A - 1 - y : y;
          const ny = dir > 0 ? x : L - 1 - x;
          dest[ny * A + nx] = origin[y * L + x];
        }
      }
      this.cells.set(k, dest);
    }
    this.width = A;
    this.height = L;
    this.afterGeometry(L);
  }

  usedColors() {
    const colors = new Map();
    for (let q = 0; q < this.frames.length; q++) {
      const px = this.composite(q);
      for (const c of px) if (c >>> 24 && !colors.has(c)) colors.set(c, colors.size);
    }
    return [...colors.keys()];
  }

  // ---- history -------------------------------------------------------------------------------------------------

  snapshot() {
    const cells = new Map();
    for (const [k, px] of this.cells) {
      if (this.links.has(k)) continue;
      if (!isEmpty(px)) cells.set(k, encodeRLE(px));
    }
    const tileCells = new Map();
    for (const [k, grid] of this.tileCells) if (!this.links.has(k)) tileCells.set(k, encodeRLE(grid));
    return {
      name: this.name,
      width: this.width,
      height: this.height,
      fps: this.fps,
      colorMode: this.colorMode,
      layers: this.layers.map((c) => ({ ...c })),
      frames: this.frames.map((q) => ({ ...q })),
      cells,
      links: new Map(this.links),
      tags: this.tags.map((t) => ({ ...t })),
      slices: this.slices.map((s) => ({ ...s, center: s.center ? { ...s.center } : null, pivot: s.pivot ? { ...s.pivot } : null })),
      tilesets: this.tilesets.map((t) => ({ ...t, tiles: t.tiles.map((tile) => encodeRLE(tile)) })),
      tileCells,
    };
  }

  restore(state) {
    this.name = state.name;
    this.width = state.width;
    this.height = state.height;
    this.fps = state.fps;
    this.colorMode = state.colorMode ?? 'rgba';
    this.layers = state.layers.map((c) => ({ ...c }));
    this.frames = state.frames.map((q) => ({ ...q }));
    this.cells = new Map();

function bitmapPath(bitmap) {
  let d = '';

    while (x < line.length) {

        let end = x;
        while (end < line.length && line[end] === '#') end++;
        d += `M${x} ${y}h${end - x}v1h-${end - x}z`;
        x = end;
      } else x++;

  });
  return d;
}

  const aria = label ? `role="img" aria-label="${safe}"` : 'aria-hidden="true"';

}

function identifier(name, style = 'camel') {
  const parts = String(name || 'sprite')
    .normalize('NFD')
    .replace(/[̀-ͯ]/g, '')
    .split(/[^A-Za-z0-9]+/)
    .filter(Boolean)
    .map((p) => p.toLowerCase());
  if (!parts.length) parts.push('sprite');
  if (/^[0-9]/.test(parts[0])) parts.unshift('sprite');
  if (style === 'snake') return parts.join('_');
  if (style === 'constant') return parts.join('_').toUpperCase();
  const cap = parts.map((p) => p[0].toUpperCase() + p.slice(1));
  if (style === 'pascal') return cap.join('');
  return parts[0] + cap.slice(1).join('');
}

function buildMatrices(frames, width, height, { mode = 'indices', palette = null } = {}) {
  const order = new Map();
  if (palette) for (const c of palette) if (c >>> 24 && !order.has(c)) order.set(c, order.size);
  if (mode === 'indices') {
    for (const px of frames) for (const c of px) if (c >>> 24 && !order.has(c)) order.set(c, order.size);
  }
  const matrices = frames.map((px) => {
    const rows = [];
    for (let y = 0; y < height; y++) {
      const row = [];
      for (let x = 0; x < width; x++) {
        const c = px[y * width + x];
        if (mode === 'indices') row.push(c >>> 24 ? order.get(c) : -1);
        else row.push(c >>> 24 ? colorToHex(c) : null);
      }
      rows.push(row);
    }
    return rows;
  });
  return { width, height, mode, palette: [...order.keys()].map((c) => colorToHex(c)), frames: matrices };
}

const valueText = (v, quotes = '"', nullText = 'null') => (v === null ? nullText : typeof v === 'string' ? quotes + v + quotes : String(v));

function rowsBlock(matrix, indent, openBracket, closeBracket, quotes, nullText, width = 0) {
  return matrix
    .map((row) => indent + openBracket + row.map((v) => valueText(v, quotes, nullText).padStart(width)).join(', ') + closeBracket)
    .join(',\n');
}

function valueWidth(data) {
  if (data.mode !== 'indices') return 0;
  let m = 1;
  for (const q of data.frames) for (const l of q) for (const v of l) m = Math.max(m, String(v).length);
  return m;

function generateJSON(data, name) {

    .map((q) => '    [\n' + rowsBlock(q, '      ', '[', ']', '"', 'null', w) + '\n    ]')
    .join(',\n');
  return (

    `  "width": ${data.width},\n` +
    `  "height": ${data.height},\n` +
    `  "mode": ${JSON.stringify(data.mode)},\n` +
    (data.mode === 'indices' ? '  "transparent": -1,\n' : '') +
    `  "palette": ${JSON.stringify(data.palette)},\n` +
    '  "frames": [\n' +

    '\n  ]\n}\n'
  );
}

function hexToInt(hex, order) {
  const h = hex.replace('#', '');
  const rgb = h.slice(0, 6).toUpperCase();
  const a = (h.length === 8 ? h.slice(6, 8) : 'FF').toUpperCase();
  return order === 'argb' ? '0x' + a + rgb : '0x' + rgb + a;
}

function generateC(data, name) {
  const id = identifier(name, 'snake');
  const ID = id.toUpperCase();
  const type = data.mode === 'indices' ? (data.palette.length > 32767 ? 'int32_t' : 'int16_t') : 'uint32_t';
  const convert = (v) => (data.mode === 'indices' ? v : v === null ? '0x00000000' : hexToInt(v, 'rgba'));
  const w = data.mode === 'indices' ? valueWidth(data) : 10;
  const frames = data.frames
    .map((q) => '    {\n' + q.map((l) => '        {' + l.map((v) => String(convert(v)).padStart(w)).join(', ') + '}').join(',\n') + '\n    }')
    .join(',\n');
  const palette = data.palette.length ? data.palette.map((c) => hexToInt(c, 'rgba')).join(', ') : '0x00000000';
  return (
    `#ifndef ${ID}_H\n#define ${ID}_H\n\n#include <stdint.h>\n\n` +
    `#define ${ID}_WIDTH ${data.width}\n#define ${ID}_HEIGHT ${data.height}\n#define ${ID}_FRAMES ${data.frames.length}\n` +
    `#define ${ID}_COLORS ${data.palette.length}\n\n` +
    `static const uint32_t ${id}_palette[${Math.max(1, data.palette.length)}] = {${palette}};\n\n` +
    `static const ${type} ${id}_pixels[${ID}_FRAMES][${ID}_HEIGHT][${ID}_WIDTH] = {\n` +
    frames +
    `\n};\n\n#endif\n`
  );
}

// A Java initializer goes over 64 KB of bytecode with a few thousand numbers, and the class does not compile.
// Above this limit, the matrix and the palette are packed as text and decoded when the class loads.
const JAVA_LITERAL_LIMIT = 4096;
const JAVA_CHUNK = 20000;

function javaText(codes) {
  let s = '';
  for (const c of codes) {
    if (c === 34) s += '\\"';
    else if (c === 92) s += '\\\\';
    else if (c >= 32 && c < 127) s += String.fromCharCode(c);
    else if (c < 128) s += '\\' + c.toString(8).padStart(3, '0');
    else s += '\\u' + c.toString(16).toUpperCase().padStart(4, '0');
  }
  return s;
}

function javaChunks(codes, indent) {
  const parts = [];
  for (let i = 0; i < codes.length; i += JAVA_CHUNK) parts.push(`${indent}"${javaText(codes.slice(i, i + JAVA_CHUNK))}"`);
  return parts.join(',\n');
}

function argb(hex) {
  const h = hex.replace('#', '');
  return ((parseInt(h.length === 8 ? h.slice(6, 8) : 'ff', 16) << 24) | parseInt(h.slice(0, 6), 16)) >>> 0;
}

function generateCompactJava(data, className) {

  for (const c of data.palette) {
    const u = argb(c);
    colors.push(u >>> 16, u & 0xffff);

    `public final class ${className} {\n\n` +
    `    public static final int WIDTH = ${data.width};\n` +
    `    public static final int HEIGHT = ${data.height};\n` +
    (indices ? '    public static final int TRANSPARENT = -1;\n' : '') +
    `\n    public static final int[] PALETTE;\n` +
    `    public static final int[][][] FRAMES;\n\n` +
    `    // Matrix too large for a Java literal (64 KB limit per method): the values are packed\n` +
    `    // as text, ${oneChar ? 'one character per pixel (value + 33)' : 'two characters per value (high and low 16 bits)'}, and are read when the class loads.\n` +
    `    private static final String[] PALETTE_DATA = {\n${javaChunks(colors, '        ')}${colors.length ? ',' : ''}\n    };\n\n` +
    `    private static final String[] DATA = {\n${javaChunks(codes, '        ')},\n    };\n\n` +
    `    static {\n` +
    `        PALETTE = read(PALETTE_DATA, 2, 0, ${data.palette.length});\n` +
    `        int[] v = read(DATA, ${oneChar ? 1 : 2}, ${base}, ${total});\n` +
    `        FRAMES = new int[${data.frames.length}][HEIGHT][WIDTH];\n` +
    `        for (int f = 0, i = 0; f < ${data.frames.length}; f++)\n` +
    `            for (int y = 0; y < HEIGHT; y++)\n` +
    `                for (int x = 0; x < WIDTH; x++) FRAMES[f][y][x] = v[i++];\n` +
    `    }\n\n` +
    `    private static int[] read(String[] parts, int width, int base, int total) {\n` +
    `        StringBuilder text = new StringBuilder();\n` +
    `        for (String part : parts) text.append(part);\n` +
    `        int[] values = new int[total];\n` +
    `        for (int i = 0, k = 0; i < total; i++) {\n` +
    `            if (width == 1) values[i] = text.charAt(k++) - base;\n` +
    `            else values[i] = ((text.charAt(k++) << 16) | text.charAt(k++)) - base;\n` +
    `        }\n` +
    `        return values;\n` +
    `    }\n\n` +
    `    private ${className}() {\n    }\n}\n`
  );
}

function generateJava(data, name) {

  const convert = (v) => (data.mode === 'indices' ? v : v === null ? '0x00000000' : hexToInt(v, 'argb'));
  const w = data.mode === 'indices' ? valueWidth(data) : 10;

    .map((q) => '        {\n' + q.map((l) => '            {' + l.map((v) => String(convert(v)).padStart(w)).join(', ') + '}').join(',\n') + '\n        }')
    .join(',\n');

    `    public static final int WIDTH = ${data.width};\n` +
    `    public static final int HEIGHT = ${data.height};\n` +

function sheetLayout(count, width, height, { layout = 'horizontal', columns = 4, spacing = 0, margin = 0 } = {}) {
  let cols;
  if (layout === 'horizontal') cols = count;
  else if (layout === 'vertical') cols = 1;
  else cols = Math.max(1, Math.min(count, Math.round(columns) || 1));
  const rows = Math.ceil(count / cols);
  const positions = [];
  for (let i = 0; i < count; i++) {
    const c = i % cols;
    const l = Math.floor(i / cols);
    positions.push({ x: margin + c * (width + spacing), y: margin + l * (height + spacing), width, height });
  }
  return {
    columns: cols,
    rows,
    width: margin * 2 + cols * width + (cols - 1) * spacing,
    height: margin * 2 + rows * height + (rows - 1) * spacing,
    positions,
  };
}

function scaleNearest(pixels, width, height, factor) {
  factor = Math.max(1, Math.floor(factor));
  if (factor === 1) return pixels.slice();
  const L = width * factor;
  const output = new Uint32Array(L * height * factor);
  for (let y = 0; y < height; y++) {
    const row = new Uint32Array(L);
    for (let x = 0; x < width; x++) row.fill(pixels[y * width + x], x * factor, (x + 1) * factor);
    for (let k = 0; k < factor; k++) output.set(row, (y * factor + k) * L);
  }
  return output;
}

function paste(dest, destWidth, origin, sourceWidth, sourceHeight, x0, y0) {
  for (let y = 0; y < sourceHeight; y++) {
    dest.set(origin.subarray(y * sourceWidth, (y + 1) * sourceWidth), (y0 + y) * destWidth + x0);
  }
}

    this.secondary = el('button', { type: 'button', class: 'color-large secondary', title: 'Cor secundária (clique direito)', onclick: () => this.openPicker('secondary') });
    this.hex = el('input', { type: 'text', class: 'hex', maxlength: 9, spellcheck: 'false', 'aria-label': 'Código hexadecimal da cor principal' });
    this.alpha = el('input', { type: 'range', min: 0, max: 255, 'aria-label': 'Opacidade da cor principal' });
    this.alphaValue = el('output', { class: 'mono' });
    this.recent = el('div', { class: 'swatches recent', 'aria-label': 'Cores recentes' });
    root.append(
      el(
        'div',
        { class: 'color-row' },
        el('div', { class: 'color-pair' }, this.secondary, this.primary, el('button', { type: 'button', class: 'icon-button swap', title: 'Trocar cores (X)', 'aria-label': 'Trocar cores', html: icon('swap', 14), onclick: () => editor.swapColors() })),
        el('div', { class: 'color-fields' }, el('label', { class: 'field compact' }, el('span', {}, 'Hex'), this.hex), el('label', { class: 'field compact' }, el('span', {}, 'Alfa'), this.alpha, this.alphaValue)),
      ),
      el('div', { class: 'small-label' }, 'Recentes'),
      this.recent,
      this.picker,
    );
    this.picker.addEventListener('input', () => {
      const current = this.target === 'secondary' ? editor.state.secondaryColor : editor.state.primaryColor;
      editor.setColor(this.target, withAlpha(hexToColor(this.picker.value), alpha(current) || 255));
    });
    this.picker.addEventListener('change', () => editor.rememberColor(this.target === 'secondary' ? editor.state.secondaryColor : editor.state.primaryColor));
    this.hex.addEventListener('change', () => {
      const c = hexToColor(this.hex.value);
      if (c === null) {
        notify('Use um código como #5d1c16 ou #5d1c16cc.', 'warning');
        this.update();
        return;
      }
      editor.setColor('primary', c);
      editor.rememberColor(c);
    });
    this.alpha.addEventListener('input', () => editor.setColor('primary', withAlpha(editor.state.primaryColor, +this.alpha.value)));
    editor.on('color', () => this.update());
    editor.on('recent', () => this.updateRecent());
    this.update();
    this.updateRecent();
  }

  // HSV picker (ui/color-picker.js) with live preview; Cancel puts the previous color back.
  async openPicker(which) {
    this.target = which;
    const key = which === 'secondary' ? 'secondaryColor' : 'primaryColor';
    const before = this.editor.state[key];
    const chosen = await colorPickerDialog({
      color: before,
      title: which === 'secondary' ? 'Cor secundária' : 'Cor principal',
      gray: this.editor.doc?.colorMode === 'grayscale',
      onInput: (c) => this.editor.setColor(which, c),
    });
    if (chosen === null || chosen === undefined) {
      this.editor.setColor(which, before);
      return;
    }
    this.editor.setColor(which, chosen);
    this.editor.rememberColor(this.editor.state[key]);
  }

  // The browser's native color input (kept for code that still wants it).
  openNativePicker(which) {
    this.target = which;
    const c = which === 'secondary' ? this.editor.state.secondaryColor : this.editor.state.primaryColor;
    this.picker.value = colorToHex6(c);
    this.picker.click();
  }

  update() {
    const { primaryColor: p, secondaryColor: s } = this.editor.state;
    this.primary.style.setProperty('--color', colorToHex(p, true));
    this.secondary.style.setProperty('--color', colorToHex(s, true));
    this.primary.setAttribute('aria-label', `Cor principal ${colorToHex(p)}`);
    this.secondary.setAttribute('aria-label', `Cor secundária ${colorToHex(s)}`);
    if (document.activeElement !== this.hex) this.hex.value = colorToHex(p);
    this.alpha.value = alpha(p);
    this.alphaValue.textContent = Math.round((alpha(p) / 255) * 100) + '%';
  }

  updateRecent() {
    this.recent.replaceChildren(
      ...this.editor.recent.map((c) =>
        swatch(c, {
          onClick: () => this.editor.setColor('primary', c),
          onRightClick: () => this.editor.setColor('secondary', c),
        }),
      ),
    );
    if (!this.editor.recent.length) this.recent.append(el('span', { class: 'empty' }, 'As cores usadas aparecem aqui.'));
  }
}

class PalettePanel {
  constructor(root, editor, getStorage) {
    this.editor = editor;
    this.getStorage = getStorage;
    this.mine = [];
    this.select = el('select', { 'aria-label': 'Paleta' });
    this.grid = el('div', { class: 'swatches palette' });
    this.info = el('div', { class: 'small-label palette-info' });
    const actions = el(
      'div',
      { class: 'row-actions' },
      el('button', { type: 'button', class: 'button small', onclick: () => this.addCurrentColor(), title: 'Adicionar a cor principal à paleta' }, '+ Cor'),
      el('button', { type: 'button', class: 'button small', onclick: () => this.create() }, 'Nova'),
      el('button', { type: 'button', class: 'button small', onclick: () => this.fromDrawing(), title: 'Cria uma paleta com as cores usadas no projeto' }, 'Do desenho'),
      el('button', { type: 'button', class: 'button small', onclick: () => this.importFile() }, 'Importar'),
      el('button', { type: 'button', class: 'button small', onclick: () => this.exportFile() }, 'Exportar'),
      el('button', { type: 'button', class: 'button small', onclick: () => this.rename(), data: { mineOnly: '1' } }, 'Renomear'),
      el('button', { type: 'button', class: 'button small danger', onclick: () => this.remove(), data: { mineOnly: '1' } }, 'Excluir'),
    );
    this.actions = actions;
    root.append(this.select, this.grid, this.info, actions);
    this.select.addEventListener('change', () => {
      editor.setState('palette', this.select.value);
      this.draw();
    });
    editor.on('color', () => this.markActive());
    this.load();
  }

  get all() {
    return [...PRESET_PALETTES.map((p) => normalizePalette({ ...p, id: p.slug, preset: true })), ...this.mine];
  }

  get current() {
    return this.all.find((p) => p.id === this.editor.state.palette) ?? this.all[0];
  }

  async load() {
    try {
      const list = await this.getStorage().listPalettes();
      this.mine = list.map((p) => normalizePalette({ ...p, preset: false }));
    } catch (error) {
      notify('Não foi possível carregar as paletas salvas: ' + error.message, 'error');
    }
    this.buildSelect();
    this.draw();
  }

  buildSelect() {
    const group = (label, list) => el('optgroup', { label: label }, list.map((p) => el('option', { value: p.id, selected: p.id === this.current.id }, `${p.name} (${p.colors.length})`)));
    this.select.replaceChildren(group('Predefinidas', this.all.filter((p) => p.preset)));
    if (this.mine.length) this.select.append(group('Minhas paletas', this.mine));
    this.select.value = this.current.id;
  }

  draw() {
    const p = this.current;
    this.grid.replaceChildren(
      ...p.colors.map((c, i) =>
        swatch(c, {
          title: `${colorToHex(c)} (${i + 1})${p.preset ? '' : ' · Ctrl+clique remove'}`,
          onClick: (e) => {
            if ((e.ctrlKey || e.metaKey) && !p.preset) return this.removeColor(i);
            this.editor.setColor('primary', c);
          },
          onRightClick: () => this.editor.setColor('secondary', c),
        }),
      ),
    );
    this.info.textContent = p.description || (p.preset ? '' : 'Clique esquerdo escolhe a cor principal, direito a secundária. Ctrl+clique remove a cor.');
    for (const b of this.actions.querySelectorAll('[data-mine-only]')) b.disabled = p.preset;
    this.markActive();
  }

  markActive() {
    const p = this.current;
    const buttons = this.grid.children;
    p.colors.forEach((c, i) => buttons[i]?.classList.toggle('active', c === this.editor.state.primaryColor));
  }

  async save(p) {
    const saved = await this.getStorage().savePalette({ id: p.preset ? null : p.id, name: p.name, colors: p.colors.map((c) => colorToHex(c)) });
    const normal = normalizePalette({ ...saved, preset: false });
    const i = this.mine.findIndex((x) => x.id === normal.id || x.id === p.id);
    if (i >= 0) this.mine[i] = normal;
    else this.mine.push(normal);
    this.editor.setState('palette', normal.id);
    this.buildSelect();
    this.draw();
    return normal;
  }

  async ensureEditable() {
    const p = this.current;
    if (!p.preset) return p;
    const name = await promptText('Copiar paleta', 'As paletas predefinidas não mudam. Nome da sua cópia:', `${p.name} (minha)`);
    if (!name) return null;
    return this.save({ name, colors: [...p.colors], preset: false });
  }

  async addColors(colors) {
    const p = await this.ensureEditable();
    if (!p) return;
    const added = colors.filter((c) => !p.colors.includes(c));
    if (!added.length) {
      notify('Essas cores já estão na paleta.');
      return;
    }
    await this.save({ ...p, colors: [...p.colors, ...added] });
    notify(added.length === 1 ? 'Cor adicionada à paleta.' : `${added.length} cores adicionadas à paleta.`, 'success');
  }

  addCurrentColor() {
    return this.addColors([this.editor.state.primaryColor]);
  }

  async removeColor(i) {
    const p = this.current;
    await this.save({ ...p, colors: p.colors.filter((_, k) => k !== i) });
  }

  async create() {
    const name = await promptText('Nova paleta', 'Nome da paleta', 'Minha paleta');
    if (!name) return;
    await this.save({ name, colors: [this.editor.state.primaryColor, this.editor.state.secondaryColor].filter((c) => c >>> 24), preset: false });
    notify('Paleta criada. Use "+ Cor" ou o gerador de tons para preencher.', 'success');
  }

  async fromDrawing() {
    const colors = extractPalette(this.editor.doc.frames.flatMap((_, i) => [...this.editor.doc.composite(i)]), 256);
    if (!colors.length) {
      notify('O desenho ainda não tem cores.', 'warning');
      return;
    }
    const name = await promptText('Paleta do desenho', `${colors.length} cores encontradas. Nome da paleta:`, `Cores de ${this.editor.doc.name}`);
    if (!name) return;
    await this.save({ name, colors, preset: false });
  }

  async importFile() {
    const file = await pickFile('.hex,.gpl,.json,.txt,.csv');
    if (!file) return;
    try {
      const { name, colors } = importPalette(await file.text(), file.name);
      await this.save({ name, colors, preset: false });
      notify(`Paleta "${name}" importada com ${colors.length} cores.`, 'success');
    } catch (error) {
      notify('Não deu para importar: ' + error.message, 'error');
    }
  }

  async exportFile() {
    const p = this.current;
    const select = el('select', {}, el('option', { value: 'hex' }, '.hex (uma cor por linha, Lospec)'), el('option', { value: 'gpl' }, '.gpl (GIMP, Krita)'), el('option', { value: 'json' }, '.json'));
    const format = await openDialog({
      title: `Exportar "${p.name}"`,
      body: el('label', { class: 'field' }, el('span', {}, 'Formato'), select),
      actions: [
        { label: 'Cancelar', value: null },
        { label: 'Baixar', primary: true, send: true, action: () => select.value },
      ],
    });
    if (!format) return;
    downloadText(exportPalette(p, format), fileNameFor(p.name, format));
  }

  async rename() {
    const p = this.current;
    if (p.preset) return;
    const name = await promptText('Renomear paleta', 'Novo nome', p.name);
    if (name) await this.save({ ...p, name });
  }

  async remove() {
    const p = this.current;
    if (p.preset) return;
    if (!(await confirm('Excluir paleta', `A paleta "${p.name}" será apagada.`, 'Excluir', true))) return;
    await this.getStorage().deletePalette(p.id);
    this.mine = this.mine.filter((x) => x.id !== p.id);
    this.editor.setState('palette', 'crivo');
    this.buildSelect();
    this.draw();
  }
}

class RampPanel {
  constructor(root, editor, palettePanel) {
    this.editor = editor;
    this.palettePanel = palettePanel;
    const prefs = readPreference('ramp', { steps: 3, intensity: 80, shift: 18 });
    this.steps = el('input', { type: 'range', min: 1, max: 6, value: prefs.steps, 'aria-label': 'Tons para cada lado' });
    this.intensity = el('input', { type: 'range', min: 10, max: 100, value: prefs.intensity, 'aria-label': 'Intensidade' });
    this.shift = el('input', { type: 'range', min: 0, max: 60, value: prefs.shift, 'aria-label': 'Desvio de matiz' });
    this.outputs = { steps: el('output', { class: 'mono' }), intensity: el('output', { class: 'mono' }), shift: el('output', { class: 'mono' }) };
    this.ramp = el('div', { class: 'swatches ramp' });
    root.append(
      this.ramp,
      el('label', { class: 'field compact' }, el('span', {}, 'Passos'), this.steps, this.outputs.steps),
      el('label', { class: 'field compact' }, el('span', {}, 'Alcance'), this.intensity, this.outputs.intensity),
      el('label', { class: 'field compact', title: 'Sombras puxam para o azul e luzes para o amarelo, como na pintura de pixel art' }, el('span', {}, 'Matiz'), this.shift, this.outputs.shift),
      el('div', { class: 'row-actions' }, el('button', { type: 'button', class: 'button small', onclick: () => this.palettePanel.addColors(this.colors) }, 'Adicionar à paleta')),
    );
    for (const i of [this.steps, this.intensity, this.shift]) {
      i.addEventListener('input', () => {
        writePreference('ramp', { steps: +this.steps.value, intensity: +this.intensity.value, shift: +this.shift.value });
        this.update();
      });
    }
    editor.on('color', ({ which }) => {
      if (which !== 'secondary' && !this.picking) this.update();
    });
    this.update();
  }

  update() {
    const base = this.editor.state.primaryColor;
    this.outputs.steps.textContent = this.steps.value;
    this.outputs.intensity.textContent = this.intensity.value + '%';
    this.outputs.shift.textContent = this.shift.value + '°';
    const { ramp } = generateRamp(base, { steps: +this.steps.value, intensity: +this.intensity.value / 100, hueShift: +this.shift.value });
    this.colors = ramp;
    this.ramp.replaceChildren(
      ...ramp.map((c) =>
        swatch(c, {
          className: c === base ? 'base' : '',
          onClick: () => {
            this.picking = true;
            this.editor.setColor('primary', c);
            this.picking = false;
            this.mark(c);
          },
          onRightClick: () => this.editor.setColor('secondary', c),
        }),
      ),
    );
    this.mark(base);
  }

  mark(c) {
    [...this.ramp.children].forEach((b, i) => b.classList.toggle('active', this.colors[i] === c));
  }
}

class LayersPanel {
  constructor(root, editor) {
    this.editor = editor;
    LayersPanel.instance = this;
    this.list = el('ol', { class: 'layer-list', 'aria-label': 'Camadas, da mais alta para a mais baixa' });
    this.opacity = el('input', { type: 'range', min: 0, max: 100, 'aria-label': 'Opacidade da camada' });
    this.opacityValue = el('output', { class: 'mono' });
    this.tiles = el('div', { class: 'tileset-section', hidden: true });
    root.append(
      this.list,
      el('label', { class: 'field compact' }, el('span', {}, 'Opacidade'), this.opacity, this.opacityValue),
      el(
        'div',
        { class: 'row-actions icons' },
        iconButton('plus', 'Nova camada', () => this.action('Nova camada', (d) => editor.selectLayer(d.addLayer(null, d.layerIndex(editor.currentLayer.id) + 1).id))),
        iconButton('folder', 'Novo grupo', () => this.action('Novo grupo', (d) => editor.selectLayer(d.addGroup(null, d.layerIndex(editor.currentLayer.id) + 1).id))),
        iconButton('duplicate', 'Duplicar camada', () => this.action('Duplicar camada', (d) => editor.selectLayer(d.duplicateLayer(editor.currentLayer.id).id))),
        iconButton('up', 'Subir camada', () => this.action('Subir camada', (d) => d.moveLayer(editor.currentLayer.id, 1))),
        iconButton('down', 'Descer camada', () => this.action('Descer camada', (d) => d.moveLayer(editor.currentLayer.id, -1))),
        iconButton('merge', 'Mesclar com a de baixo', () => this.action('Mesclar camadas', (d) => d.mergeDown(editor.currentLayer.id))),
        iconButton('trash', 'Excluir camada', () => this.remove()),
      ),
      this.tiles,
    );
    const saveOpacity = delay((id, before, value) => {
      const layer = editor.doc.layer(id);
      if (!layer) return;
      layer.opacity = before;
      editor.editStructure('Opacidade da camada', (d) => {
        d.layer(id).opacity = value;
      });
    }, 400);
    this.opacity.addEventListener('input', () => {
      const c = editor.currentLayer;
      if (this.originalOpacity === undefined || this.opacityId !== c.id) {
        this.originalOpacity = c.opacity;
        this.opacityId = c.id;
      }
      c.opacity = +this.opacity.value;
      this.opacityValue.textContent = c.opacity + '%';
      editor.emit('pixels');
      saveOpacity(c.id, this.originalOpacity, c.opacity);
    });
    this.opacity.addEventListener('change', () => {
      this.originalOpacity = undefined;
    });
    editor.on('document', () => this.draw());
    editor.on('layer', () => this.draw());
    editor.on('frame', () => this.scheduleThumbnails());
    editor.on('pixels', ({ thumbnails }) => {
      if (thumbnails) this.scheduleThumbnails();
    });
    editor.on('state', ({ key }) => {
      if (key === 'tileIndex' || key === 'tileMode') this.drawTiles();
    });
    this.scheduleThumbnails = delay(() => this.thumbnails(), 120);
    this.draw();
  }

  action(label, fn) {
    try {
      this.editor.editStructure(label, fn);
    } catch (error) {
      notify(error.message, 'error');
    }
  }

  async remove() {
    const d = this.editor.doc;
    const layer = this.editor.currentLayer;
    const range = d.block(layer.id);
    const drawable = d.layers.filter((c, i) => (i < range[0] || i > range[1]) && c.kind !== 'group').length;
    if (d.layers.length <= 1 || !drawable) {
      notify('O projeto precisa de pelo menos uma camada.', 'warning');
      return;
    }
    if (layer.kind === 'group' && range[1] > range[0] && !(await confirm('Excluir grupo', `O grupo "${layer.name}" e as ${range[1] - range[0]} camada(s) dentro dele serão apagados.`, 'Excluir', true))) return;
    this.action(layer.kind === 'group' ? 'Excluir grupo' : 'Excluir camada', (doc) => doc.removeLayer(layer.id));
  }

  // True when some group above the layer is collapsed (the row is not shown).
  folded(c) {
    const doc = this.editor.doc;
    let p = c.parent ? doc.layer(c.parent) : null;
    let guard = 0;
    while (p && guard++ < 64) {
      if (p.collapsed) return true;
      p = p.parent ? doc.layer(p.parent) : null;
    }
    return false;
  }

  draw() {
    const { doc } = this.editor;
    const current = this.editor.currentLayer;
    this.list.replaceChildren(
      ...[...doc.layers]
        .reverse()
        .filter((c) => !this.folded(c))
        .map((c) => {
          const group = c.kind === 'group';
          const name = el('span', { class: 'name', title: 'Clique duas vezes para abrir as propriedades' }, c.name);
          let mini;
          if (group) {
            mini = el('button', {
              type: 'button',
              class: 'icon-button group-toggle',
              title: c.collapsed ? 'Expandir grupo' : 'Recolher grupo',
              'aria-label': (c.collapsed ? 'Expandir ' : 'Recolher ') + c.name,
              'aria-expanded': String(!c.collapsed),
              onclick: (e) => {
                e.stopPropagation();
                // Collapsing is a view change: it is saved with the project but does not enter the history.
                doc.layer(c.id).collapsed = !c.collapsed;
                this.editor.markModified();
                this.draw();
              },
            }, c.collapsed ? '▸' : '▾');
          } else {
            mini = createCanvas(28, 28);
            mini.className = 'mini';
            mini.dataset.layer = c.id;
          }
          const badges = [];
          if (c.opacity < 100) badges.push(c.opacity + '%');
          if (c.blendMode && c.blendMode !== 'normal') badges.push(BLEND_LABELS[c.blendMode] ?? c.blendMode);
          if (c.reference) badges.push('Ref');
          if (c.kind === 'tilemap') badges.push('Tiles');
          const depth = doc.depth(c.id);
          const item = el(
            'li',
            {
              class: `layer ${group ? 'group' : ''} ${c.kind === 'tilemap' ? 'tilemap' : ''} ${c.reference ? 'reference' : ''} ${c.id === current.id ? 'active' : ''} ${c.visible ? '' : 'hidden-layer'}`,
              tabindex: 0,
              'aria-current': c.id === current.id ? 'true' : null,
              data: { layerId: c.id, depth: String(depth) },
              style: depth ? { paddingLeft: 4 + depth * 14 + 'px' } : undefined,
            },
            el('button', {
              type: 'button',
              class: 'icon-button',
              title: c.visible ? 'Ocultar' : 'Mostrar',
              'aria-label': (c.visible ? 'Ocultar ' : 'Mostrar ') + c.name,
              html: icon(c.visible ? 'eye' : 'eyeClosed', 16),
              onclick: (e) => {
                e.stopPropagation();
                this.action(c.visible ? 'Ocultar camada' : 'Mostrar camada', (d) => {
                  d.layer(c.id).visible = !c.visible;
                });
              },
            }),
            mini,
            name,
            badges.length ? el('span', { class: 'badge' }, badges.join(' · ')) : null,
            el('button', {
              type: 'button',
              class: `icon-button ${c.locked ? 'on' : 'off'}`,
              title: c.locked ? 'Desbloquear' : 'Bloquear',
              'aria-label': (c.locked ? 'Desbloquear ' : 'Bloquear ') + c.name,
              html: icon(c.locked ? 'lock' : 'lockOpen', 16),
              onclick: (e) => {
                e.stopPropagation();
                this.action(c.locked ? 'Desbloquear camada' : 'Bloquear camada', (d) => {
                  d.layer(c.id).locked = !c.locked;
                });
              },
            }),
          );
          item.addEventListener('click', () => this.editor.selectLayer(c.id));
          item.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') this.editor.selectLayer(c.id);
          });
          name.addEventListener('dblclick', () => {
            this.editor.selectLayer(c.id);
            layerPropertiesDialog(this.editor, c.id);
          });
          return item;
        }),
    );
    this.opacity.value = current.opacity;
    this.opacityValue.textContent = current.opacity + '%';
    this.thumbnails();
    this.drawTiles();
  }

  // Tileset of the current tilemap layer: tile mode toggle and the tiles to pick from.
  drawTiles() {
    const { doc, state } = this.editor;
    const layer = this.editor.currentLayer;
    const tileset = layer.kind === 'tilemap' ? doc.tilesets.find((t) => t.id === layer.tileset) : null;
    this.tiles.hidden = !tileset;
    if (!tileset) return this.tiles.replaceChildren();
    const mode = el(
      'button',
      {
        type: 'button',
        class: `button small ${state.tileMode ? 'on' : ''}`,
        'aria-pressed': String(Boolean(state.tileMode)),
        title: 'Modo tile: o lápis coloca o tile escolhido, a borracha põe o tile vazio e o conta-gotas pega o tile',
        onclick: () => this.editor.setState('tileMode', !state.tileMode),
      },
      state.tileMode ? 'Modo tile' : 'Modo pixel',
    );
    const grid = el(
      'div',

    paste(px, layout.width, new Uint32Array(data.data.buffer), canvas.width, canvas.height, layout.positions[i].x, layout.positions[i].y);
  });
  return { layout, canvas: pixelsToCanvas(px, layout.width, layout.height) };
}

// file: an image already chosen (drag and drop); open(doc): where a new document goes (a new tab).
async function importImageDialog(editor, { file = null, open = (d) => editor.load(d) } = {}) {
  file = file ?? (await pickFile('image/png,image/jpeg,image/gif,image/webp,image/bmp'));
  if (!file) return;
  let img;
  try {
    img = await fileToPixels(file);
  } catch (error) {
    notify('Não deu para ler a imagem: ' + error.message, 'error');
    return;
  }
  const detected = scaleDetection(img.pixels, img.width, img.height);
  const dest = selectField('Abrir como', [['project', 'Novo projeto'], ['layer', 'Nova camada no projeto atual'], ['sheet', 'Animação (fatiar como sprite sheet)']], 'project');
  const factor = numberField('Tamanho de cada pixel na imagem', detected, { min: 1, max: 64 });
  const frameWidth = numberField('Largura de cada quadro', Math.min(img.width, 32), { min: 1, max: MAX_SIDE });
  const frameHeight = numberField('Altura de cada quadro', Math.min(img.height, 32), { min: 1, max: MAX_SIDE });
  const sheetBlock = el('div', { class: 'form-grid wide' }, frameWidth.label, frameHeight.label);
  const info = el('p', { class: 'hint wide' });
  const area = el('div', { class: 'preview-area wide' }, preview(pixelsToCanvas(img.pixels, img.width, img.height), 280));
  const update = () => {
    const f = Math.max(1, +factor.input.value || 1);
    sheetBlock.hidden = dest.select.value !== 'sheet';
    const L = Math.floor(img.width / f);
    const A = Math.floor(img.height / f);
    info.textContent = `Imagem: ${img.width} × ${img.height}. ${f > 1 ? `Reduzida ${f}× fica com ${L} × ${A}.` : ''} ${detected > 1 ? `O Crivo detectou blocos de ${detected}×${detected}.` : ''}`;
  };
  for (const i of [dest.select, factor.input]) i.addEventListener('input', update);
  update();
  const error = el('p', { class: 'error', role: 'alert' });
  const r = await openDialog({
    title: `Importar ${file.name}`,
    body: el('div', { class: 'form-grid' }, dest.label, factor.label, sheetBlock, info, area, error),
    actions: [
      { label: 'Cancelar', value: null },
      {
        label: 'Importar',
        primary: true,
        send: true,
        action: () => {
          const f = Math.max(1, Math.round(+factor.input.value) || 1);
          const reduced = downscale(img.pixels, img.width, img.height, f);
          if (reduced.width > MAX_SIDE || reduced.height > MAX_SIDE) {
            error.textContent = `A imagem reduzida ainda passa de ${MAX_SIDE} pixels. Aumente o tamanho do pixel.`;
            return false;
          }
          return { ...reduced, dest: dest.select.value, fw: +frameWidth.input.value, fh: +frameHeight.input.value };
        },
      },
    ],
  });
  if (!r) return;
  const name = file.name.replace(/\.[^.]+$/, '');
  if (r.dest === 'project') {
    const d = new PixelDocument(r.width, r.height, { name });
    d.cell(d.frames[0].id, d.layers[0].id).set(r.pixels);
    open(d);
  } else if (r.dest === 'layer') {
    editor.editStructure('Importar imagem', (d) => {
      const c = d.addLayer(name);
      const destPx = d.cell(editor.currentFrame.id, c.id);
      const L = Math.min(d.width, r.width);
      const A = Math.min(d.height, r.height);
      for (let y = 0; y < A; y++) for (let x = 0; x < L; x++) destPx[y * d.width + x] = r.pixels[y * r.width + x];
      editor.state.layerId = c.id;
    });
    if (r.width > editor.doc.width || r.height > editor.doc.height) notify('A imagem é maior que a matriz e foi cortada. Use Imagem → Tamanho da matriz para ampliar.', 'warning', 5000);
  } else {
    const fw = Math.max(1, Math.min(r.width, r.fw));
    const fh = Math.max(1, Math.min(r.height, r.fh));
    const cols = Math.floor(r.width / fw);
    const rows = Math.floor(r.height / fh);
    const d = new PixelDocument(fw, fh, { name, empty: true });
    const layer = d.addLayer('Camada 1');
    for (let j = 0; j < rows; j++) {
      for (let i = 0; i < cols; i++) {
        const px = crop(r.pixels, r.width, i * fw, j * fh, fw, fh);
        if (!px.some((v) => v >>> 24)) continue;
        const q = d.addFrame();
        d.cell(q.id, layer.id).set(px);
      }
    }
    if (!d.frames.length) d.addFrame();
    open(d);
    notify(`${d.frames.length} quadro(s) importados.`, 'success');
  }
}

async function projectsDialog(editor, storage, open) {
  const list = el('ul', { class: 'project-list' });
  let closeDialog;
  const load = async () => {
    list.replaceChildren(el('li', { class: 'empty' }, 'Carregando...'));
    let projects;
    try {
      projects = await storage.listProjects();
    } catch (error) {
      list.replaceChildren(el('li', { class: 'error' }, error.message));
      return;
    }
    if (!projects.length) {
      list.replaceChildren(el('li', { class: 'empty' }, 'Nenhum projeto salvo ainda. Use Arquivo → Salvar (Ctrl+S).'));
      return;
    }
    list.replaceChildren(
      ...projects.map((p) => {
        const image = p.thumbnail || p.thumbnail_url;
        return el(
          'li',
          { class: 'project' },
          image ? el('img', { src: image, alt: '', width: 56, height: 56 }) : el('div', { class: 'no-thumbnail' }),
          el('div', { class: 'project-info' }, el('strong', {}, p.name), el('span', { class: 'hint' }, `${p.width} × ${p.height} · ${p.frames} quadro(s) · ${p.layers} camada(s) · ${formatDate(p.updated_at)}`)),
          el(
            'div',
            { class: 'row-actions' },
            storage.type === 'server' ? el('button', { type: 'button', class: 'button small', onclick: () => revisionsDialog(editor, storage, p, open).then(() => closeDialog?.(null)) }, 'Versões') : null,
            el(
              'button',
              {
                type: 'button',
                class: 'button small danger',
                onclick: async () => {
                  if (!(await confirm('Excluir projeto', `"${p.name}" será apagado de ${storage.name}.`, 'Excluir', true))) return;
                  await storage.deleteProject(p.id);
                  if (editor.project.id === p.id || editor.project.local === p.id) editor.project = { id: null, local: null, revision: null };
                  load();
                },
              },
              'Excluir',
            ),
            el(
              'button',
              {
                type: 'button',
                class: 'button small primary',
                onclick: async () => {
                  closeDialog?.(null);
                  await open(p.id);
                },
              },
              'Abrir',
            ),
          ),
        );
      }),
    );
  };
  load();
  await openDialog({
    title: `Projetos salvos em ${storage.name}`,
    className: 'wide',
    body: list,
    actions: [{ label: 'Fechar', value: null }],
    onOpen: (_, close) => (closeDialog = close),
  });
