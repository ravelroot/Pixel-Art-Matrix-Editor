const { perguntarTexto, confirmar, abrirDialogo } = modulos["js/ui/dialogo.js"];

function amostra(cor, { titulo, aoClicar, aoDireito, ativa = false, classe = '' } = {}) {
  const b = el('button', {
    type: 'button',
    class: `amostra ${classe} ${ativa ? 'ativa' : ''}`,
    title: titulo ?? corParaHex(cor),
    'aria-label': titulo ?? corParaHex(cor),
    estilo: { '--cor': corParaHex(cor, true) },
  });
  if (aoClicar) b.addEventListener('click', aoClicar);
  if (aoDireito)
    b.addEventListener('contextmenu', (e) => {
      e.preventDefault();
      aoDireito(e);
    });
  return b;
}

function botaoIcone(nome, rotulo, acao, extra = {}) {
  return el('button', { type: 'button', class: 'botao-icone', title: rotulo, 'aria-label': rotulo, html: icone(nome, 16), onclick: acao, ...extra });
}

class PainelCor {
  constructor(raiz, editor) {
    this.editor = editor;
    this.seletor = el('input', { type: 'color', class: 'invisivel', tabindex: -1, 'aria-hidden': 'true' });
    this.alvo = 'primaria';
    this.primaria = el('button', { type: 'button', class: 'cor-grande primaria', title: 'Cor principal (clique esquerdo)', onclick: () => this.abrirSeletor('primaria') });
    this.secundaria = el('button', { type: 'button', class: 'cor-grande secundaria', title: 'Cor secundária (clique direito)', onclick: () => this.abrirSeletor('secundaria') });
    this.hex = el('input', { type: 'text', class: 'hex', maxlength: 9, spellcheck: 'false', 'aria-label': 'Código hexadecimal da cor principal' });
    this.alfa = el('input', { type: 'range', min: 0, max: 255, 'aria-label': 'Opacidade da cor principal' });
    this.alfaValor = el('output', { class: 'mono' });
    this.recentes = el('div', { class: 'amostras recentes', 'aria-label': 'Cores recentes' });
    raiz.append(
      el(
        'div',
        { class: 'cor-linha' },
        el('div', { class: 'cores-par' }, this.secundaria, this.primaria, el('button', { type: 'button', class: 'botao-icone trocar', title: 'Trocar cores (X)', 'aria-label': 'Trocar cores', html: icone('trocar', 14), onclick: () => editor.trocarCores() })),
        el('div', { class: 'cor-campos' }, el('label', { class: 'campo compacto' }, el('span', {}, 'Hex'), this.hex), el('label', { class: 'campo compacto' }, el('span', {}, 'Alfa'), this.alfa, this.alfaValor)),
      ),
      el('div', { class: 'rotulo-pequeno' }, 'Recentes'),
      this.recentes,
      this.seletor,
    );
    this.seletor.addEventListener('input', () => {
      const atual = this.alvo === 'secundaria' ? editor.estado.corSecundaria : editor.estado.corPrimaria;
      editor.definirCor(this.alvo, comAlfa(hexParaCor(this.seletor.value), alfa(atual) || 255));
    });
    this.seletor.addEventListener('change', () => editor.lembrarCor(this.alvo === 'secundaria' ? editor.estado.corSecundaria : editor.estado.corPrimaria));
    this.hex.addEventListener('change', () => {
      const c = hexParaCor(this.hex.value);
      if (c === null) {
        avisar('Use um código como #5d1c16 ou #5d1c16cc.', 'alerta');
        this.atualizar();
        return;
      }
      editor.definirCor('primaria', c);
      editor.lembrarCor(c);
    });
    this.alfa.addEventListener('input', () => editor.definirCor('primaria', comAlfa(editor.estado.corPrimaria, +this.alfa.value)));
    editor.ao('cor', () => this.atualizar());
    editor.ao('recentes', () => this.atualizarRecentes());
    this.atualizar();
    this.atualizarRecentes();
  }

  abrirSeletor(qual) {
    this.alvo = qual;
    const c = qual === 'secundaria' ? this.editor.estado.corSecundaria : this.editor.estado.corPrimaria;
    this.seletor.value = corParaHex6(c);
    this.seletor.click();
  }

  atualizar() {
    const { corPrimaria: p, corSecundaria: s } = this.editor.estado;
    this.primaria.style.setProperty('--cor', corParaHex(p, true));
    this.secundaria.style.setProperty('--cor', corParaHex(s, true));
    this.primaria.setAttribute('aria-label', `Cor principal ${corParaHex(p)}`);
    this.secundaria.setAttribute('aria-label', `Cor secundária ${corParaHex(s)}`);
    if (document.activeElement !== this.hex) this.hex.value = corParaHex(p);
    this.alfa.value = alfa(p);
    this.alfaValor.textContent = Math.round((alfa(p) / 255) * 100) + '%';
  }

  atualizarRecentes() {
    this.recentes.replaceChildren(
      ...this.editor.recentes.map((c) =>
        amostra(c, {
          aoClicar: () => this.editor.definirCor('primaria', c),
          aoDireito: () => this.editor.definirCor('secundaria', c),
        }),
      ),
    );
    if (!this.editor.recentes.length) this.recentes.append(el('span', { class: 'vazio' }, 'As cores usadas aparecem aqui.'));
  }
}

class PainelPaleta {
  constructor(raiz, editor, obterArmazenamento) {
    this.editor = editor;
    this.obterArmazenamento = obterArmazenamento;
    this.minhas = [];
    this.select = el('select', { 'aria-label': 'Paleta' });
    this.grade = el('div', { class: 'amostras paleta' });
    this.info = el('div', { class: 'rotulo-pequeno paleta-info' });
    const acoes = el(
      'div',
      { class: 'acoes-linha' },
      el('button', { type: 'button', class: 'botao pequeno', onclick: () => this.adicionarCorAtual(), title: 'Adicionar a cor principal à paleta' }, '+ Cor'),
      el('button', { type: 'button', class: 'botao pequeno', onclick: () => this.nova() }, 'Nova'),
      el('button', { type: 'button', class: 'botao pequeno', onclick: () => this.doDesenho(), title: 'Cria uma paleta com as cores usadas no projeto' }, 'Do desenho'),
      el('button', { type: 'button', class: 'botao pequeno', onclick: () => this.importar() }, 'Importar'),
      el('button', { type: 'button', class: 'botao pequeno', onclick: () => this.exportar() }, 'Exportar'),
      el('button', { type: 'button', class: 'botao pequeno', onclick: () => this.renomear(), dados: { soMinhas: '1' } }, 'Renomear'),
      el('button', { type: 'button', class: 'botao pequeno perigo', onclick: () => this.excluir(), dados: { soMinhas: '1' } }, 'Excluir'),
    );
    this.acoes = acoes;
    raiz.append(this.select, this.grade, this.info, acoes);
    this.select.addEventListener('change', () => {
      editor.definir('paleta', this.select.value);
      this.desenhar();
    });
    editor.ao('cor', () => this.marcarAtiva());
    this.carregar();
  }

  get todas() {
    return [...PALETAS_PREDEFINIDAS.map((p) => normalizarPaleta({ ...p, id: p.slug, predefinida: true })), ...this.minhas];
  }

  get atual() {
    return this.todas.find((p) => p.id === this.editor.estado.paleta) ?? this.todas[0];
  }

  async carregar() {
    try {
      const lista = await this.obterArmazenamento().listarPaletas();
      this.minhas = lista.map((p) => normalizarPaleta({ ...p, predefinida: false }));
    } catch (erro) {
      avisar('Não foi possível carregar as paletas salvas: ' + erro.message, 'erro');
    }
    this.montarSelect();
    this.desenhar();
  }

  montarSelect() {
    const grupo = (rotulo, lista) => el('optgroup', { label: rotulo }, lista.map((p) => el('option', { value: p.id, selected: p.id === this.atual.id }, `${p.nome} (${p.cores.length})`)));
    this.select.replaceChildren(grupo('Predefinidas', this.todas.filter((p) => p.predefinida)));
    if (this.minhas.length) this.select.append(grupo('Minhas paletas', this.minhas));
    this.select.value = this.atual.id;
  }

  desenhar() {
    const p = this.atual;
    this.grade.replaceChildren(
      ...p.cores.map((c, i) =>
        amostra(c, {
          titulo: `${corParaHex(c)} (${i + 1})${p.predefinida ? '' : ' · Ctrl+clique remove'}`,
          aoClicar: (e) => {
            if ((e.ctrlKey || e.metaKey) && !p.predefinida) return this.removerCor(i);
            this.editor.definirCor('primaria', c);
          },
          aoDireito: () => this.editor.definirCor('secundaria', c),
        }),
      ),
    );
    this.info.textContent = p.descricao || (p.predefinida ? '' : 'Clique esquerdo escolhe a cor principal, direito a secundária. Ctrl+clique remove a cor.');
    for (const b of this.acoes.querySelectorAll('[data-so-minhas]')) b.disabled = p.predefinida;
    this.marcarAtiva();
  }

  marcarAtiva() {
    const p = this.atual;
    const botoes = this.grade.children;
    p.cores.forEach((c, i) => botoes[i]?.classList.toggle('ativa', c === this.editor.estado.corPrimaria));
  }

  async salvar(p) {
    const salvo = await this.obterArmazenamento().salvarPaleta({ id: p.predefinida ? null : p.id, nome: p.nome, cores: p.cores.map((c) => corParaHex(c)) });
    const normal = normalizarPaleta({ ...salvo, predefinida: false });
    const i = this.minhas.findIndex((x) => x.id === normal.id || x.id === p.id);
    if (i >= 0) this.minhas[i] = normal;
    else this.minhas.push(normal);
    this.editor.definir('paleta', normal.id);
    this.montarSelect();
    this.desenhar();
    return normal;
  }

  async garantirEditavel() {
    const p = this.atual;
    if (!p.predefinida) return p;
    const nome = await perguntarTexto('Copiar paleta', 'As paletas predefinidas não mudam. Nome da sua cópia:', `${p.nome} (minha)`);
    if (!nome) return null;
    return this.salvar({ nome, cores: [...p.cores], predefinida: false });
  }

  async adicionarCores(cores) {
    const p = await this.garantirEditavel();
    if (!p) return;
    const novas = cores.filter((c) => !p.cores.includes(c));
    if (!novas.length) {
      avisar('Essas cores já estão na paleta.');
      return;
    }
    await this.salvar({ ...p, cores: [...p.cores, ...novas] });
    avisar(novas.length === 1 ? 'Cor adicionada à paleta.' : `${novas.length} cores adicionadas à paleta.`, 'sucesso');
  }

  adicionarCorAtual() {
    return this.adicionarCores([this.editor.estado.corPrimaria]);
  }

  async removerCor(i) {
    const p = this.atual;
    await this.salvar({ ...p, cores: p.cores.filter((_, k) => k !== i) });
  }

  async nova() {
    const nome = await perguntarTexto('Nova paleta', 'Nome da paleta', 'Minha paleta');
    if (!nome) return;
    await this.salvar({ nome, cores: [this.editor.estado.corPrimaria, this.editor.estado.corSecundaria].filter((c) => c >>> 24), predefinida: false });
    avisar('Paleta criada. Use "+ Cor" ou o gerador de tons para preencher.', 'sucesso');
  }

  async doDesenho() {
    const cores = extrairPaleta(this.editor.doc.quadros.flatMap((_, i) => [...this.editor.doc.compor(i)]), 256);
    if (!cores.length) {
      avisar('O desenho ainda não tem cores.', 'alerta');
      return;
    }
    const nome = await perguntarTexto('Paleta do desenho', `${cores.length} cores encontradas. Nome da paleta:`, `Cores de ${this.editor.doc.nome}`);
    if (!nome) return;
    await this.salvar({ nome, cores, predefinida: false });
  }

  async importar() {
    const arquivo = await escolherArquivo('.hex,.gpl,.json,.txt,.csv');
    if (!arquivo) return;
    try {
      const { nome, cores } = importarPaleta(await arquivo.text(), arquivo.name);
      await this.salvar({ nome, cores, predefinida: false });
      avisar(`Paleta "${nome}" importada com ${cores.length} cores.`, 'sucesso');
    } catch (erro) {
      avisar('Não deu para importar: ' + erro.message, 'erro');
    }
  }

  async exportar() {
    const p = this.atual;
    const select = el('select', {}, el('option', { value: 'hex' }, '.hex (uma cor por linha, Lospec)'), el('option', { value: 'gpl' }, '.gpl (GIMP, Aseprite, Krita)'), el('option', { value: 'json' }, '.json'));
    const formato = await abrirDialogo({
      titulo: `Exportar "${p.nome}"`,
      corpo: el('label', { class: 'campo' }, el('span', {}, 'Formato'), select),
      acoes: [
        { rotulo: 'Cancelar', valor: null },
        { rotulo: 'Baixar', primario: true, enviar: true, acao: () => select.value },
      ],
    });
    if (!formato) return;
    baixarTexto(exportarPaleta(p, formato), nomeDeArquivo(p.nome, formato));
  }

  async renomear() {
    const p = this.atual;
    if (p.predefinida) return;
    const nome = await perguntarTexto('Renomear paleta', 'Novo nome', p.nome);
    if (nome) await this.salvar({ ...p, nome });
  }

  async excluir() {
    const p = this.atual;
    if (p.predefinida) return;
    if (!(await confirmar('Excluir paleta', `A paleta "${p.nome}" será apagada.`, 'Excluir', true))) return;
    await this.obterArmazenamento().excluirPaleta(p.id);
    this.minhas = this.minhas.filter((x) => x.id !== p.id);
    this.editor.definir('paleta', 'crivo');
    this.montarSelect();
    this.desenhar();
  }
}

class PainelTons {
  constructor(raiz, editor, painelPaleta) {
    this.editor = editor;
    this.painelPaleta = painelPaleta;
    const prefs = lerPreferencia('tons', { passos: 3, intensidade: 80, desvio: 18 });
    this.passos = el('input', { type: 'range', min: 1, max: 6, value: prefs.passos, 'aria-label': 'Tons para cada lado' });
    this.intensidade = el('input', { type: 'range', min: 10, max: 100, value: prefs.intensidade, 'aria-label': 'Intensidade' });
    this.desvio = el('input', { type: 'range', min: 0, max: 60, value: prefs.desvio, 'aria-label': 'Desvio de matiz' });
    this.saidas = { passos: el('output', { class: 'mono' }), intensidade: el('output', { class: 'mono' }), desvio: el('output', { class: 'mono' }) };
    this.rampa = el('div', { class: 'amostras rampa' });
    raiz.append(
      this.rampa,
      el('label', { class: 'campo compacto' }, el('span', {}, 'Passos'), this.passos, this.saidas.passos),
      el('label', { class: 'campo compacto' }, el('span', {}, 'Alcance'), this.intensidade, this.saidas.intensidade),
      el('label', { class: 'campo compacto', title: 'Sombras puxam para o azul e luzes para o amarelo, como na pintura de pixel art' }, el('span', {}, 'Matiz'), this.desvio, this.saidas.desvio),
      el('div', { class: 'acoes-linha' }, el('button', { type: 'button', class: 'botao pequeno', onclick: () => this.painelPaleta.adicionarCores(this.cores) }, 'Adicionar à paleta')),
    );
    for (const i of [this.passos, this.intensidade, this.desvio]) {
      i.addEventListener('input', () => {
        gravarPreferencia('tons', { passos: +this.passos.value, intensidade: +this.intensidade.value, desvio: +this.desvio.value });
        this.atualizar();
      });
    }
    editor.ao('cor', ({ qual }) => {
      if (qual !== 'secundaria' && !this.escolhendo) this.atualizar();
    });
    this.atualizar();
  }

  atualizar() {
    const base = this.editor.estado.corPrimaria;
    this.saidas.passos.textContent = this.passos.value;
    this.saidas.intensidade.textContent = this.intensidade.value + '%';
    this.saidas.desvio.textContent = this.desvio.value + '°';
    const { rampa } = gerarTons(base, { passos: +this.passos.value, intensidade: +this.intensidade.value / 100, desvioMatiz: +this.desvio.value });
    this.cores = rampa;
    this.rampa.replaceChildren(
      ...rampa.map((c) =>
        amostra(c, {
          classe: c === base ? 'base' : '',
          aoClicar: () => {
            this.escolhendo = true;
            this.editor.definirCor('primaria', c);
            this.escolhendo = false;
            this.marcar(c);
          },
          aoDireito: () => this.editor.definirCor('secundaria', c),
        }),
      ),
    );
    this.marcar(base);
  }

  marcar(c) {
    [...this.rampa.children].forEach((b, i) => b.classList.toggle('ativa', this.cores[i] === c));
  }
}

class PainelCamadas {
  constructor(raiz, editor) {
    this.editor = editor;
    this.lista = el('ol', { class: 'lista-camadas', 'aria-label': 'Camadas, da mais alta para a mais baixa' });
    this.opacidade = el('input', { type: 'range', min: 0, max: 100, 'aria-label': 'Opacidade da camada' });
    this.opacidadeValor = el('output', { class: 'mono' });
    raiz.append(
      this.lista,
      el('label', { class: 'campo compacto' }, el('span', {}, 'Opacidade'), this.opacidade, this.opacidadeValor),
      el(
        'div',
        { class: 'acoes-linha icones' },
        botaoIcone('mais', 'Nova camada', () => this.acao('Nova camada', (d) => editor.selecionarCamada(d.adicionarCamada(null, d.indiceCamada(editor.camadaAtual.id) + 1).id))),
        botaoIcone('duplicar', 'Duplicar camada', () => this.acao('Duplicar camada', (d) => editor.selecionarCamada(d.duplicarCamada(editor.camadaAtual.id).id))),
        botaoIcone('cima', 'Subir camada', () => this.acao('Subir camada', (d) => d.moverCamada(editor.camadaAtual.id, 1))),
        botaoIcone('baixo', 'Descer camada', () => this.acao('Descer camada', (d) => d.moverCamada(editor.camadaAtual.id, -1))),
        botaoIcone('mesclar', 'Mesclar com a de baixo', () => this.acao('Mesclar camadas', (d) => d.mesclarAbaixo(editor.camadaAtual.id))),
        botaoIcone('lixeira', 'Excluir camada', () => this.excluir()),
      ),
    );
    const salvarOpacidade = atrasar((id, antes, valor) => {
      const camada = editor.doc.camada(id);
      if (!camada) return;
      camada.opacidade = antes;
      editor.estrutura('Opacidade da camada', (d) => {
        d.camada(id).opacidade = valor;
      });
    }, 400);
    this.opacidade.addEventListener('input', () => {
      const c = editor.camadaAtual;
      if (this.opacidadeOriginal === undefined || this.opacidadeId !== c.id) {
        this.opacidadeOriginal = c.opacidade;
        this.opacidadeId = c.id;
      }
      c.opacidade = +this.opacidade.value;
      this.opacidadeValor.textContent = c.opacidade + '%';
      editor.emitir('pixels');
      salvarOpacidade(c.id, this.opacidadeOriginal, c.opacidade);
    });
    this.opacidade.addEventListener('change', () => {
      this.opacidadeOriginal = undefined;
    });
    editor.ao('documento', () => this.desenhar());
    editor.ao('camada', () => this.desenhar());
    editor.ao('quadro', () => this.agendarMiniaturas());
    editor.ao('pixels', ({ miniaturas }) => {
      if (miniaturas) this.agendarMiniaturas();
    });
    this.agendarMiniaturas = atrasar(() => this.miniaturas(), 120);
    this.desenhar();
  }

  acao(rotulo, fn) {
    try {
      this.editor.estrutura(rotulo, fn);
    } catch (erro) {
      avisar(erro.message, 'erro');
    }
  }

  async excluir() {
    const d = this.editor.doc;
    if (d.camadas.length <= 1) {
      avisar('O projeto precisa de pelo menos uma camada.', 'alerta');
      return;
    }
    this.acao('Excluir camada', (doc) => doc.removerCamada(this.editor.camadaAtual.id));
  }

  desenhar() {
    const { doc } = this.editor;
    const atual = this.editor.camadaAtual;
    this.lista.replaceChildren(
      ...[...doc.camadas].reverse().map((c) => {
        const nome = el('span', { class: 'nome', title: 'Clique duas vezes para renomear' }, c.nome);
        const mini = criarCanvas(28, 28);
        mini.className = 'mini';
        mini.dataset.camada = c.id;
        const item = el(
          'li',
          { class: `camada ${c.id === atual.id ? 'ativa' : ''} ${c.visivel ? '' : 'oculta'}`, tabindex: 0, 'aria-current': c.id === atual.id ? 'true' : null },
          el('button', {
            type: 'button',
            class: 'botao-icone',
            title: c.visivel ? 'Ocultar' : 'Mostrar',
            'aria-label': (c.visivel ? 'Ocultar ' : 'Mostrar ') + c.nome,
            html: icone(c.visivel ? 'olho' : 'olhoFechado', 16),
            onclick: (e) => {
              e.stopPropagation();
              this.acao(c.visivel ? 'Ocultar camada' : 'Mostrar camada', (d) => {
                d.camada(c.id).visivel = !c.visivel;
              });
            },
          }),
          mini,
          nome,
          c.opacidade < 100 ? el('span', { class: 'etiqueta' }, c.opacidade + '%') : null,
          el('button', {
            type: 'button',
            class: `botao-icone ${c.bloqueada ? 'ligado' : 'apagado'}`,
            title: c.bloqueada ? 'Desbloquear' : 'Bloquear',
            'aria-label': (c.bloqueada ? 'Desbloquear ' : 'Bloquear ') + c.nome,
            html: icone(c.bloqueada ? 'cadeado' : 'cadeadoAberto', 16),
            onclick: (e) => {
              e.stopPropagation();
              this.acao(c.bloqueada ? 'Desbloquear camada' : 'Bloquear camada', (d) => {
                d.camada(c.id).bloqueada = !c.bloqueada;
              });
            },
          }),
        );
        item.addEventListener('click', () => this.editor.selecionarCamada(c.id));
        item.addEventListener('keydown', (e) => {
          if (e.key === 'Enter') this.editor.selecionarCamada(c.id);
        });
        nome.addEventListener('dblclick', async () => {
          const novo = await perguntarTexto('Renomear camada', 'Nome da camada', c.nome);
          if (novo)
            this.acao('Renomear camada', (d) => {
              d.camada(c.id).nome = novo;
            });
        });
        return item;
      }),
    );
    this.opacidade.value = atual.opacidade;
    this.opacidadeValor.textContent = atual.opacidade + '%';
    this.miniaturas();
  }

  miniaturas() {
    const { doc } = this.editor;
    const q = this.editor.quadroAtual;
    for (const canvas of this.lista.querySelectorAll('canvas.mini')) {
      const id = canvas.dataset.camada;
      if (!doc.camada(id)) continue;
      desenharMiniatura(canvas, doc.celula(q.id, id), doc.largura, doc.altura);
    }
  }
}

function desenharMiniatura(canvas, pixels, largura, altura) {
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  const escala = Math.min(canvas.width / largura, canvas.height / altura);
  const l = largura * escala;
  const a = altura * escala;
  ctx.imageSmoothingEnabled = escala < 1;
  ctx.drawImage(pixelsParaCanvas(pixels, largura, altura), (canvas.width - l) / 2, (canvas.height - a) / 2, l, a);
}

class LinhaDoTempo {
  constructor(raiz, editor) {
    this.editor = editor;
    this.lista = el('ol', { class: 'lista-quadros', 'aria-label': 'Quadros da animação' });
    this.tocar = el('button', { type: 'button', class: 'botao-icone grande', title: 'Tocar animação (Enter)', 'aria-label': 'Tocar animação', onclick: () => (editor.estado.tocando ? editor.parar() : editor.tocar()) });
    this.fps = el('input', { type: 'number', min: 1, max: 60, class: 'fps', 'aria-label': 'Quadros por segundo' });
    this.cebola = el('button', { type: 'button', class: 'botao-icone', title: 'Papel cebola: mostra o quadro anterior (K)', 'aria-label': 'Papel cebola', html: icone('cebola', 16), onclick: () => editor.definir('cebola', !editor.estado.cebola) });
    const acao = (rotulo, fn) => {
      try {
        editor.estrutura(rotulo, fn);
      } catch (erro) {
        avisar(erro.message, 'erro');
      }
    };
    raiz.append(
      el(

        { class: 'tempo-controles' },

            editor.estado.quadro += 1;
          }),
        ),
        botaoIcone('duplicar', 'Duplicar quadro', () =>
          acao('Duplicar quadro', (d) => {
            d.duplicarQuadro(editor.quadroAtual.id);
            editor.estado.quadro += 1;
          }),
        ),
        botaoIcone('esquerda', 'Mover quadro para a esquerda', () =>
          acao('Mover quadro', (d) => {
            if (!d.moverQuadro(editor.quadroAtual.id, -1)) return false;
            editor.estado.quadro -= 1;
          }),
        ),
        botaoIcone('direita', 'Mover quadro para a direita', () =>
          acao('Mover quadro', (d) => {
            if (!d.moverQuadro(editor.quadroAtual.id, 1)) return false;
            editor.estado.quadro += 1;
          }),
        ),
        botaoIcone('lixeira', 'Excluir quadro', () => {
          if (editor.doc.quadros.length <= 1) return avisar('A animação precisa de pelo menos um quadro.', 'alerta');
          acao('Excluir quadro', (d) => d.removerQuadro(editor.quadroAtual.id));
        }),
      ),
      this.lista,
    );
    this.fps.addEventListener('change', () => {
      const v = Math.max(1, Math.min(60, Math.round(+this.fps.value) || 8));
      acao('Velocidade da animação', (d) => {
        d.fps = v;
      });
    });
    editor.ao('documento', () => this.desenhar());
    editor.ao('quadro', () => this.marcar());
    editor.ao('estado', ({ chave }) => {
      if (chave === 'tocando' || chave === 'cebola') this.atualizarBotoes();
    });
    editor.ao('pixels', ({ miniaturas }) => {
      if (miniaturas) this.agendar();
    });
    this.agendar = atrasar(() => this.miniaturas(), 150);
    this.desenhar();
  }

  atualizarBotoes() {
    const tocando = this.editor.estado.tocando;
    this.tocar.innerHTML = icone(tocando ? 'pausar' : 'tocar', 18);
    this.tocar.setAttribute('aria-label', tocando ? 'Pausar' : 'Tocar animação');
    this.tocar.classList.toggle('ligado', tocando);
    this.cebola.classList.toggle('ligado', this.editor.estado.cebola);
    this.cebola.setAttribute('aria-pressed', String(this.editor.estado.cebola));
  }

  desenhar() {
    const { doc } = this.editor;
    this.fps.value = doc.fps;
    this.lista.replaceChildren(
      ...doc.quadros.map((q, i) => {
        const c = criarCanvas(48, 48);
        c.className = 'mini';
        const item = el('li', { class: 'quadro', tabindex: 0, title: `Quadro ${i + 1}` }, c, el('span', { class: 'numero' }, String(i + 1)));
        item.addEventListener('click', () => {
          this.editor.parar();
          this.editor.selecionarQuadro(i);
        });
        item.addEventListener('keydown', (e) => {
          if (e.key === 'Enter') this.editor.selecionarQuadro(i);
        });
        return item;
      }),
    );
    this.marcar();
    this.atualizarBotoes();
    this.miniaturas();
  }

  marcar() {
    [...this.lista.children].forEach((li, i) => {
      const ativo = i === this.editor.estado.quadro;
      li.classList.toggle('ativa', ativo);
      li.setAttribute('aria-current', ativo ? 'true' : 'false');
      if (ativo && this.editor.estado.tocando) li.scrollIntoView({ block: 'nearest', inline: 'nearest' });
    });
  }

  miniaturas() {
    const { doc } = this.editor;
    [...this.lista.querySelectorAll('canvas.mini')].forEach((c, i) => {
      if (i < doc.quadros.length) desenharMiniatura(c, doc.compor(i), doc.largura, doc.altura);
    });
  }
}
return { PainelCor, PainelPaleta, PainelTons, PainelCamadas, desenharMiniatura, LinhaDoTempo };
})();

const API = '/api/v1';

function lerCookie(nome) {
  const m = document.cookie.match(new RegExp('(?:^|; )' + nome + '=([^;]*)'));
  return m ? decodeURIComponent(m[1]) : '';
}

async function pedir(caminho, { metodo = 'GET', corpo, tempo = 15000 } = {}) {
  const controle = new AbortController();
  const t = setTimeout(() => controle.abort(), tempo);
  try {
    const resp = await fetch(API + caminho, {
      method: metodo,
      headers: {
        Accept: 'application/json',
        ...(corpo !== undefined ? { 'Content-Type': 'application/json' } : {}),
        ...(metodo !== 'GET' ? { 'X-CSRFToken': lerCookie('csrftoken') } : {}),
      },
      body: corpo !== undefined ? JSON.stringify(corpo) : undefined,
      credentials: 'same-origin',
      signal: controle.signal,
    });
    if (resp.status === 204) return null;
    const tipo = resp.headers.get('content-type') || '';
    const dados = tipo.includes('application/json') ? await resp.json() : await resp.text();
    if (!resp.ok) {
      const erro = new Error((dados && dados.erro) || `Erro ${resp.status} no servidor.`);
      erro.status = resp.status;
      erro.dados = dados;
      throw erro;
    }
    return dados;
  } finally {
    clearTimeout(t);
  }
}

class ArmazenamentoServidor {

  }

function abrirBanco() {
  return new Promise((resolver, rejeitar) => {
    const req = indexedDB.open('crivo', 1);
    req.onupgradeneeded = () => {
      const db = req.result;
      if (!db.objectStoreNames.contains('projetos')) db.createObjectStore('projetos', { keyPath: 'id' });
      if (!db.objectStoreNames.contains('rascunho')) db.createObjectStore('rascunho');
    };
    req.onsuccess = () => resolver(req.result);
    req.onerror = () => rejeitar(req.error);
  });
}

async function transacao(loja, modo, fn) {
  const db = await abrirBanco();
  return new Promise((resolver, rejeitar) => {
    const tx = db.transaction(loja, modo);
    const req = fn(tx.objectStore(loja));
    tx.oncomplete = () => {
      db.close();
      resolver(req?.result);
    };
    tx.onerror = () => {
      db.close();
      rejeitar(tx.error);
    };
  });
}

class ArmazenamentoLocal {

}

modulos["js/nucleo/gif.js"] = (() => {
// Codificador de GIF animado (GIF89a) sem dependências: paleta global, transparência e compressão LZW.
// A pixel art costuma ter poucas cores, então a paleta é exata; acima de 255 cores, cai num cubo 6×7×6.

const LIMIAR_ALFA = 128;

function paletaGlobal(quadros) {
  const cores = new Map();
  for (const px of quadros) {
    for (let i = 0; i < px.length; i++) {
      const c = px[i];
      if ((c >>> 24) < LIMIAR_ALFA) continue;
      const rgb = c & 0x00ffffff;
      if (!cores.has(rgb)) {
        cores.set(rgb, cores.size + 1);
        if (cores.size > 255) return null;
      }
    }
  }
  return cores;
}

function cubo() {
  const cores = [];
  for (let r = 0; r < 6; r++) for (let g = 0; g < 7; g++) for (let b = 0; b < 6; b++) cores.push(Math.round((r * 255) / 5) | (Math.round((g * 255) / 6) << 8) | (Math.round((b * 255) / 5) << 16));
  return cores;
}

function indiceNoCubo(c) {
  const r = Math.round(((c & 255) * 5) / 255);
  const g = Math.round((((c >>> 8) & 255) * 6) / 255);
  const b = Math.round((((c >>> 16) & 255) * 5) / 255);
  return 1 + r * 42 + g * 6 + b;
}

function lzw(indices, tamanhoMinimo) {
  const limpar = 1 << tamanhoMinimo;
  const fim = limpar + 1;
  let tamanho = tamanhoMinimo + 1;
  let proximo = fim + 1;
  const dicionario = new Map();
  const saida = [];
  let acumulado = 0;
  let bits = 0;
  const escrever = (codigo) => {
    acumulado |= codigo << bits;
    bits += tamanho;
    while (bits >= 8) {
      saida.push(acumulado & 255);
      acumulado >>>= 8;
      bits -= 8;
    }
  };
  escrever(limpar);
  if (!indices.length) {
    escrever(fim);
    if (bits > 0) saida.push(acumulado & 255);
    return Uint8Array.from(saida);
  }
  let prefixo = indices[0];
  for (let i = 1; i < indices.length; i++) {
    const k = indices[i];
    const chave = (prefixo << 8) | k;
    const existente = dicionario.get(chave);
    if (existente !== undefined) {
      prefixo = existente;
      continue;
    }
    escrever(prefixo);
    if (proximo === 4096) {
      escrever(limpar);
      dicionario.clear();
      tamanho = tamanhoMinimo + 1;
      proximo = fim + 1;
    } else {
      if (proximo >= 1 << tamanho) tamanho++;
      dicionario.set(chave, proximo++);
    }
    prefixo = k;
  }
  escrever(prefixo);
  escrever(fim);
  if (bits > 0) saida.push(acumulado & 255);
  return Uint8Array.from(saida);
}

// quadros: lista de Uint32Array (RGBA empacotado, R no byte baixo) do mesmo tamanho.
// atrasos: duração de cada quadro em milissegundos. repetir: 0 = para sempre.
function codificarGIF(quadros, largura, altura, { atrasos = [], repetir = 0 } = {}) {
  if (!quadros.length) throw new Error('Nenhum quadro para exportar.');
  const exata = paletaGlobal(quadros);
  const cores = exata ? [...exata.keys()] : cubo();
  const total = cores.length + 1;
  let bitsPaleta = 1;
  while (1 << bitsPaleta < total) bitsPaleta++;
  const tamanhoPaleta = 1 << bitsPaleta;
  const bytes = [];
  const u16 = (v) => bytes.push(v & 255, (v >> 8) & 255);
  const texto = (s) => {
    for (const ch of s) bytes.push(ch.charCodeAt(0));
  };
  texto('GIF89a');
  u16(largura);
  u16(altura);
  bytes.push(0x80 | ((bitsPaleta - 1) << 4) | (bitsPaleta - 1), 0, 0);
  bytes.push(0, 0, 0);
  for (const c of cores) bytes.push(c & 255, (c >>> 8) & 255, (c >>> 16) & 255);
  for (let i = total; i < tamanhoPaleta; i++) bytes.push(0, 0, 0);
  if (quadros.length > 1) {
    bytes.push(0x21, 0xff, 0x0b);
    texto('NETSCAPE2.0');
    bytes.push(0x03, 0x01);
    u16(repetir);
    bytes.push(0x00);
  }
  const tamanhoMinimo = Math.max(2, bitsPaleta);
  quadros.forEach((px, q) => {
    const centesimos = Math.max(2, Math.round((atrasos[q] ?? 100) / 10));
    bytes.push(0x21, 0xf9, 0x04, (2 << 2) | 1);
    u16(centesimos);
    bytes.push(0, 0);
    bytes.push(0x2c);
    u16(0);
    u16(0);
    u16(largura);
    u16(altura);
    bytes.push(0);
    const indices = new Uint8Array(px.length);
    for (let i = 0; i < px.length; i++) {
      const c = px[i];
      if ((c >>> 24) < LIMIAR_ALFA) continue;
      indices[i] = exata ? exata.get(c & 0x00ffffff) : indiceNoCubo(c);
    }
    bytes.push(tamanhoMinimo);
    const dados = lzw(indices, tamanhoMinimo);
    for (let i = 0; i < dados.length; i += 255) {
      const bloco = dados.subarray(i, i + 255);
      bytes.push(bloco.length, ...bloco);
    }
    bytes.push(0);
  });
  bytes.push(0x3b);
  return Uint8Array.from(bytes);
}
return { lzw, codificarGIF };
})();

        title: nomes[i],
        'aria-label': nomes[i],
        onclick: () => {
          ancora = [(i % 3) / 2, Math.floor(i / 3) / 2];
          marcar();
        },
      }),
    );
  }
  marcar();
  const blocoAncora = el('div', { class: 'campo' }, el('span', {}, 'Âncora (centralizar ou expandir para um lado)'), grade);
  modo.select.addEventListener('change', () => (blocoAncora.hidden = modo.select.value === 'escalar'));
  const erro = el('p', { class: 'erro', role: 'alert' });
  const r = await abrirDialogo({
    titulo: 'Tamanho da matriz',
    corpo: el('div', { class: 'grade-form' }, el('p', { class: 'largo dica' }, `Agora: ${doc.largura} × ${doc.altura} pixels.`), l.rotulo, a.rotulo, presetsTamanho(l.input, a.input), modo.rotulo, blocoAncora, erro),
    acoes: [
      { rotulo: 'Cancelar', valor: null },
      {
        rotulo: 'Aplicar',
        primario: true,
        enviar: true,
        acao: () => {
          try {
            return { L: lerLado(l.input), A: lerLado(a.input), modo: modo.select.value };
          } catch (e) {
            erro.textContent = e.message;
            return false;
          }
        },
      },
    ],
  });
  if (!r) return;
  if (r.L === doc.largura && r.A === doc.altura) return;
  editor.estrutura(r.modo === 'escalar' ? 'Escalar desenho' : 'Tamanho da matriz', (d) => {
    if (r.modo === 'escalar') d.escalar(r.L, r.A);
    else d.redimensionar(r.L, r.A, ancora[0], ancora[1]);
  });
  editor.emitir('documento', { novo: true });
}

function previa(canvas, maximo = 320) {
  const c = el('canvas', { class: 'previa-exportacao' });
  const lado = Math.max(canvas.width, canvas.height);
  const escala = lado <= maximo ? Math.max(1, Math.min(8, Math.floor(maximo / lado))) : maximo / lado;
  c.width = Math.max(1, Math.round(canvas.width * escala));
  c.height = Math.max(1, Math.round(canvas.height * escala));
  const ctx = c.getContext('2d');
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(canvas, 0, 0, c.width, c.height);
  return c;
}

          if (formato.select.value === 'gif') {
            if (doc.largura * s > 4096 || doc.altura * s > 4096) {
              avisar('O GIF pode ter no máximo 4096 pixels de lado. Diminua a escala.', 'alerta');
              return false;
            }
            const quadros = doc.quadros.map((_, i) => escalarVizinho(doc.compor(i), doc.largura, doc.altura, s));
            const atrasos = doc.quadros.map((q) => q.duracao || 1000 / doc.fps);
            const gif = codificarGIF(quadros, doc.largura * s, doc.altura * s, { atrasos });
            baixarBlob(new Blob([gif], { type: 'image/gif' }), nomeDeArquivo(doc.nome + (s > 1 ? `-x${s}` : ''), 'gif'));
            return true;

          const jpeg = formato.select.value === 'jpeg';
          let px = doc.compor(+quadro.select.value);
          if (jpeg) px = achatarFundo(px, hexParaCor(fundo.value));

          const sufixo = doc.quadros.length > 1 ? `-q${+quadro.select.value + 1}` : '';
          baixarBlob(blob, nomeDeArquivo(doc.nome + sufixo + (s > 1 ? `-x${s}` : ''), jpeg ? 'jpg' : 'png'));
          return true;
        },
      },
    ],
  });
}

function montarFolha(doc, opcoes) {
  const s = opcoes.escala;
  const layout = layoutFolha(doc.quadros.length, doc.largura * s, doc.altura * s, opcoes);
  const px = new Uint32Array(layout.largura * layout.altura);
  doc.quadros.forEach((_, i) => {
    const canvas = pixelsParaCanvas(doc.compor(i), doc.largura, doc.altura, s);
    const dados = canvas.getContext('2d').getImageData(0, 0, canvas.width, canvas.height);
    colar(px, layout.largura, new Uint32Array(dados.data.buffer), canvas.width, canvas.height, layout.posicoes[i].x, layout.posicoes[i].y);
  });
  return { layout, canvas: pixelsParaCanvas(px, layout.largura, layout.altura) };
}

async function dialogoImportarImagem(editor) {
  const arquivo = await escolherArquivo('image/png,image/jpeg,image/gif,image/webp,image/bmp');
  if (!arquivo) return;
  let img;
  try {
    img = await arquivoParaPixels(arquivo);
  } catch (erro) {
    avisar('Não deu para ler a imagem: ' + erro.message, 'erro');
    return;
  }
  const detectado = deteccaoDeEscala(img.pixels, img.largura, img.altura);
  const destino = campoSelecao('Abrir como', [['projeto', 'Novo projeto'], ['camada', 'Nova camada no projeto atual'], ['folha', 'Animação (fatiar como sprite sheet)']], 'projeto');
  const fator = campoNumero('Tamanho de cada pixel na imagem', detectado, { min: 1, max: 64 });
  const quadroL = campoNumero('Largura de cada quadro', Math.min(img.largura, 32), { min: 1, max: LIMITE_LADO });
  const quadroA = campoNumero('Altura de cada quadro', Math.min(img.altura, 32), { min: 1, max: LIMITE_LADO });
  const blocoFolha = el('div', { class: 'grade-form largo' }, quadroL.rotulo, quadroA.rotulo);
  const info = el('p', { class: 'dica largo' });
  const area = el('div', { class: 'area-previa largo' }, previa(pixelsParaCanvas(img.pixels, img.largura, img.altura), 280));
  const atualizar = () => {
    const f = Math.max(1, +fator.input.value || 1);
    blocoFolha.hidden = destino.select.value !== 'folha';
    const L = Math.floor(img.largura / f);
    const A = Math.floor(img.altura / f);
    info.textContent = `Imagem: ${img.largura} × ${img.altura}. ${f > 1 ? `Reduzida ${f}× fica com ${L} × ${A}.` : ''} ${detectado > 1 ? `O Crivo detectou blocos de ${detectado}×${detectado}.` : ''}`;
  };
  for (const i of [destino.select, fator.input]) i.addEventListener('input', atualizar);
  atualizar();
  const erro = el('p', { class: 'erro', role: 'alert' });
  const r = await abrirDialogo({
    titulo: `Importar ${arquivo.name}`,
    corpo: el('div', { class: 'grade-form' }, destino.rotulo, fator.rotulo, blocoFolha, info, area, erro),
    acoes: [
      { rotulo: 'Cancelar', valor: null },
      {
        rotulo: 'Importar',
        primario: true,
        enviar: true,
        acao: () => {
          const f = Math.max(1, Math.round(+fator.input.value) || 1);
          const red = reduzir(img.pixels, img.largura, img.altura, f);
          if (red.largura > LIMITE_LADO || red.altura > LIMITE_LADO) {
            erro.textContent = `A imagem reduzida ainda passa de ${LIMITE_LADO} pixels. Aumente o tamanho do pixel.`;
            return false;
          }
          return { ...red, destino: destino.select.value, ql: +quadroL.input.value, qa: +quadroA.input.value };
        },
      },
    ],
  });
  if (!r) return;
  const nome = arquivo.name.replace(/\.[^.]+$/, '');
  if (r.destino === 'projeto') {
    const d = new Documento(r.largura, r.altura, { nome });
    d.celula(d.quadros[0].id, d.camadas[0].id).set(r.pixels);
    editor.carregar(d);
  } else if (r.destino === 'camada') {
    editor.estrutura('Importar imagem', (d) => {
      const c = d.adicionarCamada(nome);
      const destinoPx = d.celula(editor.quadroAtual.id, c.id);
      const L = Math.min(d.largura, r.largura);
      const A = Math.min(d.altura, r.altura);
      for (let y = 0; y < A; y++) for (let x = 0; x < L; x++) destinoPx[y * d.largura + x] = r.pixels[y * r.largura + x];
      editor.estado.camadaId = c.id;
    });
    if (r.largura > editor.doc.largura || r.altura > editor.doc.altura) avisar('A imagem é maior que a matriz e foi cortada. Use Imagem → Tamanho da matriz para ampliar.', 'alerta', 5000);
  } else {
    const ql = Math.max(1, Math.min(r.largura, r.ql));
    const qa = Math.max(1, Math.min(r.altura, r.qa));
    const cols = Math.floor(r.largura / ql);
    const lins = Math.floor(r.altura / qa);
    const d = new Documento(ql, qa, { nome, vazio: true });
    const camada = d.adicionarCamada('Camada 1');
    for (let j = 0; j < lins; j++) {
      for (let i = 0; i < cols; i++) {
        const px = recortar(r.pixels, r.largura, i * ql, j * qa, ql, qa);
        if (!px.some((v) => v >>> 24)) continue;
        const q = d.adicionarQuadro();
        d.celula(q.id, camada.id).set(px);
      }
    }
    if (!d.quadros.length) d.adicionarQuadro();
    editor.carregar(d);
    avisar(`${d.quadros.length} quadro(s) importados.`, 'sucesso');
  }
}

            el(

                  await armazenamento.excluirProjeto(p.id);

function montarFerramentas() {
  const barra = $('#ferramentas');
  barra.replaceChildren(

  const marcar = () => {
    for (const b of barra.children) {

      b.setAttribute('aria-pressed', String(ativo));

      montarOpcoes();

      // Mudança feita por atalho ou por código: redesenha a barra para mostrar o valor atual.

function montarOpcoes() {
  const barra = $('#opcoes');
  const f = FERRAMENTAS.find((x) => x.id === editor.estado.ferramenta);

  for (const op of f.opcoes) {

      const r = el('input', { type: 'range', min: 1, max: 32, value: editor.estado.tamanho, 'aria-label': 'Tamanho do pincel' });
      const o = el('output', { class: 'mono' }, `${editor.estado.tamanho}px`);
      r.addEventListener('input', () => {
        editor.definir('tamanho', +r.value);
        o.textContent = `${r.value}px`;
      });
      itens.push(grupoOpcao('Tamanho', r, o));
    } else if (op === 'forma') {
      itens.push(grupoOpcao('Ponta', selectEstado('forma', [['quadrado', 'Quadrada'], ['circulo', 'Redonda']], 'Formato da ponta')));
    } else if (op === 'modoBorracha') {
      itens.push(grupoOpcao('Apaga para', selectEstado('modoBorracha', [['transparente', 'Transparente'], ['fundo', 'Cor secundária']], 'Modo da borracha')));

      itens.push(grupoOpcao('Vizinhos', selectEstado('conectividade', [[4, '4 (lados)'], [8, '8 (com diagonais)']], 'Conectividade')));

      const r = el('input', { type: 'range', min: 0, max: 100, value: editor.estado.tolerancia, 'aria-label': 'Tolerância' });
      const o = el('output', { class: 'mono' }, `${editor.estado.tolerancia}%`);

        editor.definir('tolerancia', +r.value);
        o.textContent = `${r.value}%`;
      });
      itens.push(grupoOpcao('Tolerância', r, o));
    } else if (op === 'contiguo') {
      const c = el('input', { type: 'checkbox', checked: editor.estado.contiguo });
      c.addEventListener('change', () => editor.definir('contiguo', c.checked));
      itens.push(el('label', { class: 'opcao' }, c, el('span', {}, 'Só a área contígua')));
    } else if (op === 'amostra') {
      itens.push(grupoOpcao('Ler de', selectEstado('amostra', [['camada', 'Camada atual'], ['todas', 'Todas as camadas']], 'Amostragem')));

      itens.push(el('label', { class: 'opcao', title: 'Remove os cantos em L dos traços de 1 px' }, c, el('span', {}, 'Pixel perfect')));
    } else if (op === 'densidade') {
      itens.push(grupoOpcao('Densidade', selectEstado('densidade', [[12.5, '12,5%'], [25, '25%'], [37.5, '37,5%'], [50, '50% (xadrez)'], [62.5, '62,5%'], [75, '75%'], [87.5, '87,5%']], 'Densidade do pontilhado')));
    } else if (op === 'fundoPontilhado') {

      itens.push(grupoOpcao('Tipo', selectEstado('tipoDegrade', [['linear', 'Linear'], ['radial', 'Radial']], 'Tipo de degradê')));

    } else if (op === 'modoSombra') {

      menu.replaceChildren(
        ...itens.map((id) => {
          if (id === '-') return el('hr');
          const c = COMANDOS[id];
          const marcado = c.marcado ? c.marcado() : null;
          return el(
            'button',
            {
              type: 'button',
              role: marcado === null ? 'menuitem' : 'menuitemcheckbox',
              'aria-checked': marcado === null ? null : String(marcado),
              class: 'menu-item',
              onclick: () => {
                fechar();
                executar(id);
              },
            },
            el('span', { class: 'marca' }, marcado ? '✓' : ''),
            el('span', {}, c.rotulo),
            el('kbd', {}, c.atalho),
          );
        }),
      );
    botao.addEventListener('click', (e) => {
      e.stopPropagation();
      const mesmo = aberto?.menu === menu;
      fechar();
      if (mesmo) return;
      preencher();
      menu.hidden = false;
      botao.setAttribute('aria-expanded', 'true');
      aberto = { menu, botao };
      menu.querySelector('.menu-item')?.focus();
    });
    botao.addEventListener('mouseenter', () => {
      if (aberto && aberto.menu !== menu) botao.click();
    });
    menu.addEventListener('keydown', (e) => {
      const itensFoco = [...menu.querySelectorAll('.menu-item')];
      const i = itensFoco.indexOf(document.activeElement);
      if (e.key === 'ArrowDown') itensFoco[(i + 1) % itensFoco.length].focus();
      else if (e.key === 'ArrowUp') itensFoco[(i - 1 + itensFoco.length) % itensFoco.length].focus();
      else if (e.key === 'Escape') {
        fechar();
        botao.focus();
      } else return;
      e.preventDefault();
    });
    barra.append(el('div', { class: 'menu-grupo' }, botao, menu));
  }
  document.addEventListener('click', fechar);
}

function espelharCamada(eixo) {
  if (!editor.podeEditarCamada()) return;
  const rotulo = eixo === 'horizontal' ? 'Espelhar na horizontal' : 'Espelhar na vertical';
  const r = editor.selecaoRecortada;
  if (r) {
    const d = editor.doc;
    const px = editor.celulaAtiva();
    const mudancas = [];
    for (let y = 0; y < r.altura; y++) {
      for (let x = 0; x < r.largura; x++) {
        const sx = eixo === 'horizontal' ? r.largura - 1 - x : x;
        const sy = eixo === 'vertical' ? r.altura - 1 - y : y;
        mudancas.push([(r.y + y) * d.largura + r.x + x, px[(r.y + sy) * d.largura + r.x + sx]]);
      }
    }
    editor.aplicarMudancas(rotulo, mudancas);
    return;
  }
  editor.estrutura(rotulo, (d) => d.espelharCelula(editor.celulaAtiva(), eixo));
}

// Troca a cor primária exata pela secundária na camada atual, em todos os quadros (respeita a seleção).
function substituirCor() {
  if (!editor.podeEditarCamada()) return;
  const { corPrimaria: de, corSecundaria: para } = editor.estado;
  if (de === para) {
    avisar('A cor primária e a secundária são iguais.', 'info');
    return;
  }
  const camada = editor.camadaAtual;
  const sel = editor.selecao;
  let total = 0;
  editor.estrutura('Substituir cor', (d) => {
    for (const q of d.quadros) {
      if (!d.temCelula(q.id, camada.id)) continue;
      const px = d.celula(q.id, camada.id);
      for (let i = 0; i < px.length; i++) {
        if (px[i] !== de) continue;
        if (sel && !contem(sel, i % d.largura, (i / d.largura) | 0)) continue;
        px[i] = para;
        total++;
      }
    }
    return total > 0;
  });
  avisar(total ? `${total} pixel(s) trocados em ${camada.nome}.` : 'A cor primária não aparece nesta camada.', total ? 'sucesso' : 'info');
}

function girar(sentido) {
  editor.estrutura(sentido > 0 ? 'Girar à direita' : 'Girar à esquerda', (d) => d.girar(sentido));
  visor.ajustar();
}

// Filtros de cor e contorno: atuam na célula atual e, se houver seleção, só dentro dela.
function filtrar(rotulo, fn) {
  if (!editor.podeEditarCamada()) return;
  const d = editor.doc;
  const sel = editor.selecao;
  const filtro = sel ? (i) => contem(sel, i % d.largura, (i / d.largura) | 0) : null;
  editor.aplicarMudancas(rotulo, fn(editor.celulaAtiva(), d, filtro));
}

function copiar(recortar) {
  const d = editor.doc;
  const area = editor.selecaoRecortada ?? { x: 0, y: 0, largura: d.largura, altura: d.altura };
  editor.areaTransferencia = extrairRegiao(editor.celulaAtiva(), d.largura, area);
  editor.areaTransferencia.origem = { x: area.x, y: area.y };
  if (recortar) {
    if (!editor.podeEditarCamada()) return;
    editor.aplicarMudancas('Recortar', [...indicesDe(area, d.largura, d.altura)].map((i) => [i, 0]));
  } else {
    avisar(`Copiado: ${area.largura} × ${area.altura} px`, 'info', 1200);
  }
}

function colar() {
  const regiao = editor.areaTransferencia;
  if (!regiao) {
    avisar('Nada para colar. Selecione uma área e use Ctrl+C.', 'info');
    return;
  }
  if (!editor.podeEditarCamada()) return;
  const d = editor.doc;
  const destino = editor.selecao ?? regiao.origem ?? { x: 0, y: 0 };
  const x = Math.min(Math.max(0, destino.x), Math.max(0, d.largura - regiao.largura));
  const y = Math.min(Math.max(0, destino.y), Math.max(0, d.altura - regiao.altura));
  const mudancas = [];
  colarRegiao(regiao, d.largura, d.altura, x, y, (i, c) => mudancas.push([i, c]), { somenteOpacos: true });
  const fundo = editor.celulaAtiva().slice();
  editor.aplicarMudancas('Colar', mudancas, { silencioso: true });
  editor.definirSelecao({ x, y, largura: regiao.largura, altura: regiao.altura });
  // A colagem fica "flutuando" sobre o fundo: Mover pixels (V) leva só ela, sem arrastar nem furar o que está embaixo.
  editor.flutuante = { chave: editor.chaveAtiva, regiao, fundo, x, y, versao: editor.historico.versao };
  editor.definir('ferramenta', 'moverPixels');
}

function recortarParaSelecao() {
  const r = editor.selecaoRecortada;
  if (!r) {
    avisar('Faça uma seleção primeiro (ferramenta S).', 'info');
    return;
  }
  editor.estrutura('Recortar para a seleção', (d) => d.recortar(r.x, r.y, r.largura, r.altura));
  editor.definirSelecao(null);
  visor.ajustar();
}

function aparar() {
  const d = editor.doc;
  const r = limitesDoConteudo(d.celulas.values(), d.largura, d.altura);
  if (!r) {
    avisar('O projeto está vazio: nada para aparar.', 'info');
    return;
  }
  if (r.largura === d.largura && r.altura === d.altura) {
    avisar('Não há bordas transparentes para aparar.', 'info');
    return;
  }
  editor.estrutura('Aparar bordas', (doc) => doc.recortar(r.x, r.y, r.largura, r.altura));
  editor.definirSelecao(null);
  visor.ajustar();
  avisar(`Aparado para ${r.largura} × ${r.altura}.`, 'sucesso');
}

function deslocarMetade() {
  if (!editor.podeEditarCamada()) return;
  const d = editor.doc;
  const novo = deslocarComRepeticao(editor.celulaAtiva(), d.largura, d.altura, Math.floor(d.largura / 2), Math.floor(d.altura / 2));
  editor.aplicarMudancas('Deslocar meia matriz', [...novo].map((c, i) => [i, c]));
}

function alternarTema() {
  const atual = document.documentElement.dataset.tema;
  const novo = atual === 'escuro' ? 'claro' : 'escuro';
  gravarPreferencia('tema', novo);
  aplicarTema(novo);
}

function dadosDoProjeto() {
  const doc = editor.doc;
  doc.paleta = paleta.atual.cores.slice(0, 256);
  return {
    nome: doc.nome,
    dados: serializar(doc),
    miniatura: miniatura(doc.compor(0), doc.largura, doc.altura, 128),
  };
}

async function salvar(copia = false) {
  const base = dadosDoProjeto();
  try {
    if (armazenamento.tipo === 'servidor') {
      let r;
      const id = copia ? null : editor.projeto.id;
      try {
        r = await armazenamento.salvarProjeto({ ...base, id, revisao: editor.projeto.revisao });
      } catch (erro) {
        if (erro.status !== 409) throw erro;
        const sobrescrever = await confirmar('Projeto alterado em outro lugar', 'Este projeto foi salvo por outra aba ou pessoa depois que você o abriu. Salvar por cima mesmo assim? A outra versão continua no histórico de versões.', 'Salvar por cima');
        if (!sobrescrever) return;
        r = await armazenamento.salvarProjeto({ ...base, id, revisao: null });
      }
      editor.marcarSalvo({ id: r.id, revisao: r.revisao, local: null });
    } else {
      const r = await armazenamento.salvarProjeto({ ...base, id: copia ? null : editor.projeto.local });
      editor.marcarSalvo({ local: r.id, id: null, revisao: null });
    }
    avisar(`"${editor.doc.nome}" salvo em ${armazenamento.nome}.`, 'sucesso');
  } catch (erro) {
    avisar('Não foi possível salvar: ' + erro.message, 'erro', 6000);
  }
}

async function abrirProjeto(id) {
  if (editor.modificado && !(await confirmar('Abrir outro projeto', 'As mudanças não salvas deste projeto serão perdidas.', 'Abrir mesmo assim', true))) return;
  try {
    const p = await armazenamento.abrirProjeto(id);
    const doc = desserializar(p.dados);
    editor.carregar(doc, armazenamento.tipo === 'servidor' ? { id: p.id, revisao: p.revisao, local: null } : { id: null, revisao: null, local: p.id });
    avisar(`"${doc.nome}" aberto.`, 'sucesso');
  } catch (erro) {
    avisar('Não foi possível abrir: ' + erro.message, 'erro', 6000);
  }
}

async function abrirArquivo() {
  const arquivo = await escolherArquivo('.crivo,.json,application/json');
  if (!arquivo) return;
  if (editor.modificado && !(await confirmar('Abrir arquivo', 'As mudanças não salvas deste projeto serão perdidas.', 'Abrir mesmo assim', true))) return;
  try {
    const doc = desserializar(await arquivo.text());
    editor.carregar(doc);
    avisar(`"${doc.nome}" aberto.`, 'sucesso');
  } catch (erro) {
    avisar('Arquivo inválido: ' + erro.message, 'erro', 6000);
  }
}

function baixarCrivo() {
  const { dados } = dadosDoProjeto();
  baixarTexto(JSON.stringify(dados), nomeDeArquivo(editor.doc.nome, 'crivo'), 'application/json');
}

function montarNome() {
  const input = $('#nome-projeto');
  const atualizar = () => {
    if (document.activeElement !== input) input.value = editor.doc.nome;
    document.title = `${editor.modificado ? '• ' : ''}${editor.doc.nome} · Crivo`;
  };
  input.addEventListener('change', () => {
    const v = input.value.trim().slice(0, 120) || 'Sem título';
    if (v === editor.doc.nome) return;
    editor.estrutura('Renomear projeto', (d) => {
      d.nome = v;
    });
  });
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') input.blur();
  });
  editor.ao('documento', atualizar);
  editor.ao('historico', atualizar);
  atualizar();
}

function montarHistorico() {
  const desfazer = $('#desfazer');
  const refazer = $('#refazer');
  desfazer.innerHTML = icone('desfazer', 18);
  refazer.innerHTML = icone('refazer', 18);
  desfazer.addEventListener('click', () => editor.desfazer());
  refazer.addEventListener('click', () => editor.refazer());
  const atualizar = () => {
    const h = editor.historico;
    desfazer.disabled = !h.podeDesfazer;
    refazer.disabled = !h.podeRefazer;
    desfazer.title = h.podeDesfazer ? `Desfazer: ${h.proximoDesfazer} (Ctrl+Z)` : 'Nada para desfazer';
    refazer.title = h.podeRefazer ? `Refazer: ${h.proximoRefazer} (Ctrl+Y)` : 'Nada para refazer';
    desfazer.setAttribute('aria-label', desfazer.title);
    refazer.setAttribute('aria-label', refazer.title);
    $('#status-historico').textContent = `Histórico: ${h.passado.length} ${h.passado.length === 1 ? 'ação' : 'ações'} · ${formatarBytes(h.bytes)}`;
  };
  editor.ao('historico', atualizar);
  atualizar();
  $('#salvar').innerHTML = icone('disco', 18);
  $('#salvar').addEventListener('click', () => salvar());
}

function montarStatus() {
  const pos = $('#status-posicao');
  const cor = $('#status-cor');
  const tam = $('#status-tamanho');
  const zoom = $('#status-zoom');
  const sel = $('#status-selecao');
  editor.ao('ponteiro', (p) => {
    if (!p) {
      pos.textContent = '–';
      cor.textContent = '';
      cor.style.removeProperty('--cor');
      return;
    }
    pos.textContent = `${p.x}, ${p.y}`;
    const c = editor.doc.compor(editor.estado.quadro)[p.y * editor.doc.largura + p.x];
    cor.textContent = c >>> 24 ? corParaHex(c) : 'transparente';
    cor.style.setProperty('--cor', corParaHex(c, true));
  });
  editor.ao('forma', ({ largura, altura }) => (pos.textContent = `${largura} × ${altura}`));
  editor.ao('deslocamento', ({ dx, dy }) => (pos.textContent = `Δ ${dx}, ${dy}`));
  editor.ao('selecao', (r) => {
    sel.textContent = r?.largura ? `Seleção: ${r.largura} × ${r.altura} em ${r.x}, ${r.y}` : '';
  });
  const tamanho = () => (tam.textContent = `${editor.doc.largura} × ${editor.doc.altura} · ${editor.doc.quadros.length} quadro(s) · ${editor.doc.camadas.length} camada(s)`);
  editor.ao('documento', tamanho);
  editor.ao('zoom', ({ zoom: z }) => (zoom.textContent = `${z * 100}%`));
  editor.ao('amostra', ({ cor: c }) => {
    if (!c) avisar('Esse pixel está transparente.', 'info', 1200);
  });
  tamanho();
}

function atualizarArmazenamento() {
  const s = $('#status-armazenamento');
  const servidor = armazenamento.tipo === 'servidor';
  s.replaceChildren(el('span', { class: 'icone-rotulo', html: icone(servidor ? 'nuvem' : 'pasta', 14) }), servidor ? ' Servidor Django' : DESKTOP ? ' Desktop (este computador)' : ' Modo local (navegador)');
  s.title = servidor
    ? 'Projetos e paletas salvos no banco de dados do servidor'
    : DESKTOP
      ? 'App desktop: projetos e paletas guardados neste computador, na pasta do Crivo em AppData'
      : 'Sem servidor: projetos ficam no IndexedDB deste navegador';
}

function atalhos(e) {
  const alvo = e.target;
  if (e.defaultPrevented) return;
  if (alvo instanceof HTMLElement && (alvo.isContentEditable || ['INPUT', 'TEXTAREA', 'SELECT'].includes(alvo.tagName) || alvo.closest('.menu'))) return;
  if (document.querySelector('dialog[open]')) return;
  // Com o botão do mouse ainda pressionado (traço, forma, seleção ou arraste em andamento), só o Esc vale:
  // qualquer outro comando mexeria no documento no meio do gesto e embaralharia o histórico.
  if (controlador.ativo) {
    if (e.key === 'Escape') {
      controlador.cancelar();
      e.preventDefault();
    }
    return;
  }
  const ctrl = e.ctrlKey || e.metaKey;
  const k = e.key.toLowerCase();
  if (ctrl) {
    if (k === 'z' && !e.shiftKey) executar('desfazer');
    else if (k === 'y' || (k === 'z' && e.shiftKey)) executar('refazer');
    else if (k === 's') executar('salvar');
    else if (k === 'o') executar('abrirArquivo');
    else if (k === 'e') executar(e.shiftKey ? 'exportarDados' : 'exportarImagem');
    else if (k === 'c' && e.altKey) executar('tamanho');
    else if (k === 'g' && e.shiftKey) executar('exportarGif');
    else if (k === 'a') executar('selecionarTudo');
    else if (k === 'd') executar('desmarcar');
    else if (k === 'c') executar('copiar');
    else if (k === 'x') executar('recortar');
    else if (k === 'v') executar('colar');
    else return;
    e.preventDefault();
    return;
  }
  if (e.altKey) return;
  if (k.startsWith('arrow') && editor.estado.ferramenta === 'moverPixels') {
    const passo = e.shiftKey ? 8 : 1;
    const [dx, dy] = { arrowleft: [-passo, 0], arrowright: [passo, 0], arrowup: [0, -passo], arrowdown: [0, passo] }[k];
    controlador.empurrar(dx, dy);
    e.preventDefault();
    return;
  }
  if (k === 't') {
    executar(e.shiftKey ? 'deslocarMetade' : 'ladrilho');
    e.preventDefault();
    return;
  }
  if (e.shiftKey && (k === 'h' || k === 'v')) {
    executar(k === 'h' ? 'espelharH' : 'espelharV');
    e.preventDefault();
    return;
  }
  const ferramenta = FERRAMENTAS.find((f) => f.atalho.toLowerCase() === k);
  if (ferramenta) editor.definir('ferramenta', ferramenta.id);
  else if (k === 'x') editor.trocarCores();
  else if (k === 'g') executar('grade');
  else if (k === 'k') executar('cebola');
  else if (k === 'm') {
    const modos = ['nenhuma', 'horizontal', 'vertical', 'ambas'];
    const novo = modos[(modos.indexOf(editor.estado.simetria) + 1) % modos.length];
    editor.definir('simetria', novo);
    avisar(`Simetria: ${{ nenhuma: 'desligada', horizontal: 'horizontal', vertical: 'vertical', ambas: 'horizontal e vertical' }[novo]}`, 'info', 1000);
  } else if (k === '[' || k === ']') {
    editor.definir('tamanho', Math.max(1, Math.min(32, editor.estado.tamanho + (k === ']' ? 1 : -1))));
    if (['lapis', 'borracha', 'linha', 'pontilhado', 'sombra'].includes(editor.estado.ferramenta)) montarOpcoes();
  } else if (k === '+' || k === '=') visor.passoZoom(1);
  else if (k === '-' || k === '_') visor.passoZoom(-1);
  else if (k === '0') visor.ajustar();
  else if (k === '1') executar('zoom100');
  else if (k === ',') editor.selecionarQuadro(editor.estado.quadro - 1);
  else if (k === '.') editor.selecionarQuadro(editor.estado.quadro + 1);
  else if (k === 'enter') editor.estado.tocando ? editor.parar() : editor.tocar();
  else if (k === 'delete' || k === 'backspace') executar('limparCamada');
  else if (k === '?') executar('atalhos');
  else if (k === 'escape') editor.definirSelecao(null);
  else return;
  e.preventDefault();
}

const paleta = new PainelPaleta($('#painel-paleta'), editor, () => armazenamento);
new PainelCor($('#painel-cor'), editor);
new PainelTons($('#painel-tons'), editor, paleta);
new PainelCamadas($('#painel-camadas'), editor);
new LinhaDoTempo($('#linha-tempo'), editor);

const autosalvar = atrasar(() => {
  const doc = editor.doc;
  guardarRascunho({ dados: serializar(doc), projeto: editor.projeto, modificado: editor.modificado, quando: new Date().toISOString() });
}, 1200);

// Grava o rascunho na hora, sem esperar o autosalvamento. Usado ao fechar a aba ou o app desktop.
function guardarRascunhoAgora() {
  autosalvar.cancelar();
  return guardarRascunho({ dados: serializar(editor.doc), projeto: editor.projeto, modificado: editor.modificado, quando: new Date().toISOString() });
}
editor.ao('historico', autosalvar);
editor.ao('salvo', autosalvar);

async function iniciar() {
  aplicarTema(lerPreferencia('tema', 'sistema'));
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
    if (lerPreferencia('tema', 'sistema') === 'sistema') aplicarTema('sistema');
  });
  $('#tema').addEventListener('click', alternarTema);
  // Mesma proporção do logo do projeto (docs/images/logo.svg) e do ícone do app: ponteiro em cerca de metade da altura.
  $('#logo').innerHTML = icone('logo', 18);
  montarFerramentas();
  montarOpcoes();
  montarVisao();
  montarMenus();
  montarNome();
  montarHistorico();
  montarStatus();
  atualizarArmazenamento();
  window.addEventListener('keydown', atalhos);
  window.addEventListener('beforeunload', () => {
    guardarRascunhoAgora();
  });
  if (DESKTOP) {
    // F11 vale em qualquer lugar do app, até com um diálogo aberto ou digitando num campo.
    window.addEventListener(
      'keydown',
      (e) => {
        if (e.key !== 'F11') return;
        e.preventDefault();
        executar('telaCheia');
      },
      true,
    );
    // O app chama isto antes de fechar a janela (Alt+F4 ou o X), para o rascunho não perder os últimos traços.
    window.__crivoAntesDeFechar = guardarRascunhoAgora;
  }
  const rascunho = await lerRascunho();
  if (rascunho?.dados) {
    try {
      const doc = desserializar(rascunho.dados);
      editor.carregar(doc, rascunho.projeto);
      editor.modificado = Boolean(rascunho.modificado);
      editor.emitir('historico');
    } catch {
      avisar('O rascunho anterior não pôde ser recuperado.', 'alerta');
    }
  }
  const servidor = await ArmazenamentoServidor.detectar();
  if (servidor) {
    armazenamento = servidor;
    atualizarArmazenamento();
    paleta.carregar();
  }
  document.body.classList.add('pronto');
}

iniciar();

window.crivo = { editor, visor, versao: VERSAO };
return {  };
})();
})();
