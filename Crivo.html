  if (bytes.length < 128) throw new Error('Arquivo .ase incompleto ou corrompido.');
  r.u32();
  if (r.u16() !== HEADER_MAGIC) throw new Error('Este arquivo não é um .ase válido.');
  const header = { frames: r.u16(), width: r.u16(), height: r.u16(), depth: r.u16(), flags: r.u32(), speed: r.u16() };
  r.u32();
  r.u32();
  header.transparentIndex = r.u8();
  r.p = 128;
  if (![8, 16, 32].includes(header.depth)) throw new Error(`Profundidade de cor não suportada: ${header.depth} bits.`);
  const file = { header, layers: [], frames: [], cels: [], palette: [], tags: [], slices: [], tilesets: [] };
  let newPalette = false;
  let userTargets = [];
  for (let f = 0; f < header.frames; f++) {
    const frameStart = r.p;
    const frameSize = r.u32();
    if (r.u16() !== FRAME_MAGIC) throw new Error('Quadro inválido no arquivo .ase.');
    const oldCount = r.u16();
    const duration = r.u16();
    r.p += 2;
    const newCount = r.u32();
    const count = newCount || oldCount;
    file.frames.push({ duration });
    for (let c = 0; c < count; c++) {
      const start = r.p;
      const size = r.u32();
      const type = r.u16();
      if (size < 6) throw new Error('Bloco inválido no arquivo .ase.');
      const end = start + size;
      const targets = [];
      if (type === CHUNK.layer) {
        const flags = r.u16();
        const kind = r.u16();
        const level = r.u16();
        r.u16();
        r.u16();
        const blend = r.u16();
        const opacity = r.u8();
        r.p += 3;
        const name = r.string();
        const layer = { flags, kind, level, blend, opacity, name, tileset: kind === 2 ? r.u32() : null };
        file.layers.push(layer);
        targets.push(layer);
      } else if (type === CHUNK.cel) {
        const cel = { frame: f, layer: r.u16(), x: r.i16(), y: r.i16(), opacity: r.u8(), type: r.u16() };
        r.i16();
        r.p += 5;
        if (cel.type === 1) cel.link = r.u16();
        else if (cel.type === 0 || cel.type === 2) {
          cel.width = r.u16();
          cel.height = r.u16();
          cel.data = bytes.subarray(r.p, end);
        } else if (cel.type === 3) {
          cel.width = r.u16();
          cel.height = r.u16();
          cel.bits = r.u16();
          cel.idMask = r.u32();
          cel.xFlip = r.u32();
          cel.yFlip = r.u32();
          cel.dFlip = r.u32();
          r.p += 10;
          cel.data = bytes.subarray(r.p, end);
        }
        file.cels.push(cel);
      } else if (type === CHUNK.palette) {
        const total = r.u32();
        const from = r.u32();
        const to = r.u32();
        r.p += 8;
        if (!newPalette) file.palette = [];
        newPalette = true;
        file.palette.length = Math.max(file.palette.length, Math.min(total, 65536));
        for (let i = from; i <= to && r.p < end; i++) {
          const flags = r.u16();
          file.palette[i] = rgba(r.u8(), r.u8(), r.u8(), r.u8());
          if (flags & 1) r.string();
        }
      } else if ((type === CHUNK.oldPalette || type === CHUNK.oldPalette64) && !newPalette) {
        const scale = type === CHUNK.oldPalette64 ? (v) => Math.round((v * 255) / 63) : (v) => v;
        const packets = r.u16();
        let index = 0;
        for (let k = 0; k < packets; k++) {
          index += r.u8();
          const n = r.u8() || 256;
          for (let i = 0; i < n; i++) file.palette[index++] = rgba(scale(r.u8()), scale(r.u8()), scale(r.u8()));
        }
      } else if (type === CHUNK.tags) {
        const n = r.u16();
        r.p += 8;
        for (let k = 0; k < n; k++) {
          const tag = { from: r.u16(), to: r.u16(), direction: TAG_DIRECTIONS[r.u8()] ?? 'forward', repeat: r.u16() };
          r.p += 6;
          tag.color = colorToHex(rgba(r.u8(), r.u8(), r.u8()));
          r.u8();
          tag.name = r.string();
          file.tags.push(tag);
          targets.push(tag);
        }
      } else if (type === CHUNK.slice) {
        const keys = r.u32();
        const flags = r.u32();
        r.u32();
        const slice = { name: r.string(), color: '#0000ff', center: null, pivot: null };
        if (keys > 0) {
          r.u32();
          slice.x = r.i32();
          slice.y = r.i32();
          slice.width = r.u32();
          slice.height = r.u32();
          if (flags & 1) slice.center = { x: r.i32(), y: r.i32(), width: r.u32(), height: r.u32() };
          if (flags & 2) slice.pivot = { x: r.i32(), y: r.i32() };
          file.slices.push(slice);
          targets.push(slice);
        }
      } else if (type === CHUNK.tileset) {
        const tileset = { id: r.u32(), flags: r.u32(), count: r.u32(), tileWidth: r.u16(), tileHeight: r.u16() };
        r.i16();
        r.p += 14;
        tileset.name = r.string();
        if (tileset.flags & 1) r.p += 8;
        if (tileset.flags & 2) {
          const length = r.u32();
          tileset.data = r.take(Math.min(length, end - r.p));
        }
        file.tilesets.push(tileset);
        targets.push(tileset);
      } else if (type === CHUNK.userData) {
        const flags = r.u32();
        if (flags & 1) r.string();
        const target = userTargets.shift();
        if (flags & 2 && target && 'color' in target) target.color = colorToHex(rgba(r.u8(), r.u8(), r.u8()));
      }
      // Color profile, cel extra, external files, masks and anything unknown are skipped.
      if (type !== CHUNK.userData) userTargets = targets;
      r.p = end;
    }
    r.p = frameStart + frameSize;
  }
  return file;
}

function setLink(doc, layerId, sourceFrameId, frameId) {
  if (typeof doc.linkCels === 'function') doc.linkCels(layerId, [sourceFrameId, frameId]);
  else doc.cells.set(doc.key(frameId, layerId), doc.cell(sourceFrameId, layerId).slice());
}

// Reads a .aseprite/.ase file into a PixelDocument (async: the images are zlib streams).
async function readAseprite(bytes, { name = 'Sem título' } = {}) {
  const file = parseAseprite(bytes);
  const { header } = file;
  const fps = header.speed > 0 ? Math.min(60, Math.max(1, Math.round(1000 / header.speed))) : 8;
  const doc = new PixelDocument(header.width, header.height, { name: String(name).slice(0, 120), fps, empty: true });
  const W = doc.width;
  const H = doc.height;
  doc.colorMode = header.depth === 8 ? 'indexed' : header.depth === 16 ? 'grayscale' : 'rgba';
  const palette = [...file.palette].map((c) => c ?? 0);
  doc.palette = palette.slice(0, 256);
  const defaultDuration = Math.round(1000 / fps);
  for (const fr of file.frames) {
    const d = fr.duration || defaultDuration;
    doc.frames.push({ id: newId('q'), duration: d === header.speed || d === defaultDuration ? null : d });
  }
  if (!doc.frames.length) doc.addFrame();

  // Tilesets: the image is tileWidth × (tileHeight × count), in the sprite color depth.
  const tilesets = new Map();
  for (const ts of file.tilesets) {
    const tiles = [];
    const n = ts.tileWidth * ts.tileHeight;
    if (ts.data) {
      const raw = await inflate(ts.data);
      const px = toRGBA(raw, n * ts.count, header.depth, palette, header.transparentIndex, false);
      for (let k = 0; k < ts.count; k++) tiles.push(px.slice(k * n, (k + 1) * n));
    }
    if (!tiles.length) tiles.push(new Uint32Array(n));
    tilesets.set(ts.id, { id: newId('t'), name: ts.name || `Tileset ${tilesets.size + 1}`, tileWidth: ts.tileWidth, tileHeight: ts.tileHeight, tiles });
  }
  doc.tilesets = [...tilesets.values()];
  if (!(doc.tileCells instanceof Map)) doc.tileCells = new Map();

  // Child levels → tree → flat list, bottom to top, with each group right above its children.
  const root = { children: [] };
  const stack = [root];
  file.layers.forEach((info, index) => {
    const node = { info, index, children: [] };
    const level = Math.min(info.level, stack.length - 1);
    stack[level].children.push(node);
    stack.length = level + 1;
    stack.push(node);
  });
  const byIndex = new Map();
  const opacityValid = Boolean(header.flags & 1);
  const emit = (node, parent) => {
    const { info } = node;
    const kind = info.kind === 1 ? 'group' : info.kind === 2 ? 'tilemap' : 'image';
    const layer = {
      id: newId('c'),
      name: String(info.name || `Camada ${doc.layers.length + 1}`).slice(0, 80),
      visible: Boolean(info.flags & LAYER_FLAGS.visible),
      opacity: opacityValid ? Math.round((info.opacity * 100) / 255) : 100,
      locked: !(info.flags & LAYER_FLAGS.editable),
      blendMode: BLEND_MODES[info.blend] ?? 'normal',
      kind,
      parent,
      collapsed: Boolean(info.flags & LAYER_FLAGS.collapsed),
      tileset: kind === 'tilemap' ? (tilesets.get(info.tileset)?.id ?? null) : null,
      reference: Boolean(info.flags & LAYER_FLAGS.reference),
    };
    byIndex.set(node.index, { layer, background: Boolean(info.flags & LAYER_FLAGS.background), tileset: tilesets.get(info.tileset) ?? null });
    for (const child of node.children) emit(child, layer.id);
    doc.layers.push(layer);
  };
  for (const node of root.children) emit(node, null);
  if (!doc.layers.length) doc.addLayer('Camada 1');

  const links = [];
  for (const cel of file.cels) {
    const target = byIndex.get(cel.layer);
    const frame = doc.frames[cel.frame];
    if (!target || !frame || target.layer.kind === 'group') continue;
    if (cel.type === 1) {
      if (doc.frames[cel.link]) links.push({ layerId: target.layer.id, from: doc.frames[cel.link].id, to: frame.id });
      continue;
    }
    if (![0, 2, 3].includes(cel.type) || !cel.data) continue;
    const raw = cel.type === 0 ? cel.data : await inflate(cel.data);
    let image;
    let iw;
    let ih;
    if (cel.type === 3) {
      const ts = target.tileset;
      if (!ts || ![8, 16, 32].includes(cel.bits)) continue;
      const tw = ts.tileWidth;
      const th = ts.tileHeight;
      const ids = readTiles(raw, cel.width * cel.height, cel.bits);
      iw = cel.width * tw;
      ih = cel.height * th;
      image = new Uint32Array(iw * ih);
      for (let ty = 0; ty < cel.height; ty++) {
        for (let tx = 0; tx < cel.width; tx++) {
          const v = ids[ty * cel.width + tx];
          const tile = ts.tiles[(v & cel.idMask) >>> 0];
          if (!tile) continue;
          const fx = Boolean(v & cel.xFlip);
          const fy = Boolean(v & cel.yFlip);
          const fd = Boolean(v & cel.dFlip);
          for (let y = 0; y < th; y++) {
            for (let x = 0; x < tw; x++) {
              let sx = fd ? y : x;
              let sy = fd ? x : y;
              if (fx) sx = tw - 1 - sx;
              if (fy) sy = th - 1 - sy;
              if (sx < tw && sy < th) image[(ty * th + y) * iw + tx * tw + x] = tile[sy * tw + sx];
            }
          }
        }
      }
      // Tile indices, when the cel sits on the document tile grid.
      if (cel.x % tw === 0 && cel.y % th === 0) {
        const cols = Math.ceil(W / tw);
        const rows = Math.ceil(H / th);
        const grid = new Uint32Array(cols * rows);
        for (let ty = 0; ty < cel.height; ty++) {
          for (let tx = 0; tx < cel.width; tx++) {
            const gx = cel.x / tw + tx;
            const gy = cel.y / th + ty;
            if (gx >= 0 && gy >= 0 && gx < cols && gy < rows) grid[gy * cols + gx] = (ids[ty * cel.width + tx] & cel.idMask) >>> 0;
          }
        }
        doc.tileCells.set(doc.key(frame.id, target.layer.id), grid);
      }
    } else {
      iw = cel.width;
      ih = cel.height;
      image = toRGBA(raw, iw * ih, header.depth, palette, header.transparentIndex, target.background);
    }
    const dest = doc.cell(frame.id, target.layer.id);
    const opacity = cel.opacity;
    for (let y = 0; y < ih; y++) {
      const dy = cel.y + y;
      if (dy < 0 || dy >= H) continue;
      for (let x = 0; x < iw; x++) {
        const dx = cel.x + x;
        if (dx < 0 || dx >= W) continue;
        let c = image[y * iw + x];
        if (opacity < 255 && c >>> 24) c = ((c & 0x00ffffff) | (Math.round(((c >>> 24) * opacity) / 255) << 24)) >>> 0;
        dest[dy * W + dx] = c;
      }
    }
  }
  for (const l of links) {
    if (!doc.hasCell(l.from, l.layerId)) continue;
    setLink(doc, l.layerId, l.from, l.to);
  }

  doc.tags = file.tags
    .filter((t) => doc.frames[t.from] && doc.frames[t.to])
    .map((t) => ({ id: newId('t'), name: String(t.name || 'Tag').slice(0, 80), from: doc.frames[Math.min(t.from, t.to)].id, to: doc.frames[Math.max(t.from, t.to)].id, direction: t.direction, repeat: t.repeat, color: t.color }));
  doc.slices = file.slices.map((s) => ({ id: newId('s'), name: String(s.name || 'Slice').slice(0, 80), color: s.color, x: s.x, y: s.y, width: s.width, height: s.height, center: s.center, pivot: s.pivot }));
  return doc;
}

// ---------------------------------------------------------------------------------------------------------

function writeString(w, s) {
  const b = new TextEncoder().encode(String(s ?? ''));
  w.u16(b.length);
  w.bytes(b);
}

function contentBox(px, W, H) {
  let x0 = W;
  let y0 = H;
  let x1 = -1;
  let y1 = -1;
  for (let y = 0; y < H; y++) {
    for (let x = 0; x < W; x++) {
      if (px[y * W + x] === 0) continue;
      if (x < x0) x0 = x;
      if (x > x1) x1 = x;
      if (y < y0) y0 = y;
      if (y > y1) y1 = y;
    }
  }
  return x1 < 0 ? null : { x: x0, y: y0, width: x1 - x0 + 1, height: y1 - y0 + 1 };
}

// Flat list (bottom → top, groups above their children) → file order (pre-order, group before children).
function layerFileOrder(layers) {
  const ids = new Set(layers.map((l) => l.id));
  const children = new Map();
  for (const l of layers) {
    const p = l.parent && ids.has(l.parent) && l.parent !== l.id ? l.parent : null;
    if (!children.has(p)) children.set(p, []);
    children.get(p).push(l);
  }
  const out = [];
  const seen = new Set();
  const visit = (l, level) => {
    if (seen.has(l.id)) return;
    seen.add(l.id);
    out.push({ layer: l, level });
    for (const c of children.get(l.id) ?? []) visit(c, level + 1);
  };
  for (const l of children.get(null) ?? []) visit(l, 0);
  for (const l of layers) visit(l, 0);
  return out;
}

function chunk(w, type, fill) {
  const start = w.length;
  w.u32(0);
  w.u16(type);
  fill();
  w.setU32(start, w.length - start);
}

// Writes the document as a 32-bit RGBA .aseprite file. compress: false writes raw cels (type 0);
// palette: colors for the palette chunk (default: doc.palette, or the colors in use).
async function writeAseprite(doc, { compress = true, palette: colors = null } = {}) {
  const useZlib = compress && typeof CompressionStream === 'function';
  const W = doc.width;
  const H = doc.height;
  const fps = doc.fps || 8;
  const speed = Math.max(1, Math.round(1000 / fps));
  let palette = (colors?.length ? colors : doc.palette || []).slice(0, 256);
  if (!palette.length) palette = (doc.usedColors?.() ?? []).slice(0, 256);
  if (!palette.length) palette = [rgba(0, 0, 0)];
  const order = layerFileOrder(doc.layers);
  const tags = Array.isArray(doc.tags) ? doc.tags : [];
  const slices = Array.isArray(doc.slices) ? doc.slices : [];
  // Tilesets (images stacked vertically, always zlib) and the tilemap layers that can be written as tilemaps.
  const tilesets = [];
  for (const ts of Array.isArray(doc.tilesets) ? doc.tilesets : []) {
    const n = ts.tileWidth * ts.tileHeight;
    const tiles = ts.tiles?.length ? ts.tiles : [new Uint32Array(n)];
    const image = new Uint32Array(n * tiles.length);
    tiles.forEach((t, k) => image.set(t.subarray(0, n), k * n));
    tilesets.push({ ts, count: tiles.length, data: await deflate(new Uint8Array(image.buffer)) });
  }
  const tilesetIndex = (layer) => (layer.kind === 'tilemap' && layer.tileset != null ? tilesets.findIndex((t) => t.ts.id === layer.tileset) : -1);

  const w = new ByteWriter(4096);
  w.u32(0); // file size, patched at the end
  w.u16(HEADER_MAGIC);
  w.u16(doc.frames.length);
  w.u16(W);
  w.u16(H);
  w.u16(32);
  w.u32(1 | 2); // layer opacity valid; group blend/opacity valid
  w.u16(speed);
  w.u32(0);
  w.u32(0);
  w.u8(0); // transparent index (indexed only)
  w.zeros(3);
  w.u16(palette.length);
  w.u8(1);
  w.u8(1);
  w.u16(0);
  w.u16(0);
  w.u16(16);
  w.u16(16);
  w.zeros(84);

  // Linked cels: the first frame that uses a pixel buffer is written, the next ones point to it.
  const firstUse = new Map(order.map(({ layer }) => [layer.id, new Map()]));
  for (let f = 0; f < doc.frames.length; f++) {
    const frame = doc.frames[f];
    const frameStart = w.length;
    w.u32(0);
    w.u16(FRAME_MAGIC);
    const countAt = w.length;
    w.u16(0);
    w.u16(Math.max(1, Math.min(65535, Math.round(frame.duration || speed))));
    w.zeros(2);
    w.u32(0);
    let chunks = 0;
    if (f === 0) {
      chunk(w, CHUNK.palette, () => {
        w.u32(palette.length);
        w.u32(0);
        w.u32(palette.length - 1);
        w.zeros(8);
        for (const c of palette) {
          w.u16(0);
          w.u8(c & 255);
          w.u8((c >>> 8) & 255);
          w.u8((c >>> 16) & 255);
          w.u8(c >>> 24);
        }
      });
      chunks++;
      tilesets.forEach(({ ts, count, data }, i) => {
        chunk(w, CHUNK.tileset, () => {
          w.u32(i);
          w.u32(2 | 4); // tiles inside this file; tile 0 is the empty tile
          w.u32(count);
          w.u16(ts.tileWidth);
          w.u16(ts.tileHeight);
          w.u16(1);
          w.zeros(14);
          writeString(w, ts.name);
          w.u32(data.length);
          w.bytes(data);
        });
        chunks++;
      });
      for (const { layer, level } of order) {
        chunk(w, CHUNK.layer, () => {
          const flags =
            (layer.visible !== false ? LAYER_FLAGS.visible : 0) |
            (layer.locked ? 0 : LAYER_FLAGS.editable) |
            (layer.collapsed ? LAYER_FLAGS.collapsed : 0) |
            (layer.reference ? LAYER_FLAGS.reference : 0);
          w.u16(flags);
          const tileset = tilesetIndex(layer);
          w.u16(layer.kind === 'group' ? 1 : tileset >= 0 ? 2 : 0);
          w.u16(level);
          w.u16(0);
          w.u16(0);
          w.u16(Math.max(0, BLEND_MODES.indexOf(layer.blendMode || 'normal')));
          w.u8(Math.round((Math.min(100, Math.max(0, layer.opacity ?? 100)) * 255) / 100));
          w.zeros(3);
          writeString(w, layer.name);
          if (tileset >= 0) w.u32(tileset);
        });
        chunks++;
      }
      if (tags.length) {
        chunk(w, CHUNK.tags, () => {
          w.u16(tags.length);
          w.zeros(8);
          for (const t of tags) {
            const a = Math.max(0, doc.frameIndex(t.from));
            const b = Math.max(0, doc.frameIndex(t.to));
            const color = hexToColor(t.color || '#000000') ?? 0;
            w.u16(Math.min(a, b));
            w.u16(Math.max(a, b));
            w.u8(Math.max(0, ['forward', 'reverse', 'pingpong'].indexOf(t.direction)));
            w.u16(Math.max(0, Math.min(65535, Number(t.repeat) || 0)));
            w.zeros(6);
            w.u8(color & 255);
            w.u8((color >>> 8) & 255);
            w.u8((color >>> 16) & 255);
            w.u8(0);
            writeString(w, t.name);
          }
        });
        chunks++;
        for (const t of tags) {
          const color = hexToColor(t.color || '#000000') ?? 0;
          chunk(w, CHUNK.userData, () => {
            w.u32(2);
            w.u8(color & 255);
            w.u8((color >>> 8) & 255);
            w.u8((color >>> 16) & 255);
            w.u8(255);
          });
          chunks++;
        }
      }
      for (const s of slices) {
        chunk(w, CHUNK.slice, () => {
          w.u32(1);
          w.u32((s.center ? 1 : 0) | (s.pivot ? 2 : 0));
          w.u32(0);
          writeString(w, s.name);
          w.u32(0);
          w.u32(s.x | 0);
          w.u32(s.y | 0);
          w.u32(Math.max(0, s.width | 0));
          w.u32(Math.max(0, s.height | 0));
          if (s.center) {
            w.u32(s.center.x | 0);
            w.u32(s.center.y | 0);
            w.u32(Math.max(0, s.center.width | 0));
            w.u32(Math.max(0, s.center.height | 0));
          }
          if (s.pivot) {
            w.u32(s.pivot.x | 0);
            w.u32(s.pivot.y | 0);
          }
        });
        chunks++;
        const color = hexToColor(s.color || '#0000ff') ?? 0;
        chunk(w, CHUNK.userData, () => {
          w.u32(2);
          w.u8(color & 255);
          w.u8((color >>> 8) & 255);
          w.u8((color >>> 16) & 255);
          w.u8(255);
        });
        chunks++;
      }
    }
    for (let index = 0; index < order.length; index++) {
      const { layer } = order[index];
      if (layer.kind === 'group') continue;
      const key = doc.key(frame.id, layer.id);
      if (!doc.hasCell(frame.id, layer.id) && !doc.links?.has?.(key)) continue;
      const px = doc.cell(frame.id, layer.id);
      const box = contentBox(px, W, H);
      if (!box) continue;
      const uses = firstUse.get(layer.id);
      const source = uses.get(px);
      if (source !== undefined) {
        chunk(w, CHUNK.cel, () => {
          w.u16(index);
          w.u16(0);
          w.u16(0);

function applyTheme(theme) {
  const effective = theme === 'system' ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : theme;
  document.documentElement.dataset.theme = effective;
  const button = $('#theme');
  if (button) {
    button.innerHTML = icon(effective === 'dark' ? 'sun' : 'moon', 18);
    button.setAttribute('aria-label', effective === 'dark' ? 'Usar tema claro' : 'Usar tema escuro');
    button.title = button.getAttribute('aria-label');
  }
  viewport.readColors();
}

function buildTools() {
  const bar = $('#tools');
  bar.replaceChildren(
    ...TOOLS.map((f) =>
      el('button', {
        type: 'button',
        class: 'tool',
        data: { tool: f.id },
        title: `${f.name} (${f.shortcut})`,
        'aria-label': `${f.name} (${f.shortcut})`,
        html: icon(f.icon, 22),
        onclick: () => editor.setState('tool', f.id),
      }),
    ),
  );
  const mark = () => {
    for (const b of bar.children) {
      const active = b.dataset.tool === editor.state.tool;
      b.classList.toggle('active', active);
      b.setAttribute('aria-pressed', String(active));
    }
    $('#viewport').dataset.tool = editor.state.tool;
  };
  editor.on('state', ({ key }) => {
    if (key === 'tool') {
      mark();
      buildOptions();
    } else if (key === 'shadeMode') {
      buildOptions();
    } else if (TOOLS.find((f) => f.id === editor.state.tool)?.options.includes(key) && !$('#options').contains(document.activeElement)) {
      // Change made by a shortcut or by code: redraws the bar to show the current value.
      buildOptions();
    }
  });
  mark();
}

function optionGroup(label, ...content) {
  return el('label', { class: 'option' }, el('span', {}, label), ...content);
}

function stateSelect(key, options, label) {
  const s = el('select', { 'aria-label': label }, options.map(([v, t]) => el('option', { value: v, selected: String(editor.state[key]) === String(v) }, t)));
  s.addEventListener('change', () => editor.setState(key, typeof editor.state[key] === 'number' ? +s.value : s.value));
  return s;
}

function buildOptions() {
  const bar = $('#options');
  const f = TOOLS.find((x) => x.id === editor.state.tool);
  const items = [el('strong', { class: 'tool-name' }, f.name)];
  for (const op of f.options) {
    if (extraToolOptions.some((builder) => builder(op, items))) continue;
    if (op === 'size') {
      const r = el('input', { type: 'range', min: 1, max: 32, value: editor.state.size, 'aria-label': 'Tamanho do pincel' });
      const o = el('output', { class: 'mono' }, `${editor.state.size}px`);
      r.addEventListener('input', () => {
        editor.setState('size', +r.value);
        o.textContent = `${r.value}px`;
      });
      items.push(optionGroup('Tamanho', r, o));
    } else if (op === 'shape') {
      items.push(optionGroup('Ponta', stateSelect('shape', [['square', 'Quadrada'], ['circle', 'Redonda']], 'Formato da ponta')));
    } else if (op === 'eraserMode') {
      items.push(optionGroup('Apaga para', stateSelect('eraserMode', [['transparent', 'Transparente'], ['background', 'Cor secundária']], 'Modo da borracha')));
    } else if (op === 'connectivity') {
      items.push(optionGroup('Vizinhos', stateSelect('connectivity', [[4, '4 (lados)'], [8, '8 (com diagonais)']], 'Conectividade')));
    } else if (op === 'tolerance') {
      const r = el('input', { type: 'range', min: 0, max: 100, value: editor.state.tolerance, 'aria-label': 'Tolerância' });
      const o = el('output', { class: 'mono' }, `${editor.state.tolerance}%`);
      r.addEventListener('input', () => {
        editor.setState('tolerance', +r.value);
        o.textContent = `${r.value}%`;
      });
      items.push(optionGroup('Tolerância', r, o));
    } else if (op === 'contiguous') {
      const c = el('input', { type: 'checkbox', checked: editor.state.contiguous });
      c.addEventListener('change', () => editor.setState('contiguous', c.checked));
      items.push(el('label', { class: 'option' }, c, el('span', {}, 'Só a área contígua')));
    } else if (op === 'sample') {
      items.push(optionGroup('Ler de', stateSelect('sample', [['layer', 'Camada atual'], ['all', 'Todas as camadas']], 'Amostragem')));
    } else if (op === 'pixelPerfect') {
      const c = el('input', { type: 'checkbox', checked: editor.state.pixelPerfect });
      c.addEventListener('change', () => editor.setState('pixelPerfect', c.checked));
      items.push(el('label', { class: 'option', title: 'Remove os cantos em L dos traços de 1 px' }, c, el('span', {}, 'Pixel perfect')));
    } else if (op === 'density') {
      items.push(optionGroup('Densidade', stateSelect('density', [[12.5, '12,5%'], [25, '25%'], [37.5, '37,5%'], [50, '50% (xadrez)'], [62.5, '62,5%'], [75, '75%'], [87.5, '87,5%']], 'Densidade do pontilhado')));
    } else if (op === 'ditherBackground') {
      items.push(optionGroup('Fundo', stateSelect('ditherBackground', [['secondary', 'Cor secundária'], ['keep', 'Manter o que há']], 'Fundo do pontilhado')));
    } else if (op === 'gradientType') {
      items.push(optionGroup('Tipo', stateSelect('gradientType', [['linear', 'Linear'], ['radial', 'Radial']], 'Tipo de degradê')));
    } else if (op === 'gradientMatrix') {
      items.push(optionGroup('Padrão', stateSelect('gradientMatrix', [[2, 'Bayer 2×2'], [4, 'Bayer 4×4'], [8, 'Bayer 8×8']], 'Matriz de Bayer')));
    } else if (op === 'shadeMode') {
      items.push(optionGroup('Modo', stateSelect('shadeMode', [['palette', 'Rampa da paleta'], ['light', 'Luminosidade (OKLCH)']], 'Modo de clarear e escurecer')));
    } else if (op === 'shadeIntensity' && editor.state.shadeMode === 'light') {
      const r = el('input', { type: 'range', min: 2, max: 30, value: editor.state.shadeIntensity, 'aria-label': 'Intensidade' });
      const o = el('output', { class: 'mono' }, `${editor.state.shadeIntensity}%`);
      r.addEventListener('input', () => {
        editor.setState('shadeIntensity', +r.value);
        o.textContent = `${r.value}%`;
      });
      items.push(optionGroup('Intensidade', r, o));
    } else if (op === 'filled') {
      const c = el('input', { type: 'checkbox', checked: editor.state.filled });
      c.addEventListener('change', () => editor.setState('filled', c.checked));
      items.push(el('label', { class: 'option' }, c, el('span', {}, 'Preenchido')));
    }
  }
  const HINTS = {
    line: 'Shift: 45°',
    rectangle: 'Shift: proporção 1:1 · Alt: do centro',
    ellipse: 'Shift: proporção 1:1 · Alt: do centro',
    dither: 'Botão direito troca as cores',
    gradient: 'Arraste de onde começa até onde termina · botão direito inverte · Shift: 45°',
    shade: 'Esquerdo clareia · direito escurece',
    selection: 'Shift: adicionar (no meio do arraste: quadrada) · Alt: subtrair · Shift+Alt: interseção · clique para desmarcar · Ctrl+C/X/V',
    ellipseSelection: 'Shift: adicionar · Alt: subtrair · Shift+Alt: interseção',
    lasso: 'Arraste em volta da área · Shift: adicionar · Alt: subtrair',
    polygonLasso: 'Clique nos cantos · duplo clique, Enter ou clique no primeiro ponto fecha · Esc cancela',
    magicWand: 'Seleciona pela cor · Shift: adicionar · Alt: subtrair · Shift+Alt: interseção',
    movePixels: 'Arraste ou use as setas (Shift: 8 px) · sem seleção move a camada toda',
    spray: 'Segure o botão para borrifar · botão direito usa a cor secundária',
    curve: 'Arraste a linha, depois arraste para curvar (até 2 vezes) · Enter ou clique aplica · Esc cancela',
    contour: 'Desenhe o contorno: a forma é preenchida ao soltar',
    polygon: 'Clique nos cantos · duplo clique, Enter ou clique no primeiro ponto fecha · Esc cancela',
    blur: 'Suaviza misturando os vizinhos · pixels transparentes continuam transparentes',
    jumble: 'Troca pixels vizinhos de lugar, sem criar cores novas',
  };
  if (HINTS[f.id]) items.push(el('span', { class: 'option-hint' }, HINTS[f.id]));
  bar.replaceChildren(...items);
}

function buildView() {
  const bar = $('#view');
  const symmetry = el(
    'select',
    { 'aria-label': 'Simetria' },
    [['none', 'Sem simetria'], ['horizontal', 'Espelho horizontal'], ['vertical', 'Espelho vertical'], ['both', 'Horizontal e vertical']].map(([v, t]) => el('option', { value: v, selected: editor.state.symmetry === v }, t)),
  );
  symmetry.addEventListener('change', () => editor.setState('symmetry', symmetry.value));
  const grid = el('button', { type: 'button', class: 'icon-button', title: 'Grade (G)', 'aria-label': 'Grade', html: icon('grid', 18), onclick: () => editor.setState('grid', !editor.state.grid) });
  const majorGrid = el(
    'select',
    { 'aria-label': 'Linha forte da grade a cada', title: 'Linha forte da grade a cada N pixels' },
    [[0, 'Sem linha forte'], [4, 'Forte a cada 4'], [8, 'Forte a cada 8'], [16, 'Forte a cada 16'], [32, 'Forte a cada 32']].map(([v, t]) => el('option', { value: v, selected: editor.state.majorGrid === v }, t)),
  );
  majorGrid.addEventListener('change', () => editor.setState('majorGrid', +majorGrid.value));
  const tile = el('button', { type: 'button', class: 'icon-button', title: 'Modo ladrilho (T)', 'aria-label': 'Modo ladrilho', html: icon('frames', 18), onclick: () => editor.setState('tile', !editor.state.tile) });
  const zoom = el('output', { class: 'mono zoom' });
  bar.replaceChildren(
    el('span', { class: 'icon-label', html: icon('symmetry', 18), title: 'Simetria (M)' }),
    symmetry,
    grid,
    majorGrid,
    tile,
    el('span', { class: 'separator' }),
    el('button', { type: 'button', class: 'icon-button', title: 'Afastar (-)', 'aria-label': 'Afastar', html: icon('minus', 16), onclick: () => viewport.zoomStep(-1) }),
    zoom,
    el('button', { type: 'button', class: 'icon-button', title: 'Aproximar (+)', 'aria-label': 'Aproximar', html: icon('plus', 16), onclick: () => viewport.zoomStep(1) }),
    el('button', { type: 'button', class: 'icon-button', title: 'Ajustar à tela (0)', 'aria-label': 'Ajustar à tela', html: icon('fit', 16), onclick: () => viewport.fit() }),
  );
  const update = () => {
    symmetry.value = editor.state.symmetry;
    grid.classList.toggle('on', editor.state.grid);
    grid.setAttribute('aria-pressed', String(editor.state.grid));
    majorGrid.value = String(editor.state.majorGrid);
    tile.classList.toggle('on', editor.state.tile);
    tile.setAttribute('aria-pressed', String(editor.state.tile));
    zoom.textContent = `${viewport.zoom * 100}%`;
  };
  editor.on('state', update);
  editor.on('zoom', update);
  update();
}

  ['Ajuda', ['shortcuts', 'about']],

// Feature modules (features/*.js) receive this object in install(app) and plug into the app through it:
// they add commands to app.commands, menu entries with app.addMenuItems / app.addMenu, keyboard shortcuts
// with app.addShortcut and option widgets with app.addToolOptions. Keep each feature inside its own module.
const extraShortcuts = [];
const extraToolOptions = [];
const app = {
  editor,
  viewport,
  controller,
  commands: COMMANDS,
  menus: MENUS,
  get storage() {
    return storage;
  },
  get palette() {
    return palette;
  },
  execute: (id) => execute(id),
  rebuildMenus: () => buildMenus(),
  rebuildTools: () => buildTools(),
  rebuildOptions: () => buildOptions(),
  // Adds command ids to an existing menu, after the item `after` (or at the end).
  addMenuItems(menu, ids, after = null) {
    const entry = MENUS.find(([title]) => title === menu);
    if (!entry) throw new Error(`Unknown menu: ${menu}`);
    const i = after ? entry[1].indexOf(after) : -1;
    if (i >= 0) entry[1].splice(i + 1, 0, ...ids);
    else entry[1].push(...ids);
  },
  // Adds a new top-level menu before the menu `before` (or before "Ajuda").
  addMenu(title, ids, before = 'Ajuda') {
    const i = MENUS.findIndex(([t]) => t === before);
    MENUS.splice(i < 0 ? MENUS.length : i, 0, [title, ids]);
  },
  // shortcut: { key: 'b', ctrl: false, shift: false, alt: false, run: () => {} }; key is KeyboardEvent.key in lower case.
  addShortcut(shortcut) {
    extraShortcuts.push({ ctrl: false, shift: false, alt: false, ...shortcut });
  },
  // builder(op, items) appends widgets for the tool option `op` to `items` and returns true when it handled it.
  addToolOptions(builder) {
    extraToolOptions.push(builder);
  },
  notify,
  optionGroup: (label, ...content) => optionGroup(label, ...content),
  stateSelect: (key, options, label) => stateSelect(key, options, label),
};

function runExtraShortcut(e, ctrl, k) {
  const s = extraShortcuts.find((x) => x.key === k && x.ctrl === ctrl && x.shift === e.shiftKey && x.alt === e.altKey);
  if (!s) return false;
  s.run(e);
  return true;
}

function execute(id) {
  const c = COMMANDS[id];
  if (!c) return;
  Promise.resolve()
    .then(() => c.fn())
    .catch((error) => notify(error.message || String(error), 'error', 5000));
}

function buildMenus() {
  const bar = $('#menus');
  let openMenu = null;
  const close = () => {
    if (!openMenu) return;
    // Takes focus away from an item that is about to disappear, so keyboard shortcuts work again.
    if (openMenu.menu.contains(document.activeElement)) document.activeElement.blur();
    openMenu.menu.hidden = true;
    openMenu.button.setAttribute('aria-expanded', 'false');
    openMenu = null;
  };
  for (const [title, items] of MENUS) {
    const menu = el('div', { class: 'menu', role: 'menu', hidden: true });
    const button = el('button', { type: 'button', class: 'menu-button', 'aria-haspopup': 'true', 'aria-expanded': 'false' }, title);
    const fill = () =>
      menu.replaceChildren(
        ...items.map((id) => {
          if (id === '-') return el('hr');
          const c = COMMANDS[id];
          const checked = c.checked ? c.checked() : null;
          return el(
            'button',
            {
              type: 'button',
              role: checked === null ? 'menuitem' : 'menuitemcheckbox',
              'aria-checked': checked === null ? null : String(checked),
              class: 'menu-item',
              onclick: () => {
                close();
                execute(id);
              },
            },
            el('span', { class: 'check' }, checked ? '✓' : ''),
            el('span', {}, c.label),
            el('kbd', {}, c.shortcut),
          );
        }),
      );
    button.addEventListener('click', (e) => {
      e.stopPropagation();
      const same = openMenu?.menu === menu;
      close();
      if (same) return;
      fill();
      menu.hidden = false;
      button.setAttribute('aria-expanded', 'true');
      openMenu = { menu, button };
      menu.querySelector('.menu-item')?.focus();
    });
    button.addEventListener('mouseenter', () => {
      if (openMenu && openMenu.menu !== menu) button.click();
    });
    menu.addEventListener('keydown', (e) => {
      const focusItems = [...menu.querySelectorAll('.menu-item')];
      const i = focusItems.indexOf(document.activeElement);
      if (e.key === 'ArrowDown') focusItems[(i + 1) % focusItems.length].focus();
      else if (e.key === 'ArrowUp') focusItems[(i - 1 + focusItems.length) % focusItems.length].focus();
      else if (e.key === 'Escape') {
        close();
        button.focus();
      } else return;
      e.preventDefault();
    });
    bar.append(el('div', { class: 'menu-group' }, button, menu));
  }
  document.addEventListener('click', close);
}

function flipLayer(axis) {
  if (!editor.canEditLayer()) return;
  const label = axis === 'horizontal' ? 'Espelhar na horizontal' : 'Espelhar na vertical';
  const r = editor.clippedSelection;
  if (r) {
    const d = editor.doc;
    const px = editor.activeCell();
    const changes = [];
    for (let y = 0; y < r.height; y++) {
      for (let x = 0; x < r.width; x++) {
        const sx = axis === 'horizontal' ? r.width - 1 - x : x;
        const sy = axis === 'vertical' ? r.height - 1 - y : y;
        changes.push([(r.y + y) * d.width + r.x + x, px[(r.y + sy) * d.width + r.x + sx]]);
      }
    }
    editor.applyChanges(label, changes);
    return;
  }
  editor.editStructure(label, (d) => d.flipCell(editor.activeCell(), axis));
}

// Replaces the exact primary color with the secondary one on the current layer, in every frame (respects the selection).
function replaceColor() {
  if (!editor.canEditLayer()) return;
  const { primaryColor: from, secondaryColor: to } = editor.state;
  if (from === to) {
    notify('A cor primária e a secundária são iguais.', 'info');
    return;
  }
  const layer = editor.currentLayer;
  const sel = editor.selection;
  let total = 0;
  editor.editStructure('Substituir cor', (d) => {
    for (const q of d.frames) {
      if (!d.hasCell(q.id, layer.id)) continue;
      const px = d.cell(q.id, layer.id);
      for (let i = 0; i < px.length; i++) {
        if (px[i] !== from) continue;
        if (sel && !contains(sel, i % d.width, (i / d.width) | 0)) continue;
        px[i] = to;
        total++;
      }
    }
    return total > 0;
  });
  notify(total ? `${total} pixel(s) trocados em ${layer.name}.` : 'A cor primária não aparece nesta camada.', total ? 'success' : 'info');
}

function rotate(dir) {
  editor.editStructure(dir > 0 ? 'Girar à direita' : 'Girar à esquerda', (d) => d.rotate(dir));
  viewport.fit();
}

// Color and outline filters: act on the current cell and, if there is a selection, only inside it.
function applyFilter(label, fn) {
  if (!editor.canEditLayer()) return;
  const d = editor.doc;
  const sel = editor.selection;
  const filter = sel ? (i) => contains(sel, i % d.width, (i / d.width) | 0) : null;
  editor.applyChanges(label, fn(editor.activeCell(), d, filter));
}

function copy(cut) {
  const d = editor.doc;
  const area = editor.clippedSelection ?? { x: 0, y: 0, width: d.width, height: d.height };
  editor.clipboard = extractRegion(editor.activeCell(), d.width, area);
  editor.clipboard.origin = { x: area.x, y: area.y };
  if (cut) {
    if (!editor.canEditLayer()) return;
    editor.applyChanges('Recortar', [...indicesOf(area, d.width, d.height)].map((i) => [i, 0]));
  } else {
    notify(`Copiado: ${area.width} × ${area.height} px`, 'info', 1200);
  }
}

function paste() {
  const region = editor.clipboard;
  if (!region) {
    notify('Nada para colar. Selecione uma área e use Ctrl+C.', 'info');
    return;
  }
  if (!editor.canEditLayer()) return;
  const d = editor.doc;
  const dest = editor.selection ?? region.origin ?? { x: 0, y: 0 };
  const x = Math.min(Math.max(0, dest.x), Math.max(0, d.width - region.width));
  const y = Math.min(Math.max(0, dest.y), Math.max(0, d.height - region.height));
  const changes = [];
  pasteRegion(region, d.width, d.height, x, y, (i, c) => changes.push([i, c]), { opaqueOnly: true });
  const background = editor.activeCell().slice();
  editor.applyChanges('Colar', changes, { silent: true });
  editor.setSelection({ x, y, width: region.width, height: region.height });
  // The pasted content "floats" over the background: Move pixels (V) carries only it, without dragging or punching holes in what is below.
  editor.floating = { key: editor.activeKey, region, background, x, y, version: editor.history.version };
  editor.setState('tool', 'movePixels');
}

function cropToSelection() {
  const r = editor.clippedSelection;
  if (!r) {
    notify('Faça uma seleção primeiro (ferramenta S).', 'info');
    return;
  }
  editor.editStructure('Recortar para a seleção', (d) => d.crop(r.x, r.y, r.width, r.height));
  editor.setSelection(null);
  viewport.fit();
}

function trim() {
  const d = editor.doc;
  const r = contentBounds(d.cells.values(), d.width, d.height);
  if (!r) {
    notify('O projeto está vazio: nada para aparar.', 'info');
    return;
  }
  if (r.width === d.width && r.height === d.height) {
    notify('Não há bordas transparentes para aparar.', 'info');
    return;
  }
  editor.editStructure('Aparar bordas', (doc) => doc.crop(r.x, r.y, r.width, r.height));
  editor.setSelection(null);
  viewport.fit();
  notify(`Aparado para ${r.width} × ${r.height}.`, 'success');
}

function shiftHalf() {
  if (!editor.canEditLayer()) return;
  const d = editor.doc;
  const shifted = shiftWrapped(editor.activeCell(), d.width, d.height, Math.floor(d.width / 2), Math.floor(d.height / 2));
  editor.applyChanges('Deslocar meia matriz', [...shifted].map((c, i) => [i, c]));
}

function toggleTheme() {
  const current = document.documentElement.dataset.theme;
  const next = current === 'dark' ? 'light' : 'dark';
  writePreference('theme', next);
  applyTheme(next);
}

function projectData() {
  const doc = editor.doc;
  doc.palette = palette.current.colors.slice(0, 256);
  return {
    name: doc.name,
    data: serialize(doc),
    thumbnail: thumbnail(doc.composite(0), doc.width, doc.height, 128),
  };
}

async function save(copy = false) {
  const base = projectData();
  try {
    if (storage.type === 'server') {
      let r;
      const id = copy ? null : editor.project.id;
      try {
        r = await storage.saveProject({ ...base, id, revision: editor.project.revision });
      } catch (error) {
        if (error.status !== 409) throw error;
        const overwrite = await confirm('Projeto alterado em outro lugar', 'Este projeto foi salvo por outra aba ou pessoa depois que você o abriu. Salvar por cima mesmo assim? A outra versão continua no histórico de versões.', 'Salvar por cima');
        if (!overwrite) return;
        r = await storage.saveProject({ ...base, id, revision: null });
      }
      editor.markSaved({ id: r.id, revision: r.revision, local: null });
    } else {
      const r = await storage.saveProject({ ...base, id: copy ? null : editor.project.local });
      editor.markSaved({ local: r.id, id: null, revision: null });
    }
    notify(`"${editor.doc.name}" salvo em ${storage.name}.`, 'success');
  } catch (error) {
    notify('Não foi possível salvar: ' + error.message, 'error', 6000);
  }
}

async function openProject(id) {
  if (editor.modified && !(await confirm('Abrir outro projeto', 'As mudanças não salvas deste projeto serão perdidas.', 'Abrir mesmo assim', true))) return;
  try {
    const p = await storage.openProject(id);
    const doc = deserialize(p.data);
    editor.load(doc, storage.type === 'server' ? { id: p.id, revision: p.revision, local: null } : { id: null, revision: null, local: p.id });
    notify(`"${doc.name}" aberto.`, 'success');
  } catch (error) {
    notify('Não foi possível abrir: ' + error.message, 'error', 6000);
  }
}

async function openFile() {
  const file = await pickFile('.crivo,.json,application/json');
  if (!file) return;
  if (editor.modified && !(await confirm('Abrir arquivo', 'As mudanças não salvas deste projeto serão perdidas.', 'Abrir mesmo assim', true))) return;
  try {
    const doc = deserialize(await file.text());
    editor.load(doc);
    notify(`"${doc.name}" aberto.`, 'success');
  } catch (error) {
    notify('Arquivo inválido: ' + error.message, 'error', 6000);
  }
}

function downloadCrivo() {
  const { data } = projectData();
  downloadText(JSON.stringify(data), fileNameFor(editor.doc.name, 'crivo'), 'application/json');
}

function buildName() {
  const input = $('#project-name');
  const update = () => {
    if (document.activeElement !== input) input.value = editor.doc.name;
    document.title = `${editor.modified ? '• ' : ''}${editor.doc.name} · Crivo`;
  };
  input.addEventListener('change', () => {
    const v = input.value.trim().slice(0, 120) || 'Sem título';
    if (v === editor.doc.name) return;
    editor.editStructure('Renomear projeto', (d) => {
      d.name = v;
    });
  });
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') input.blur();
  });
  editor.on('document', update);
  editor.on('history', update);
  update();
}

function buildHistory() {
  const undo = $('#undo');
  const redo = $('#redo');
  undo.innerHTML = icon('undo', 18);
  redo.innerHTML = icon('redo', 18);
  undo.addEventListener('click', () => editor.undo());
  redo.addEventListener('click', () => editor.redo());
  const update = () => {
    const h = editor.history;
    undo.disabled = !h.canUndo;
    redo.disabled = !h.canRedo;
    undo.title = h.canUndo ? `Desfazer: ${h.nextUndo} (Ctrl+Z)` : 'Nada para desfazer';
    redo.title = h.canRedo ? `Refazer: ${h.nextRedo} (Ctrl+Y)` : 'Nada para refazer';
    undo.setAttribute('aria-label', undo.title);
    redo.setAttribute('aria-label', redo.title);
    $('#status-history').textContent = `Histórico: ${h.past.length} ${h.past.length === 1 ? 'ação' : 'ações'} · ${formatBytes(h.bytes)}`;
  };
  editor.on('history', update);
  update();
  $('#save').innerHTML = icon('disk', 18);
  $('#save').addEventListener('click', () => save());
}

function buildStatus() {
  const pos = $('#status-position');
  const color = $('#status-color');
  const sizeLabel = $('#status-size');
  const zoom = $('#status-zoom');
  const sel = $('#status-selection');
  editor.on('pointer', (p) => {
    if (!p) {
      pos.textContent = '–';
      color.textContent = '';
      color.style.removeProperty('--color');
      return;
    }
    pos.textContent = `${p.x}, ${p.y}`;
    const c = editor.doc.composite(editor.state.frame)[p.y * editor.doc.width + p.x];
    color.textContent = c >>> 24 ? colorToHex(c) : 'transparent';
    color.style.setProperty('--color', colorToHex(c, true));
  });
  editor.on('shape', ({ width, height }) => (pos.textContent = `${width} × ${height}`));
  editor.on('offset', ({ dx, dy }) => (pos.textContent = `Δ ${dx}, ${dy}`));
  editor.on('selection', (r) => {
    sel.textContent = r?.width ? `Seleção: ${r.width} × ${r.height} em ${r.x}, ${r.y}` : '';
  });
  const size = () => (sizeLabel.textContent = `${editor.doc.width} × ${editor.doc.height} · ${editor.doc.frames.length} quadro(s) · ${editor.doc.layers.length} camada(s)`);
  editor.on('document', size);
  editor.on('zoom', ({ zoom: z }) => (zoom.textContent = `${z * 100}%`));
  editor.on('sample', ({ color: c }) => {
    if (!c) notify('Esse pixel está transparente.', 'info', 1200);
  });
  size();
}

function updateStorage() {
  const s = $('#status-storage');
  const server = storage.type === 'server';
  s.replaceChildren(el('span', { class: 'icon-label', html: icon(server ? 'cloud' : 'folder', 14) }), server ? ' Servidor Django' : DESKTOP ? ' Desktop (este computador)' : ' Modo local (navegador)');
  s.title = server
    ? 'Projetos e paletas salvos no banco de dados do servidor'
    : DESKTOP
      ? 'App desktop: projetos e paletas guardados neste computador, na pasta do Crivo em AppData'
      : 'Sem servidor: projetos ficam no IndexedDB deste navegador';
}

function shortcuts(e) {
  const target = e.target;
  if (e.defaultPrevented) return;
  if (target instanceof HTMLElement && (target.isContentEditable || ['INPUT', 'TEXTAREA', 'SELECT'].includes(target.tagName) || target.closest('.menu'))) return;
  if (document.querySelector('dialog[open]')) return;
  // While the mouse button is still pressed (stroke, shape, selection or drag in progress), only Esc works:
  // any other command would change the document in the middle of the gesture and scramble the history.
  if (controller.active) {
    if (e.key === 'Escape') {
      controller.cancel();
      e.preventDefault();
    }
    return;
  }
  const ctrl = e.ctrlKey || e.metaKey;
  const k = e.key.toLowerCase();
  if (runExtraShortcut(e, ctrl, k)) {
    e.preventDefault();
    return;
  }
  if (ctrl) {
    if (k === 'z' && !e.shiftKey) execute('undo');
    else if (k === 'y' || (k === 'z' && e.shiftKey)) execute('redo');
    else if (k === 's') execute('save');
    else if (k === 'o') execute('openFile');
    else if (k === 'e') execute(e.shiftKey ? 'exportData' : 'exportImage');
    else if (k === 'c' && e.altKey) execute('size');
    else if (k === 'g' && e.shiftKey) execute('exportGif');
    else if (k === 'a') execute('selectAll');
    else if (k === 'd') execute('deselect');
    else if (k === 'c') execute('copy');
    else if (k === 'x') execute('cut');
    else if (k === 'v') execute('paste');
    else return;
    e.preventDefault();
    return;
  }
  if (e.altKey) return;
  if (k.startsWith('arrow') && editor.state.tool === 'movePixels') {
    const step = e.shiftKey ? 8 : 1;
    const [dx, dy] = { arrowleft: [-step, 0], arrowright: [step, 0], arrowup: [0, -step], arrowdown: [0, step] }[k];
    controller.push(dx, dy);
    e.preventDefault();
    return;
  }
  if (k === 't') {
    execute(e.shiftKey ? 'shiftHalf' : 'tile');
    e.preventDefault();
    return;
  }
  if (e.shiftKey && (k === 'h' || k === 'v')) {
    execute(k === 'h' ? 'flipH' : 'flipV');
    e.preventDefault();
    return;
  }
  const tool = TOOLS.find((f) => f.shortcut.toLowerCase() === k);
  if (tool) editor.setState('tool', tool.id);
  else if (k === 'x') editor.swapColors();
  else if (k === 'g') execute('grid');
  else if (k === 'k') execute('onionSkin');
  else if (k === 'm') {
    const modes = ['none', 'horizontal', 'vertical', 'both'];
    const next = modes[(modes.indexOf(editor.state.symmetry) + 1) % modes.length];
    editor.setState('symmetry', next);
    notify(`Simetria: ${{ none: 'desligada', horizontal: 'horizontal', vertical: 'vertical', both: 'horizontal e vertical' }[next]}`, 'info', 1000);
  } else if (k === '[' || k === ']') {
    editor.setState('size', Math.max(1, Math.min(32, editor.state.size + (k === ']' ? 1 : -1))));
    if (['pencil', 'eraser', 'line', 'dither', 'shade'].includes(editor.state.tool)) buildOptions();
  } else if (k === '+' || k === '=') viewport.zoomStep(1);
  else if (k === '-' || k === '_') viewport.zoomStep(-1);
  else if (k === '0') viewport.fit();
  else if (k === '1') execute('zoom100');
  else if (k === ',') editor.selectFrame(editor.state.frame - 1);
  else if (k === '.') editor.selectFrame(editor.state.frame + 1);
  else if (k === 'enter') editor.state.playing ? editor.stop() : editor.play();
  else if (k === 'delete' || k === 'backspace') execute('clearLayer');
  else if (k === '?') execute('shortcuts');
  else if (k === 'escape') editor.setSelection(null);
  else return;
  e.preventDefault();
}

const palette = new PalettePanel($('#palette-panel'), editor, () => storage);
new ColorPanel($('#color-panel'), editor);
new RampPanel($('#ramp-panel'), editor, palette);
new LayersPanel($('#layers-panel'), editor);
new Timeline($('#timeline'), editor);

const autosave = delay(() => {
  const doc = editor.doc;
  saveDraft({ data: serialize(doc), project: editor.project, modified: editor.modified, savedAt: new Date().toISOString() });
}, 1200);

// Saves the draft right away, without waiting for autosave. Used when closing the tab or the desktop app.
function saveDraftNow() {
  autosave.cancel();
  return saveDraft({ data: serialize(editor.doc), project: editor.project, modified: editor.modified, savedAt: new Date().toISOString() });
}
editor.on('history', autosave);
editor.on('saved', autosave);

async function init() {
  applyTheme(readPreference('theme', 'system'));
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
    if (readPreference('theme', 'system') === 'system') applyTheme('system');
  });
  $('#theme').addEventListener('click', toggleTheme);
  // Same proportion as the project logo (docs/images/logo.svg) and the app icon: pointer at about half the height.
  $('#logo').innerHTML = icon('logo', 18);
  installLayers(app);
  installSelection(app);
  installColor(app);
  installFiles(app);
  buildTools();
  buildOptions();
  buildView();
  buildMenus();
  buildName();
  buildHistory();
  buildStatus();
  updateStorage();
  window.addEventListener('keydown', shortcuts);
  window.addEventListener('beforeunload', () => {
    saveDraftNow();
  });
  if (DESKTOP) {
    // F11 works anywhere in the app, even with a dialog open or while typing in a field.
    window.addEventListener(
      'keydown',
      (e) => {
        if (e.key !== 'F11') return;
        e.preventDefault();
        execute('fullscreen');
      },
      true,
    );
    // The app calls this before closing the window (Alt+F4 or the X), so the draft does not lose the last strokes.
    window.__crivoBeforeClose = saveDraftNow;
  }
  const draft = await readDraft();
  if (draft?.data) {
    try {
      const doc = deserialize(draft.data);
      editor.load(doc, draft.project);
      editor.modified = Boolean(draft.modified);
      editor.emit('history');
    } catch {
      notify('O rascunho anterior não pôde ser recuperado.', 'warning');
    }
  }
  const server = await ServerStorage.detect();
  if (server) {
    storage = server;
    updateStorage();
    palette.load();
  }
  document.body.classList.add('ready');
}

init();

window.crivo = { editor, viewport, app, version: VERSION };
return {  };
})();
})();
</script>
