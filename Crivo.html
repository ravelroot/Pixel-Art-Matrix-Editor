        continue;
      }
      const m = line.match(/^\s*(\d{1,3})\s+(\d{1,3})\s+(\d{1,3})/);
      if (m) add(hexToColor('#' + [m[1], m[2], m[3]].map((v) => Math.min(255, +v).toString(16).padStart(2, '0')).join('')));
    }
  } else {
    for (const line of content.split(/\r?\n/)) {
      const t = line.trim();
      if (!t || t.startsWith(';') || t.startsWith('//')) continue;
      for (const chunk of t.split(/[\s,;]+/)) {
        if (/^(#|0x)?[0-9a-f]{8}$/i.test(chunk) && extension === 'txt' && !chunk.startsWith('#')) {
          const h = chunk.replace(/^0x/i, '');
          add(hexToColor(h.slice(2) + h.slice(0, 2)));
        } else if (/^(#|0x)?([0-9a-f]{3}|[0-9a-f]{6}|[0-9a-f]{8})$/i.test(chunk)) {
          add(hexToColor(chunk));
        }
      }
    }
  }
  if (!colors.length) throw new Error('Nenhuma cor encontrada no arquivo.');
  return { name: String(name).slice(0, 80), colors };
}

function exportPalette(palette, format = 'hex') {
  if (format === 'gpl') {
    const lines = ['GIMP Palette', `Name: ${palette.name}`, 'Columns: 8', '#'];
    for (const c of palette.colors) {
      const [r, g, b] = unpack(c);
      lines.push(`${String(r).padStart(3)} ${String(g).padStart(3)} ${String(b).padStart(3)}\t${colorToHex6(c).slice(1)}`);
    }
    return lines.join('\n') + '\n';
  }
  if (format === 'json') {
    return JSON.stringify({ name: palette.name, colors: palette.colors.map((c) => colorToHex(c)) }, null, 2) + '\n';
  }
  return palette.colors.map((c) => colorToHex(c).slice(1)).join('\n') + '\n';
}

function extractPalette(pixels, limit = 256) {
  const counts = new Map();
  for (const c of pixels) if (c >>> 24) counts.set(c, (counts.get(c) || 0) + 1);
  return [...counts.entries()]
    .sort((a, b) => b[1] - a[1])
    .slice(0, limit)
    .map(([c]) => c);
}
return { PRESET_PALETTES, normalizePalette, importPalette, exportPalette, extractPalette };

function bitmapPath(bitmap) {

        let end = x;
        while (end < line.length && line[end] === '#') end++;
        d += `M${x} ${y}h${end - x}v1h-${end - x}z`;
        x = end;
      } else x++;
    }
  });
  return d;
}

  const bitmap = BITMAPS[name];

  const side = Math.max(l, a) + 2;
  const ox = (side - l) / 2;
  const oy = (side - a) / 2;
  const safe = String(label).replace(/[&<>"']/g, (c) => `&#${c.charCodeAt(0)};`);
  const aria = label ? `role="img" aria-label="${safe}"` : 'aria-hidden="true"';
  return `<svg class="icon" width="${size}" height="${size}" viewBox="${-ox} ${-oy} ${side} ${side}" shape-rendering="crispEdges" ${aria}><path fill="currentColor" d="${bitmapPath(bitmap)}"/></svg>`;
}

  csv: { name: 'CSV', extension: 'csv' },
  js: { name: 'JavaScript', extension: 'js' },
  py: { name: 'Python', extension: 'py' },
  c: { name: 'C', extension: 'h' },
  java: { name: 'Java', extension: 'java' },

function identifier(name, style = 'camel') {
  const parts = String(name || 'sprite')
    .normalize('NFD')
    .replace(/[̀-ͯ]/g, '')
    .split(/[^A-Za-z0-9]+/)
    .filter(Boolean)
    .map((p) => p.toLowerCase());

  if (/^[0-9]/.test(parts[0])) parts.unshift('sprite');

function buildMatrices(frames, width, height, { mode = 'indices', palette = null } = {}) {
  const order = new Map();
  if (palette) for (const c of palette) if (c >>> 24 && !order.has(c)) order.set(c, order.size);
  if (mode === 'indices') {
    for (const px of frames) for (const c of px) if (c >>> 24 && !order.has(c)) order.set(c, order.size);

    const rows = [];

        if (mode === 'indices') row.push(c >>> 24 ? order.get(c) : -1);
        else row.push(c >>> 24 ? colorToHex(c) : null);

      rows.push(row);
    }

  });

function rowsBlock(matrix, indent, openBracket, closeBracket, quotes, nullText, width = 0) {

    .map((row) => indent + openBracket + row.map((v) => valueText(v, quotes, nullText).padStart(width)).join(', ') + closeBracket)

    `  "width": ${data.width},\n` +

    (data.mode === 'indices' ? '  "transparent": -1,\n' : '') +

    .map((q) => '    {\n' + q.map((l) => '        {' + l.map((v) => String(convert(v)).padStart(w)).join(', ') + '}').join(',\n') + '\n    }')

    `#define ${ID}_WIDTH ${data.width}\n#define ${ID}_HEIGHT ${data.height}\n#define ${ID}_FRAMES ${data.frames.length}\n` +
    `#define ${ID}_COLORS ${data.palette.length}\n\n` +
    `static const uint32_t ${id}_palette[${Math.max(1, data.palette.length)}] = {${palette}};\n\n` +
    `static const ${type} ${id}_pixels[${ID}_FRAMES][${ID}_HEIGHT][${ID}_WIDTH] = {\n` +

    `\n};\n\n#endif\n`

const JAVA_LITERAL_LIMIT = 4096;
const JAVA_CHUNK = 20000;

function javaText(codes) {
  let s = '';
  for (const c of codes) {
    if (c === 34) s += '\\"';
    else if (c === 92) s += '\\\\';
    else if (c >= 32 && c < 127) s += String.fromCharCode(c);
    else if (c < 128) s += '\\' + c.toString(8).padStart(3, '0');
    else s += '\\u' + c.toString(16).toUpperCase().padStart(4, '0');

function javaChunks(codes, indent) {

function argb(hex) {

    `    public static final int WIDTH = ${data.width};\n` +
    `    public static final int HEIGHT = ${data.height};\n` +

    `\n    public static final int[] PALETTE;\n` +
    `    public static final int[][][] FRAMES;\n\n` +
    `    // Matrix too large for a Java literal (64 KB limit per method): the values are packed\n` +
    `    // as text, ${oneChar ? 'one character per pixel (value + 33)' : 'two characters per value (high and low 16 bits)'}, and are read when the class loads.\n` +
    `    private static final String[] PALETTE_DATA = {\n${javaChunks(colors, '        ')}${colors.length ? ',' : ''}\n    };\n\n` +
    `    private static final String[] DATA = {\n${javaChunks(codes, '        ')},\n    };\n\n` +

    `        for (int f = 0, i = 0; f < ${data.frames.length}; f++)\n` +
    `            for (int y = 0; y < HEIGHT; y++)\n` +

    `        for (String part : parts) text.append(part);\n` +
    `        int[] values = new int[total];\n` +
    `        for (int i = 0, k = 0; i < total; i++) {\n` +
    `            if (width == 1) values[i] = text.charAt(k++) - base;\n` +
    `            else values[i] = ((text.charAt(k++) << 16) | text.charAt(k++)) - base;\n` +
    `        }\n` +
    `        return values;\n` +
    `    }\n\n` +
    `    private ${className}() {\n    }\n}\n`
  );
}

function generateJava(data, name) {
  const className = identifier(name, 'pascal');
  if (data.frames.length * data.height * data.width > JAVA_LITERAL_LIMIT || data.palette.length > 2048) return generateCompactJava(data, className);
  const convert = (v) => (data.mode === 'indices' ? v : v === null ? '0x00000000' : hexToInt(v, 'argb'));

    .map((q) => '        {\n' + q.map((l) => '            {' + l.map((v) => String(convert(v)).padStart(w)).join(', ') + '}').join(',\n') + '\n        }')

    `public final class ${className} {\n\n` +
    `    public static final int WIDTH = ${data.width};\n` +
    `    public static final int HEIGHT = ${data.height};\n` +

    `    public static final int[][][] FRAMES = {\n` +
    frames +
    `\n    };\n\n    private ${className}() {\n    }\n}\n`
  );

function generateData(format, data, name) {

    case 'json':

    case 'csv':

    case 'js':
      return generateJS(data, name);
    case 'py':
      return generatePython(data, name);
    case 'c':
      return generateC(data, name);
    case 'java':
      return generateJava(data, name);
    default:
      throw new Error('Formato desconhecido: ' + format);
  }

function sheetLayout(count, width, height, { layout = 'horizontal', columns = 4, spacing = 0, margin = 0 } = {}) {
  let cols;
  if (layout === 'horizontal') cols = count;
  else if (layout === 'vertical') cols = 1;
  else cols = Math.max(1, Math.min(count, Math.round(columns) || 1));
  const rows = Math.ceil(count / cols);
  const positions = [];
  for (let i = 0; i < count; i++) {
    const c = i % cols;
    const l = Math.floor(i / cols);
    positions.push({ x: margin + c * (width + spacing), y: margin + l * (height + spacing), width, height });
  }
  return {
    columns: cols,
    rows,
    width: margin * 2 + cols * width + (cols - 1) * spacing,
    height: margin * 2 + rows * height + (rows - 1) * spacing,
    positions,

async function request(path, { method = 'GET', body, time = 15000 } = {}) {
  const control = new AbortController();
  const t = setTimeout(() => control.abort(), time);
  try {
    const resp = await fetch(API + path, {
      method: method,
      headers: {
        Accept: 'application/json',
        ...(body !== undefined ? { 'Content-Type': 'application/json' } : {}),
        ...(method !== 'GET' ? { 'X-CSRFToken': readCookie('csrftoken') } : {}),
      },
      body: body !== undefined ? JSON.stringify(body) : undefined,
      credentials: 'same-origin',
      signal: control.signal,
    });
    if (resp.status === 204) return null;
    const type = resp.headers.get('content-type') || '';
    const data = type.includes('application/json') ? await resp.json() : await resp.text();
    if (!resp.ok) {
      const error = new Error((data && data.error) || `Erro ${resp.status} no servidor.`);
      error.status = resp.status;
      error.data = data;
      throw error;
    }
    return data;
  } finally {
    clearTimeout(t);
  }

function migrateLegacyStores(db, tx) {

      for (const p of e.target.result || []) {
        projects.put({
          id: p.id,
          name: p.nome,
          data: upgradeDocument(p.dados),
          thumbnail: p.miniatura ?? null,
          revision: p.revisao ?? null,
          updated_at: p.atualizado_em || new Date().toISOString(),

      }
      db.deleteObjectStore('projetos');
    };
  }
  if (db.objectStoreNames.contains('rascunho')) {
    tx.objectStore('rascunho').get('atual').onsuccess = (e) => {
      const r = e.target.result;
      if (r) {

      if (!db.objectStoreNames.contains('draft')) db.createObjectStore('draft');
      migrateLegacyStores(db, req.transaction);

      resolve(req?.result);
    };

      db.close();
      reject(tx.error);

  });

function preview(canvas, maximum = 320) {
  const c = el('canvas', { class: 'export-preview' });
  const side = Math.max(canvas.width, canvas.height);
  const scale = side <= maximum ? Math.max(1, Math.min(8, Math.floor(maximum / side))) : maximum / side;
  c.width = Math.max(1, Math.round(canvas.width * scale));
  c.height = Math.max(1, Math.round(canvas.height * scale));
  const ctx = c.getContext('2d');
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(canvas, 0, 0, c.width, c.height);
  return c;
}

function buildSheet(doc, options) {
  const s = options.scale;
  const layout = sheetLayout(doc.frames.length, doc.width * s, doc.height * s, options);
  const px = new Uint32Array(layout.width * layout.height);
  doc.frames.forEach((_, i) => {
    const canvas = pixelsToCanvas(doc.composite(i), doc.width, doc.height, s);
    const data = canvas.getContext('2d').getImageData(0, 0, canvas.width, canvas.height);
    paste(px, layout.width, new Uint32Array(data.data.buffer), canvas.width, canvas.height, layout.positions[i].x, layout.positions[i].y);
  });
  return { layout, canvas: pixelsToCanvas(px, layout.width, layout.height) };
}

async function importImageDialog(editor) {
  const file = await pickFile('image/png,image/jpeg,image/gif,image/webp,image/bmp');
  if (!file) return;
  let img;
  try {
    img = await fileToPixels(file);
  } catch (error) {
    notify('Não deu para ler a imagem: ' + error.message, 'error');
    return;
  }
  const detected = scaleDetection(img.pixels, img.width, img.height);
  const dest = selectField('Abrir como', [['project', 'Novo projeto'], ['layer', 'Nova camada no projeto atual'], ['sheet', 'Animação (fatiar como sprite sheet)']], 'project');
  const factor = numberField('Tamanho de cada pixel na imagem', detected, { min: 1, max: 64 });
  const frameWidth = numberField('Largura de cada quadro', Math.min(img.width, 32), { min: 1, max: MAX_SIDE });
  const frameHeight = numberField('Altura de cada quadro', Math.min(img.height, 32), { min: 1, max: MAX_SIDE });
  const sheetBlock = el('div', { class: 'form-grid wide' }, frameWidth.label, frameHeight.label);
  const info = el('p', { class: 'hint wide' });
  const area = el('div', { class: 'preview-area wide' }, preview(pixelsToCanvas(img.pixels, img.width, img.height), 280));
  const update = () => {
    const f = Math.max(1, +factor.input.value || 1);
    sheetBlock.hidden = dest.select.value !== 'sheet';
    const L = Math.floor(img.width / f);
    const A = Math.floor(img.height / f);
    info.textContent = `Imagem: ${img.width} × ${img.height}. ${f > 1 ? `Reduzida ${f}× fica com ${L} × ${A}.` : ''} ${detected > 1 ? `O Crivo detectou blocos de ${detected}×${detected}.` : ''}`;
  };
  for (const i of [dest.select, factor.input]) i.addEventListener('input', update);
  update();
  const error = el('p', { class: 'error', role: 'alert' });
  const r = await openDialog({
    title: `Importar ${file.name}`,
    body: el('div', { class: 'form-grid' }, dest.label, factor.label, sheetBlock, info, area, error),
    actions: [
      { label: 'Cancelar', value: null },
      {
        label: 'Importar',
        primary: true,
        send: true,
        action: () => {
          const f = Math.max(1, Math.round(+factor.input.value) || 1);
          const reduced = downscale(img.pixels, img.width, img.height, f);
          if (reduced.width > MAX_SIDE || reduced.height > MAX_SIDE) {
            error.textContent = `A imagem reduzida ainda passa de ${MAX_SIDE} pixels. Aumente o tamanho do pixel.`;
            return false;
          }
          return { ...reduced, dest: dest.select.value, fw: +frameWidth.input.value, fh: +frameHeight.input.value };
        },
      },
    ],
  });
  if (!r) return;
  const name = file.name.replace(/\.[^.]+$/, '');
  if (r.dest === 'project') {
    const d = new PixelDocument(r.width, r.height, { name });
    d.cell(d.frames[0].id, d.layers[0].id).set(r.pixels);
    editor.load(d);
  } else if (r.dest === 'layer') {
    editor.editStructure('Importar imagem', (d) => {
      const c = d.addLayer(name);
      const destPx = d.cell(editor.currentFrame.id, c.id);
      const L = Math.min(d.width, r.width);
      const A = Math.min(d.height, r.height);
      for (let y = 0; y < A; y++) for (let x = 0; x < L; x++) destPx[y * d.width + x] = r.pixels[y * r.width + x];
      editor.state.layerId = c.id;
    });
    if (r.width > editor.doc.width || r.height > editor.doc.height) notify('A imagem é maior que a matriz e foi cortada. Use Imagem → Tamanho da matriz para ampliar.', 'warning', 5000);
  } else {
    const fw = Math.max(1, Math.min(r.width, r.fw));
    const fh = Math.max(1, Math.min(r.height, r.fh));
    const cols = Math.floor(r.width / fw);
    const rows = Math.floor(r.height / fh);
    const d = new PixelDocument(fw, fh, { name, empty: true });
    const layer = d.addLayer('Camada 1');
    for (let j = 0; j < rows; j++) {
      for (let i = 0; i < cols; i++) {
        const px = crop(r.pixels, r.width, i * fw, j * fh, fw, fh);
        if (!px.some((v) => v >>> 24)) continue;
        const q = d.addFrame();
        d.cell(q.id, layer.id).set(px);
      }
    }
    if (!d.frames.length) d.addFrame();
    editor.load(d);
    notify(`${d.frames.length} quadro(s) importados.`, 'success');
  }
}

async function projectsDialog(editor, storage, open) {

    });
    menu.addEventListener('keydown', (e) => {
      const focusItems = [...menu.querySelectorAll('.menu-item')];
      const i = focusItems.indexOf(document.activeElement);
      if (e.key === 'ArrowDown') focusItems[(i + 1) % focusItems.length].focus();
      else if (e.key === 'ArrowUp') focusItems[(i - 1 + focusItems.length) % focusItems.length].focus();
      else if (e.key === 'Escape') {
        close();
        button.focus();
      } else return;
      e.preventDefault();
    });
    bar.append(el('div', { class: 'menu-group' }, button, menu));
  }
  document.addEventListener('click', close);
}

function flipLayer(axis) {
  if (!editor.canEditLayer()) return;
  const label = axis === 'horizontal' ? 'Espelhar na horizontal' : 'Espelhar na vertical';
  const r = editor.clippedSelection;
  if (r) {
    const d = editor.doc;
    const px = editor.activeCell();
    const changes = [];
    for (let y = 0; y < r.height; y++) {
      for (let x = 0; x < r.width; x++) {
        const sx = axis === 'horizontal' ? r.width - 1 - x : x;
        const sy = axis === 'vertical' ? r.height - 1 - y : y;
        changes.push([(r.y + y) * d.width + r.x + x, px[(r.y + sy) * d.width + r.x + sx]]);
      }
    }
    editor.applyChanges(label, changes);
    return;
  }
  editor.editStructure(label, (d) => d.flipCell(editor.activeCell(), axis));
}

// Replaces the exact primary color with the secondary one on the current layer, in every frame (respects the selection).
function replaceColor() {
  if (!editor.canEditLayer()) return;
  const { primaryColor: from, secondaryColor: to } = editor.state;
  if (from === to) {
    notify('A cor primária e a secundária são iguais.', 'info');
    return;
  }
  const layer = editor.currentLayer;
  const sel = editor.selection;
  let total = 0;
  editor.editStructure('Substituir cor', (d) => {
    for (const q of d.frames) {
      if (!d.hasCell(q.id, layer.id)) continue;
      const px = d.cell(q.id, layer.id);
      for (let i = 0; i < px.length; i++) {
        if (px[i] !== from) continue;
        if (sel && !contains(sel, i % d.width, (i / d.width) | 0)) continue;
        px[i] = to;
        total++;
      }
    }
    return total > 0;
  });
  notify(total ? `${total} pixel(s) trocados em ${layer.name}.` : 'A cor primária não aparece nesta camada.', total ? 'success' : 'info');
}

function rotate(dir) {
  editor.editStructure(dir > 0 ? 'Girar à direita' : 'Girar à esquerda', (d) => d.rotate(dir));
  viewport.fit();
}

// Color and outline filters: act on the current cell and, if there is a selection, only inside it.
function applyFilter(label, fn) {
  if (!editor.canEditLayer()) return;
  const d = editor.doc;
  const sel = editor.selection;
  const filter = sel ? (i) => contains(sel, i % d.width, (i / d.width) | 0) : null;
  editor.applyChanges(label, fn(editor.activeCell(), d, filter));
}

function copy(cut) {
  const d = editor.doc;
  const area = editor.clippedSelection ?? { x: 0, y: 0, width: d.width, height: d.height };
  editor.clipboard = extractRegion(editor.activeCell(), d.width, area);
  editor.clipboard.origin = { x: area.x, y: area.y };
  if (cut) {
    if (!editor.canEditLayer()) return;
    editor.applyChanges('Recortar', [...indicesOf(area, d.width, d.height)].map((i) => [i, 0]));
  } else {
    notify(`Copiado: ${area.width} × ${area.height} px`, 'info', 1200);
  }
}

function paste() {
  const region = editor.clipboard;
  if (!region) {
    notify('Nada para colar. Selecione uma área e use Ctrl+C.', 'info');
    return;
  }
  if (!editor.canEditLayer()) return;
  const d = editor.doc;
  const dest = editor.selection ?? region.origin ?? { x: 0, y: 0 };
  const x = Math.min(Math.max(0, dest.x), Math.max(0, d.width - region.width));
  const y = Math.min(Math.max(0, dest.y), Math.max(0, d.height - region.height));
  const changes = [];
  pasteRegion(region, d.width, d.height, x, y, (i, c) => changes.push([i, c]), { opaqueOnly: true });
  const background = editor.activeCell().slice();
  editor.applyChanges('Colar', changes, { silent: true });
  editor.setSelection({ x, y, width: region.width, height: region.height });
  // The pasted content "floats" over the background: Move pixels (V) carries only it, without dragging or punching holes in what is below.
  editor.floating = { key: editor.activeKey, region, background, x, y, version: editor.history.version };
  editor.setState('tool', 'movePixels');
}

function cropToSelection() {
  const r = editor.clippedSelection;
  if (!r) {
    notify('Faça uma seleção primeiro (ferramenta S).', 'info');
    return;
  }
  editor.editStructure('Recortar para a seleção', (d) => d.crop(r.x, r.y, r.width, r.height));
  editor.setSelection(null);
  viewport.fit();
}

function trim() {
  const d = editor.doc;
  const r = contentBounds(d.cells.values(), d.width, d.height);
  if (!r) {
    notify('O projeto está vazio: nada para aparar.', 'info');
    return;
  }
  if (r.width === d.width && r.height === d.height) {
    notify('Não há bordas transparentes para aparar.', 'info');
    return;
  }
  editor.editStructure('Aparar bordas', (doc) => doc.crop(r.x, r.y, r.width, r.height));
  editor.setSelection(null);
  viewport.fit();
  notify(`Aparado para ${r.width} × ${r.height}.`, 'success');
}

function shiftHalf() {
  if (!editor.canEditLayer()) return;
  const d = editor.doc;
  const shifted = shiftWrapped(editor.activeCell(), d.width, d.height, Math.floor(d.width / 2), Math.floor(d.height / 2));
  editor.applyChanges('Deslocar meia matriz', [...shifted].map((c, i) => [i, c]));
}

function toggleTheme() {
  const current = document.documentElement.dataset.theme;
  const next = current === 'dark' ? 'light' : 'dark';
  writePreference('theme', next);
  applyTheme(next);
}

function projectData() {
  const doc = editor.doc;
  doc.palette = palette.current.colors.slice(0, 256);
  return {
    name: doc.name,
    data: serialize(doc),
    thumbnail: thumbnail(doc.composite(0), doc.width, doc.height, 128),
  };
}

async function save(copy = false) {
  const base = projectData();
  try {
    if (storage.type === 'server') {
      let r;
      const id = copy ? null : editor.project.id;
      try {
        r = await storage.saveProject({ ...base, id, revision: editor.project.revision });
      } catch (error) {
        if (error.status !== 409) throw error;
        const overwrite = await confirm('Projeto alterado em outro lugar', 'Este projeto foi salvo por outra aba ou pessoa depois que você o abriu. Salvar por cima mesmo assim? A outra versão continua no histórico de versões.', 'Salvar por cima');
        if (!overwrite) return;
        r = await storage.saveProject({ ...base, id, revision: null });
      }
      editor.markSaved({ id: r.id, revision: r.revision, local: null });
    } else {
      const r = await storage.saveProject({ ...base, id: copy ? null : editor.project.local });
      editor.markSaved({ local: r.id, id: null, revision: null });
    }
    notify(`"${editor.doc.name}" salvo em ${storage.name}.`, 'success');
  } catch (error) {
    notify('Não foi possível salvar: ' + error.message, 'error', 6000);
  }
}

async function openProject(id) {
  if (editor.modified && !(await confirm('Abrir outro projeto', 'As mudanças não salvas deste projeto serão perdidas.', 'Abrir mesmo assim', true))) return;
  try {
    const p = await storage.openProject(id);
    const doc = deserialize(p.data);
    editor.load(doc, storage.type === 'server' ? { id: p.id, revision: p.revision, local: null } : { id: null, revision: null, local: p.id });
    notify(`"${doc.name}" aberto.`, 'success');
  } catch (error) {
    notify('Não foi possível abrir: ' + error.message, 'error', 6000);
  }
}

async function openFile() {
  const file = await pickFile('.crivo,.json,application/json');
  if (!file) return;
  if (editor.modified && !(await confirm('Abrir arquivo', 'As mudanças não salvas deste projeto serão perdidas.', 'Abrir mesmo assim', true))) return;
  try {
    const doc = deserialize(await file.text());
    editor.load(doc);
    notify(`"${doc.name}" aberto.`, 'success');
  } catch (error) {
    notify('Arquivo inválido: ' + error.message, 'error', 6000);
  }
}

function downloadCrivo() {
  const { data } = projectData();
  downloadText(JSON.stringify(data), fileNameFor(editor.doc.name, 'crivo'), 'application/json');
}

function buildName() {
  const input = $('#project-name');
  const update = () => {
    if (document.activeElement !== input) input.value = editor.doc.name;
    document.title = `${editor.modified ? '• ' : ''}${editor.doc.name} · Crivo`;
  };
  input.addEventListener('change', () => {
    const v = input.value.trim().slice(0, 120) || 'Sem título';
    if (v === editor.doc.name) return;
    editor.editStructure('Renomear projeto', (d) => {
      d.name = v;
    });
  });
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') input.blur();
  });
  editor.on('document', update);
  editor.on('history', update);
  update();
}

function buildHistory() {
  const undo = $('#undo');
  const redo = $('#redo');
  undo.innerHTML = icon('undo', 18);
  redo.innerHTML = icon('redo', 18);
  undo.addEventListener('click', () => editor.undo());
  redo.addEventListener('click', () => editor.redo());
  const update = () => {
    const h = editor.history;
    undo.disabled = !h.canUndo;
    redo.disabled = !h.canRedo;
    undo.title = h.canUndo ? `Desfazer: ${h.nextUndo} (Ctrl+Z)` : 'Nada para desfazer';
    redo.title = h.canRedo ? `Refazer: ${h.nextRedo} (Ctrl+Y)` : 'Nada para refazer';
    undo.setAttribute('aria-label', undo.title);
    redo.setAttribute('aria-label', redo.title);
    $('#status-history').textContent = `Histórico: ${h.past.length} ${h.past.length === 1 ? 'ação' : 'ações'} · ${formatBytes(h.bytes)}`;
  };
  editor.on('history', update);
  update();
  $('#save').innerHTML = icon('disk', 18);
  $('#save').addEventListener('click', () => save());
}

function buildStatus() {
  const pos = $('#status-position');
  const color = $('#status-color');
  const sizeLabel = $('#status-size');
  const zoom = $('#status-zoom');
  const sel = $('#status-selection');
  editor.on('pointer', (p) => {
    if (!p) {
      pos.textContent = '–';
      color.textContent = '';
      color.style.removeProperty('--color');
      return;
    }
    pos.textContent = `${p.x}, ${p.y}`;
    const c = editor.doc.composite(editor.state.frame)[p.y * editor.doc.width + p.x];
    color.textContent = c >>> 24 ? colorToHex(c) : 'transparent';
    color.style.setProperty('--color', colorToHex(c, true));
  });
  editor.on('shape', ({ width, height }) => (pos.textContent = `${width} × ${height}`));
  editor.on('offset', ({ dx, dy }) => (pos.textContent = `Δ ${dx}, ${dy}`));
  editor.on('selection', (r) => {
    sel.textContent = r?.width ? `Seleção: ${r.width} × ${r.height} em ${r.x}, ${r.y}` : '';
  });
  const size = () => (sizeLabel.textContent = `${editor.doc.width} × ${editor.doc.height} · ${editor.doc.frames.length} quadro(s) · ${editor.doc.layers.length} camada(s)`);
  editor.on('document', size);
  editor.on('zoom', ({ zoom: z }) => (zoom.textContent = `${z * 100}%`));
  editor.on('sample', ({ color: c }) => {
    if (!c) notify('Esse pixel está transparente.', 'info', 1200);
  });
  size();
}

function updateStorage() {
  const s = $('#status-storage');
  const server = storage.type === 'server';
  s.replaceChildren(el('span', { class: 'icon-label', html: icon(server ? 'cloud' : 'folder', 14) }), server ? ' Servidor Django' : DESKTOP ? ' Desktop (este computador)' : ' Modo local (navegador)');
  s.title = server
    ? 'Projetos e paletas salvos no banco de dados do servidor'
    : DESKTOP
      ? 'App desktop: projetos e paletas guardados neste computador, na pasta do Crivo em AppData'
      : 'Sem servidor: projetos ficam no IndexedDB deste navegador';
}

function shortcuts(e) {
  const target = e.target;
  if (e.defaultPrevented) return;
  if (target instanceof HTMLElement && (target.isContentEditable || ['INPUT', 'TEXTAREA', 'SELECT'].includes(target.tagName) || target.closest('.menu'))) return;
  if (document.querySelector('dialog[open]')) return;
  // While the mouse button is still pressed (stroke, shape, selection or drag in progress), only Esc works:
  // any other command would change the document in the middle of the gesture and scramble the history.
  if (controller.active) {
    if (e.key === 'Escape') {
      controller.cancel();
      e.preventDefault();
    }
    return;
  }
  const ctrl = e.ctrlKey || e.metaKey;
  const k = e.key.toLowerCase();
  if (ctrl) {
    if (k === 'z' && !e.shiftKey) execute('undo');
    else if (k === 'y' || (k === 'z' && e.shiftKey)) execute('redo');
    else if (k === 's') execute('save');
    else if (k === 'o') execute('openFile');
    else if (k === 'e') execute(e.shiftKey ? 'exportData' : 'exportImage');
    else if (k === 'c' && e.altKey) execute('size');
    else if (k === 'g' && e.shiftKey) execute('exportGif');
    else if (k === 'a') execute('selectAll');
    else if (k === 'd') execute('deselect');
    else if (k === 'c') execute('copy');
    else if (k === 'x') execute('cut');
    else if (k === 'v') execute('paste');
    else return;
    e.preventDefault();
    return;
  }
  if (e.altKey) return;
  if (k.startsWith('arrow') && editor.state.tool === 'movePixels') {
    const step = e.shiftKey ? 8 : 1;
    const [dx, dy] = { arrowleft: [-step, 0], arrowright: [step, 0], arrowup: [0, -step], arrowdown: [0, step] }[k];
    controller.push(dx, dy);
    e.preventDefault();
    return;
  }
  if (k === 't') {
    execute(e.shiftKey ? 'shiftHalf' : 'tile');
    e.preventDefault();
    return;
  }
  if (e.shiftKey && (k === 'h' || k === 'v')) {
    execute(k === 'h' ? 'flipH' : 'flipV');
    e.preventDefault();
    return;
  }
  const tool = TOOLS.find((f) => f.shortcut.toLowerCase() === k);
  if (tool) editor.setState('tool', tool.id);
  else if (k === 'x') editor.swapColors();
  else if (k === 'g') execute('grid');
  else if (k === 'k') execute('onionSkin');
  else if (k === 'm') {
    const modes = ['none', 'horizontal', 'vertical', 'both'];
    const next = modes[(modes.indexOf(editor.state.symmetry) + 1) % modes.length];
    editor.setState('symmetry', next);
    notify(`Simetria: ${{ none: 'desligada', horizontal: 'horizontal', vertical: 'vertical', both: 'horizontal e vertical' }[next]}`, 'info', 1000);
  } else if (k === '[' || k === ']') {
    editor.setState('size', Math.max(1, Math.min(32, editor.state.size + (k === ']' ? 1 : -1))));
    if (['pencil', 'eraser', 'line', 'dither', 'shade'].includes(editor.state.tool)) buildOptions();
  } else if (k === '+' || k === '=') viewport.zoomStep(1);
  else if (k === '-' || k === '_') viewport.zoomStep(-1);
  else if (k === '0') viewport.fit();
  else if (k === '1') execute('zoom100');
  else if (k === ',') editor.selectFrame(editor.state.frame - 1);
  else if (k === '.') editor.selectFrame(editor.state.frame + 1);
  else if (k === 'enter') editor.state.playing ? editor.stop() : editor.play();
  else if (k === 'delete' || k === 'backspace') execute('clearLayer');
  else if (k === '?') execute('shortcuts');
  else if (k === 'escape') editor.setSelection(null);
  else return;
  e.preventDefault();
}

const palette = new PalettePanel($('#palette-panel'), editor, () => storage);
new ColorPanel($('#color-panel'), editor);
new RampPanel($('#ramp-panel'), editor, palette);
new LayersPanel($('#layers-panel'), editor);
new Timeline($('#timeline'), editor);

const autosave = delay(() => {
  const doc = editor.doc;
  saveDraft({ data: serialize(doc), project: editor.project, modified: editor.modified, savedAt: new Date().toISOString() });
}, 1200);

// Saves the draft right away, without waiting for autosave. Used when closing the tab or the desktop app.
function saveDraftNow() {
  autosave.cancel();
  return saveDraft({ data: serialize(editor.doc), project: editor.project, modified: editor.modified, savedAt: new Date().toISOString() });
}
editor.on('history', autosave);
editor.on('saved', autosave);

async function init() {
  applyTheme(readPreference('theme', 'system'));
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
    if (readPreference('theme', 'system') === 'system') applyTheme('system');
  });
  $('#theme').addEventListener('click', toggleTheme);
  // Same proportion as the project logo (docs/images/logo.svg) and the app icon: pointer at about half the height.
  $('#logo').innerHTML = icon('logo', 18);
  buildTools();
  buildOptions();
  buildView();
  buildMenus();
  buildName();
  buildHistory();
  buildStatus();
  updateStorage();
  window.addEventListener('keydown', shortcuts);
  window.addEventListener('beforeunload', () => {
    saveDraftNow();
  });
  if (DESKTOP) {
    // F11 works anywhere in the app, even with a dialog open or while typing in a field.
    window.addEventListener(
      'keydown',
      (e) => {
        if (e.key !== 'F11') return;
        e.preventDefault();
        execute('fullscreen');
      },
      true,
    );
    // The app calls this before closing the window (Alt+F4 or the X), so the draft does not lose the last strokes.
    window.__crivoBeforeClose = saveDraftNow;
  }
  const draft = await readDraft();
  if (draft?.data) {
    try {
      const doc = deserialize(draft.data);
      editor.load(doc, draft.project);
      editor.modified = Boolean(draft.modified);
      editor.emit('history');
    } catch {
      notify('O rascunho anterior não pôde ser recuperado.', 'warning');
    }
  }
  const server = await ServerStorage.detect();
  if (server) {
    storage = server;
    updateStorage();
    palette.load();
  }
  document.body.classList.add('ready');
}

init();

window.crivo = { editor, viewport, version: VERSION };
return {  };
})();
})();
</script>
